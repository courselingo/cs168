# CourseLingo 术语表 —— 本项目的核心资产
#
# 规则：key 默认由 en 推导（小写、空格转连字符）。
#   例如 en = "local area network" -> 正文中写 [[term:local-area-network]]
# 正文里出现 glossary 的 en 原词却忘了打标记，validate.py 会报 WARN（术语漂移的前兆）。
# 每新增一条，都要问：这个译法在全课程都成立吗？
#
# 本表覆盖 CS168 前几讲的公共词汇（第 1 讲 + 分层与协议这一条线）。
# 冻结声明会在术语评审后补进 PR 描述，见 docs/SOP.md §4。

# ── 总体概念 ──────────────────────────────────────────────
[[term]]
en = "Internet"
zh = "互联网"
notes = "被互连起来的全球网络之网；与「万维网」不是一回事"

[[term]]
en = "World Wide Web"
zh = "万维网"
aliases = ["Web"]
notes = "跑在互联网之上的应用集合（浏览器里访问的那部分）"

[[term]]
en = "infrastructure"
zh = "基础设施"
notes = "支撑数据传送的硬件与软件总和"

[[term]]
en = "architecture"
zh = "架构"
notes = "本课程里指「设计目标、约束与取舍的总体安排」，不是代码结构"

[[term]]
en = "trade-off"
zh = "权衡"
notes = "一项设计换来的好处与付出的代价，两者必须一起看"

# ── 协议与标准 ────────────────────────────────────────────
[[term]]
en = "protocol"
zh = "协议"
notes = "通信双方约定的报文格式与应答规则"

[[term]]
en = "syntax"
zh = "语法"
notes = "报文长什么样：字段怎么摆、比特怎么排"

[[term]]
en = "semantics"
zh = "语义"
notes = "收到报文之后该做什么、什么条件下才允许发"

[[term]]
en = "RFC"
zh = "RFC 文档"
aliases = ["Request for Comments"]
notes = "互联网标准的公开文档编号体系；协议常以 RFC 编号被引用"

[[term]]
en = "IETF"
zh = "互联网工程任务组"
notes = "负责互联网协议标准化的组织，RFC 由它发布"

[[term]]
en = "IEEE"
zh = "电气电子工程师学会"
notes = "偏底层电气工程一侧的标准组织"

[[term]]
en = "interoperability"
zh = "互操作性"
notes = "不同厂商、不同运营商实现之间能直接对接"

# ── 运营与规模 ────────────────────────────────────────────
[[term]]
en = "federation"
zh = "联邦"
notes = "各自独立运营、又必须互相配合的一群主体构成一个整体"

[[term]]
en = "ISP"
zh = "互联网服务提供商"
aliases = ["Internet service provider"]
notes = "拥有并运营互联网设施的组织，如运营商与云厂商"

[[term]]
en = "scalability"
zh = "可扩展性"
notes = "规模涨几个数量级之后设计还成立"

[[term]]
en = "asynchronous"
zh = "异步"
notes = "发出去之后不等对端回话就继续往下做"

# ── 网络元件 ──────────────────────────────────────────────
[[term]]
en = "end host"
zh = "端主机"
notes = "真正收发数据的机器：服务器、笔记本、手机"

[[term]]
en = "switch"
zh = "交换机"
notes = "自己不收发数据、只为端主机转发数据的机器"

[[term]]
en = "router"
zh = "路由器"
notes = "在多个网络之间转发分组的设备；教材里与交换机常混用"

[[term]]
en = "link"
zh = "链路"
notes = "两台机器之间的一条直接连接，用什么技术都可以"

[[term]]
en = "local area network"
zh = "局域网"
aliases = ["LAN"]
notes = "用链路把一片区域内的机器连起来形成的小网络"

[[term]]
en = "packet"
zh = "分组"
aliases = ["包"]
notes = "在网络里被整块传送的数据单元；本书统一用「分组」"

[[term]]
en = "header"
zh = "首部"
notes = "附加在数据前面的元信息，交代这包数据该去哪儿、怎么处理"

[[term]]
en = "IP address"
zh = "IP 地址"
notes = "全局范围内用来指认一台机器的编号"

# ── 分层 ──────────────────────────────────────────────────
[[term]]
en = "layering"
zh = "分层"
notes = "把「把数据送到地球另一端」拆成几件各自能独立完成的小事"

[[term]]
en = "encapsulation"
zh = "封装"
notes = "上层整块数据被放进下层载荷里，下层再补自己的首部"

[[term]]
en = "physical layer"
zh = "物理层"
notes = "把比特变成能在介质上传输的信号"

[[term]]
en = "link layer"
zh = "链路层"
notes = "在一条链路或一片局域网内把分组送到对端"

[[term]]
en = "network layer"
zh = "网络层"
notes = "跨越多片局域网把分组送到任意目的地；教材里也叫 Internet layer"

[[term]]
en = "transport layer"
zh = "传输层"
notes = "在端主机之间提供进程级的数据通道"

[[term]]
en = "application layer"
zh = "应用层"
notes = "直接面向用户的那一层，如万维网、DNS、音视频"

[[term]]
en = "routing"
zh = "路由"
notes = "决定一条路怎么走：算出路由表"

[[term]]
en = "forwarding"
zh = "转发"
notes = "按已有的路由此刻把分组送出去；与「路由」是两件事"

# ── 后续几讲会用到，先冻结译法 ──────────────────────────────
[[term]]
en = "congestion control"
zh = "拥塞控制"
notes = "根据网络拥堵程度调整发送速率"

[[term]]
en = "bandwidth"
zh = "带宽"
notes = "一条链路每秒能送多少比特"

[[term]]
en = "data center"
zh = "数据中心"
notes = "把成千上万台服务器放在一起的机房集群"

# ── 第 1 讲补入（2026-09-28；作者提出、复核充当第二人确认）──────
[[term]]
en = "narrow waist"
zh = "窄腰"
aliases = ["narrow-waist interface"]
notes = "第 3 层只留一个协议（IP），上下都可以有很多种协议与技术；教材 Network Architecture 一章有同名小节，幻灯片写作 federation via a narrow waist interface"

[[term]]
en = "best-effort"
zh = "尽力而为"
aliases = ["best effort"]
notes = "网络不承诺是否送达、不承诺何时送达，也不通知结果；可靠性交给两端自己实现"

# ── 第 14 讲补入（2026-09-29；作者提出、术语随该讲一并送审）────────
# 这一讲的主题就是「域间路由的模型」，下面这批词是该讲的核心词汇，
# 先冻结译法，供第 14 讲与后续 BGP 相关各讲共用。

[[term]]
en = "autonomous system"
zh = "自治系统"
aliases = ["AS"]
notes = "由一个运营者统一管理的一片或多片本地网络；域间路由把它抽象成 AS 图上的一个节点"

[[term]]
en = "ASN"
zh = "自治系统编号"
aliases = ["autonomous system number"]
notes = "向 IANA 注册后拿到的全局唯一编号；教材点名 UC Berkeley 的 ASN 是 25"

[[term]]
en = "stub autonomous system"
zh = "末端自治系统"
aliases = ["stub AS"]
notes = "只为 AS 内部的主机收发分组、不替别的 AS 转发；类比域内模型里的端主机"

[[term]]
en = "transit autonomous system"
zh = "中转自治系统"
aliases = ["transit AS"]
notes = "替别的 AS 转发分组、靠卖连通性赚钱；类比域内模型里的路由器"

[[term]]
en = "customer-provider relationship"
zh = "客户-提供者关系"
notes = "客户付钱、提供者给连通性的商业关系；AS 图里的箭头从提供者指向客户，且这类关系不成环"

[[term]]
en = "peering"
zh = "对等互联"
notes = "两个 AS 互相送的流量大致相当、通常互不付费；图里画成一条没有箭头的边"

[[term]]
en = "Tier 1"
zh = "一级网络"
notes = "没有提供者（没有入边）的 AS，且彼此两两对等；教材给出的现实数量约为 20 个"

[[term]]
en = "policy-based routing"
zh = "基于政策的路由"
notes = "每个 AS 自己定偏好，协议算出的路径要尊重这些偏好；与「全局最小代价」相对，且协议不要求 AS 公开政策"

[[term]]
en = "valley-free"
zh = "无山谷"
notes = "路径先上坡到峰、再一路下坡，不出现「先下坡又掉头走上坡」的形状；横向的对等边只能出现在峰上"

# ── 第 16 讲补入（BGP 的实现与它的问题）──────────────────────────
# 这一讲的核心词全在 BGP 这条线上：从「一个 AS 当一台机器」到报文属性。
# 键一律用连字符形式（[[term:]] 只接受 [A-Za-z0-9_.-]，含空格的键会被 validate 硬拦）。
# 注意 as-path 这一条：键写作 as-path，正字（en）按源文拼写作 ASPATH。

[[term]]
en = "Border Gateway Protocol"
zh = "边界网关协议"
aliases = ["BGP"]
notes = "互联网上唯一被大规模实现的域间路由协议：交换到目的前缀的 AS 级路径；第 15 讲讲它的规则，第 16 讲把它落到路由器级"

[[term]]
en = "external BGP"
zh = "外部 BGP"
aliases = ["eBGP"]
notes = "不同 AS 的两台路由器之间的 BGP 会话，用来交换宣告、学到通向其他 AS 的路由；只有边界路由器参与"

[[term]]
en = "internal BGP"
zh = "内部 BGP"
aliases = ["iBGP"]
notes = "同一个 AS 内两台路由器之间的 BGP 会话（不要求直连）；边界路由器用它把学到的新路由分发给本 AS 的其他路由器"

[[term]]
en = "interior gateway protocol"
zh = "内部网关协议"
aliases = ["IGP"]
notes = "域内路由协议（距离向量、链路状态等）；与 iBGP 都在 AS 内交换消息，但它管的是本 AS 内的路，两者容易混"

[[term]]
en = "Multi-Exit Discriminator"
zh = "多出口鉴别器"
aliases = ["MED"]
notes = "导出方在宣告里附加的偏好，等价于从导出路由器到目的地的距离；数值越小越优先，是导入时的第 4 条打破平局依据"

[[term]]
en = "local preference"
zh = "本地优先级"
notes = "把一个 AS 内部的 Gao-Rexford 导入规则编码成数值：客户路由设高值、提供者路由设低值；局部属性，只在 iBGP 消息里携带"

[[term]]
en = "ASPATH"
zh = "AS 路径"
key = "as-path"
aliases = ["AS path"]
notes = "宣告里这条路由经过的 AS 列表（按反向顺序），如 [3, 72, 25]；长度是第 2 条打破平局依据，源文明写它是全局属性"

[[term]]
en = "border router"
zh = "边界路由器"
notes = "至少有一条链路通向别的 AS 的路由器；只有它需要对外宣告路由，也只有它参与 eBGP"

[[term]]
en = "interior router"
zh = "内部路由器"
notes = "只有通向本 AS 内其他路由器的链路；参与 iBGP，不参与 eBGP"

[[term]]
en = "egress router"
zh = "出口路由器"
notes = "对外宣告某目的地路由的边界路由器；外部转发表是指向它的，但它通常不是下一跳，要用 IGP 走到它"

[[term]]
en = "hot potato routing"
zh = "热土豆路由"
notes = "选最近的出口路由器的策略：希望分组尽快离开自己的 AS、尽快开始走别人的链路；它算的是「我到你有多远」"

[[term]]
en = "prefix hijacking"
zh = "前缀劫持"
notes = "恶意 AS 宣告自己到不了、或根本不存在的便宜前缀，把流量引到自己这里再删改分组；BGP 没有内建安全保证"

[[term]]
en = "BGP speaker"
zh = "BGP 发声者"
notes = "宣告 BGP 路由的路由器；必须懂 BGP 的语法与语义（怎么读、怎么造宣告，收到宣告该做什么）"

[[term]]
en = "route reflector"
zh = "路由反射器"
notes = "现实里用来减少 iBGP 会话数的组合方式；本课程不展开"

[[term]]
en = "route attribute"
zh = "路由属性"
notes = "Update 报文里跟着目的前缀的名值对（教材的非网络例子是 color=red）；分局部与全局两类"

# ── 第 18 讲补入（2026-09-29；传输层原理，供第 18–26 讲共用）────────
# 第 18 讲是传输层的起点：端口、解复用、字节流、UDP，以及「至少一次 → 恰好一次」
# 这两级交付承诺，是后面 TCP 设计、TCP 实现、拥塞控制各讲反复要用的词，先冻结译法。
# ★ 加之前把候选的英文原词在**前 17 讲正文**里逐条扫过：
#   port number / flow control / datagram / bytestream / well-known port /
#   ephemeral port / at-least-once delivery / exactly-once delivery —— 出现 **0 次**；
#   只有 demultiplexing 在 04-network-architecture 出现过（该页「溯源」里已自行登记
#   「目前不在 glossary.toml 里」）⇒ 加完那页会报 2 条漂移 WARN（第 84 行与「溯源」段），
#   补一个标记即可；本讲的作者不动别人的目录，这处留给定稿人处理。

[[term]]
en = "port number"
zh = "端口号"
notes = "16 位，用来在端主机上指认某个具体应用；0-1023 是熟知端口，1024-65535 通常临时分给客户端"

[[term]]
en = "well-known port"
zh = "熟知端口"
aliases = ["well known port"]
notes = "编号 0-1023，服务器在这些号上监听请求；教材举的例子是 HTTP 的 80 与 SSH 的 22"

[[term]]
en = "ephemeral port"
zh = "临时端口"
notes = "客户端自己挑的号（通常在 1024-65535），连接结束就可以放弃，不需要长期占用"

[[term]]
en = "demultiplexing"
zh = "解复用"
aliases = ["demultiplex"]
notes = "按端口号把到达的数据分给端主机上对应的那个进程"

[[term]]
en = "flow control"
zh = "流量控制"
notes = "限制发送速率以免压垮接收方；与拥塞控制（怕压垮网络）是相邻但不同的两件事"

[[term]]
en = "datagram"
zh = "数据报"
notes = "UDP 的一条消息，只能装进一个分组，不承诺到达与顺序"

[[term]]
en = "reliable in-order bytestream"
zh = "可靠有序字节流"
notes = "传输层给应用的抽象：长度不限、顺序不变、不丢字节；教材的比方是一根管子"

[[term]]
en = "at-least-once delivery"
zh = "至少一次交付"
notes = "目的地至少收到每个分组一次且未被损坏，但允许收到重复拷贝；传输层用尽力而为的网络实现它"

[[term]]
en = "exactly-once delivery"
zh = "恰好一次交付"
notes = "在至少一次之上把重复去掉，得到的效果；这是给应用看的那一层"

# ── 第 19 讲补入（2026-09-29；TCP 设计，供第 19–26 讲共用）────────
# 第 19 讲是 TCP 设计：确认与超时、窗口与在途、流量控制与拥塞控制、三种确认方式。
# 下面这批词是该讲的核心词汇，也是后面 TCP 实现、拥塞控制各讲反复要用的，先冻结译法。
# ★ 加之前把候选英文原词在**前 18 讲正文**里逐条扫过（grep 全仓 index.md）：
#   one-way delay / round-trip time / acknowledgment / negative acknowledgement / timer /
#   sequence number / in flight / stop and wait / window / advertised window /
#   congestion window / bottleneck link / cumulative ack / full information ack /
#   duplicate ack / buffer / reordering —— 出现 **0 次**；
#   checksum 在第 17 讲的英文引文里出现 1 次（加完那一页会报 1 条漂移 WARN，
#   第 17 讲「溯源」已有同类登记，留给定稿人补标记）；
#   flow control 在第 18 讲的「溯源」段里出现，而该词条是第 18 讲自己加的 —— 是它的在制品。
#   两条都不属于本讲的目录，本讲作者按规矩不动别人的页面。

[[term]]
en = "one-way delay"
zh = "单向时延"
notes = "一个分组从发送方走到接收方所花的时间；与往返时间相对"

[[term]]
en = "round-trip time"
zh = "往返时间"
aliases = ["RTT"]
notes = "发送方到接收方、再加上回程的时间；确认与超时都以它为尺子，也是窗口大小的一个因子"

[[term]]
en = "acknowledgment"
zh = "确认"
aliases = ["ack"]
notes = "接收方回给发送方的一条消息，说明某个分组已经收到；收到它就撤销计时器"

[[term]]
en = "negative acknowledgement"
zh = "否定确认"
aliases = ["nack"]
notes = "接收方明确要求重发某分组的消息；教材说明 TCP 没有实现它，TCP 选择的是等超时"

[[term]]
en = "timer"
zh = "计时器"
notes = "发送方为每个已发出、还没被确认的分组开的倒计时；到点未收到确认就重发"

[[term]]
en = "timeout"
zh = "超时"
notes = "计时器到点仍未收到确认这件事；可靠性的兜底机制，代价是要等一个往返时间"

[[term]]
en = "checksum"
zh = "校验和"
notes = "首部里的检错字段；传输层的校验和与 IP 层的不是同一个，且这一层不是只覆盖首部"

[[term]]
en = "sequence number"
zh = "序列号"
notes = "挂在每个分组上的编号；让确认能对上具体分组，也让接收方把乱序的分组排回顺序"

[[term]]
en = "in flight"
zh = "在途"
notes = "分组已发出、对应的确认还没回来的状态；窗口限的就是它的数量"

[[term]]
en = "stop and wait"
zh = "停等协议"
notes = "分组 i 的确认到了才发分组 i+1；可靠但每个分组至少要花一个往返时间"

[[term]]
en = "window"
zh = "窗口"
notes = "允许同时有多少个分组在途的上限 W，不是一次能发几个；每收到一条确认就往前滑一格并补发"

[[term]]
en = "advertised window"
zh = "通告窗口"
notes = "接收方在确认里报出的缓冲区剩余空间；在途分组数不能超过它，这是流量控制的抓手"

[[term]]
en = "congestion window"
zh = "拥塞窗口"
aliases = ["cwnd"]
notes = "发送方跑拥塞控制算法得到的输出，代表这条连接应得的那份瓶颈带宽；实践中窗口取它与通告窗口里更小的那个"

[[term]]
en = "bottleneck link"
zh = "瓶颈链路"
notes = "路径上带宽最小的那条链路；往返时间乘它的带宽就是「把管道填满」所需的窗口"

[[term]]
en = "full information ack"
zh = "全信息确认"
notes = "把已经收到过的分组都列出来的确认；丢了也能靠后面的确认补上，代价是列表越来越长"

[[term]]
en = "cumulative ack"
zh = "累积确认"
notes = "只报「到这个号为止、连同它前面的都收到了」的最大号；不会变长，但丢包时认不出该重发哪一个"

[[term]]
en = "duplicate ack"
zh = "重复确认"
notes = "内容与上一条相同、因而暴露了中间有空洞的确认；累积确认下重复到 K 次就可以判定那个分组丢了"

[[term]]
en = "buffer"
zh = "缓冲区"
notes = "接收方为乱序到达的分组留出的内存；空间有限，因此需要流量控制"

[[term]]
en = "reordering"
zh = "乱序"
notes = "分组到达的次序与发出的次序不一致；字节流的抽象要求按序交付，所以乱序的分组要先缓冲"

# ── 第 20 讲补入（2026-09-29；TCP 实现，供第 20–26 讲共用）────────
# 第 20 讲是 TCP 的实现：把设计落到字节上（段与 MSS、字节编号与 ISN、状态、
# 全双工、三次握手、FIN/RST、捎带确认、滑动窗口、重传、首部字段）。
# 下面这批词是该讲的核心词汇，也是后面拥塞控制各讲反复要用的，先冻结译法。
# ★ 加之前把候选英文原词在**前 19 讲正文**里逐条扫过（并复现 validate.py 的
#   漂移正则，跳过已打标记的页）：
#   TCP segment / maximum segment size / maximum transmission unit /
#   initial sequence number / connection-oriented / full duplex /
#   three-way handshake / sliding window / piggybacking / half-closed /
#   retransmission / flag —— 出现 **0 次**（`ISN`/`FIN`/`RST`/`SYN` 那几个
#   简单匹配命中全是 first / find / synchronize 之类的子串，按词边界正则不命中）。
#   ⇒ 本批 12 条**不会**让任何更早的页面报漂移。
# ★ 键一律用连字符形式（[[term:]] 只接受 [A-Za-z0-9_.-]）。

[[term]]
en = "TCP segment"
zh = "TCP 段"
notes = "发送方从字节流里攒出来、可以整段发出去的数据单位；攒满固定上限就发，或者等计时器到点发"

[[term]]
en = "maximum segment size"
zh = "最大段长度"
aliases = ["MSS"]
notes = "一个 TCP 段能装多少字节；等于链路的 MTU 减掉 IP 首部与 TCP 首部，所以总比 MTU 小"

[[term]]
en = "maximum transmission unit"
zh = "最大传输单元"
aliases = ["MTU"]
notes = "一条链路能作为一个整体承载的最大分组字节数；第 17 讲已用它讲过分片，本讲把它与 MSS 挂钩"

[[term]]
en = "initial sequence number"
zh = "初始序列号"
aliases = ["ISN"]
notes = "一条字节流的起点编号；第一个字节编成 ISN+1，而 ISN 本身由 SYN 占掉，随机选是为了避免编号撞车与被人猜出来"

[[term]]
en = "connection-oriented"
zh = "面向连接"
notes = "两端要先建立连接、把状态初始化好才能送数据，用完还要拆除；与「每个分组独立处理」的第三层相对"

[[term]]
en = "full duplex"
zh = "全双工"
notes = "一条连接里两端可以同时发送与接收，因此一条连接带两条字节流，每个报文可以同时带数据与确认"

[[term]]
en = "three-way handshake"
zh = "三次握手"
notes = "用 SYN、SYN-ACK、ACK 三个报文，就两个方向各自的 ISN 达成一致；这也是字节流从 ISN+1 开始编号的原因"

[[term]]
en = "sliding window"
zh = "滑动窗口"
notes = "同一时刻允许在途的最大连续字节数；左边是第一个未确认字节，只能靠确认号变大而向右滑"

[[term]]
en = "piggybacking"
zh = "捎带确认"
notes = "压着确认不发，等自己有数据要发时一起发出去；TCP 允许它，但操作系统与应用互相看不见对方的安排，实践中常常发生不了"

[[term]]
en = "half-closed"
zh = "半关闭"
notes = "一端发了 FIN、承诺不再发数据但继续收数据时的连接状态；等另一端也发 FIN 并被确认，连接才真正关掉"

[[term]]
en = "retransmission"
zh = "重传"
notes = "把没被确认的数据再发一遍；两个触发条件是盯住窗口左边的单个计时器到点、或收到 K 个重复确认，满足一个就够"

[[term]]
en = "flag"
zh = "标志位"
notes = "TCP 首部里可以置 1 或置 0 的比特；置 1 表示该标志生效，本讲用到的是 SYN 与 ACK（FIN 与 RST 在结束连接一节）"

# ── 第 21 讲补入（2026-09-29；拥塞控制原理，供第 21–26 讲共用）────────
# 第 21 讲是拥塞控制的起点：拥塞的代价、1986 年那次拥塞崩溃、它为什么难、
# 好算法的目标，以及预留 / 定价 / 动态调整这三条设计路线。
# 下面这批词是该讲的核心词汇，后面拥塞控制各讲会反复用到，先冻结译法。
# ★ 加之前把候选英文原词在**前 20 讲正文**里逐条扫过（grep content/**/index.md）：
#   congestion collapse / dynamic adjustment / fairness / pricing /
#   host-based / router-assisted —— 出现 **0 次**。
#   唯一的例外不在正文里：router-assisted 只作为第 26 讲的 slug 出现在
#   docs/lecture-manifest.md（该文件不是内容页，漂移判据不扫它）。
# ★ `reservation`（预留）**故意没有登记**：英文原词已在第 5 讲
#   （05-designing-resource-sharing，RSVP 那一段）出现 3 次，登记会让那一页报漂移；
#   本讲作者按规矩不动别人的目录，留给后续统一处理。
# ★ 键一律用连字符形式（[[term:]] 只接受 [A-Za-z0-9_.-]）。

[[term]]
en = "congestion collapse"
zh = "拥塞崩溃"
notes = "网络容量因为大量重发而大幅下降的状态；教材给的例子是 1986 年 10 月 Berkeley 到 Lawrence Berkeley Lab 那条链路吞吐从 32 Kbps 掉到 40 bps，而启用 TCP 拥塞控制之后互联网再没出现过它"

[[term]]
en = "dynamic adjustment"
zh = "动态调整"
notes = "主机动态地学当前的拥塞程度、再据此调整发送速率；教材说今天所有现代算法都走这条路，它实用是因为容易推广（不需要商业模式，也不假定用户提前知道带宽）"

[[term]]
en = "host-based congestion control"
zh = "主机侧拥塞控制"
aliases = ["host-based"]
notes = "发送方自己盯着表现、自己调速率，路由器不提供任何特殊支持；当年改 TCP 的那个补丁属于这一类，与「路由器协助」相对"

[[term]]
en = "router-assisted congestion control"
zh = "路由器协助拥塞控制"
aliases = ["router-assisted"]
notes = "路由器把拥塞信息明确地送回发送方（有的只送一个比特，有的直接给出建议速率）；拥塞发生在路由器上，所以路由器有条件提供这类信息"

[[term]]
en = "fairness"
zh = "公平"
notes = "每条连接分到的可用容量应该一样多；教材把严格定义留到后面，先只用这个粗略说法，它与效率一起构成算法的两个目标"

[[term]]
en = "pricing"
zh = "定价"
notes = "按拥堵程度收钱来分配带宽（收费快车道、节假日机票都是这个形状）；没有大规模部署，原因是需要一套把付款与拥塞连起来的商业模式"

[[term]]
en = "slow start"
zh = "慢启动"
notes = "TCP 从 1 个分组的窗口起步，每收到一个确认加 1，效果是每个 RTT 窗口翻一倍；撞上丢包时结束，并把 SSTHRESH 记成当前窗口的一半"

[[term]]
en = "slow start threshold"
zh = "慢启动阈值"
notes = "源文缩写成 SSTHRESH，用来记住慢启动探出来的不丢包最大安全速率；窗口超过它就切到加法增，初始为无穷大"

[[term]]
en = "congestion avoidance"
zh = "拥塞避免"
notes = "慢启动之后把窗口每个 RTT 加 1 个分组的那个阶段；本讲里它就是 AIMD 的加法增那一半"

[[term]]
en = "additive increase multiplicative decrease"
zh = "加法增乘法减"
notes = "没丢包就按每个确认 1/CWND 加窗口，丢了包就乘性地减；通常缩写成 AIMD"

[[term]]
en = "event-driven update"
zh = "事件驱动更新"
notes = "不按「每轮」这种测不准的节拍动窗口，改成挂到 TCP 本来就在响应的事件上：新确认、3 个重复确认、超时"

[[term]]
en = "fast retransmit"
zh = "快速重传"
notes = "收到 3 个重复确认就重发窗口最左边那个分组，不必等计时器烧完"

[[term]]
en = "fast recovery"
zh = "快恢复"
notes = "收到 3 个重复确认后临时进入的模式：CWND 设成 CWND/2 + 3，之后每个重复确认加 1 把窗口人为加宽，收到新的非重复确认时把 CWND 设回 SSTHRESH 并退出"

[[term]]
en = "sawtooth"
zh = "锯齿"
notes = "把速率画成时间的函数得到的形状：慢启动的指数上升、丢包砍半、AIMD 的线性上升、再砍半，反复上下"

[[term]]
en = "TCP Tahoe"
zh = "TCP Tahoe"
notes = "BSD 时期的变体之一；收到 3 个重复确认时把 CWND 重置为 1，而不是减半"

[[term]]
en = "TCP Reno"
zh = "TCP Reno"
notes = "收到 3 个重复确认时把 CWND 减半，遇到超时才把 CWND 重置为 1"

[[term]]
en = "TCP New Reno"
zh = "TCP New Reno"
notes = "源文把 Reno 加上快恢复称作 TCP New Reno，并说本讲实现的就是它；这条归法存疑，见第 23 讲溯源里的登记"

[[term]]
en = "selective acknowledgment"
zh = "选择性确认"
notes = "让确认能说出收到了哪一段而不只是累积到哪；源文的例子是「13 之前的都收到了，另外 18 也收到了」，通常缩写成 SACK"

[[term]]
en = "packet loss"
zh = "丢包"
notes = "主机侧判断拥塞的两条信号之一（另一条是延迟）：信号没有歧义，TCP 本来就在为它检测；代价是会被损坏与乱序污染，而且报得晚（第 22 讲）"

[[term]]
en = "additive increase"
zh = "加法增加"
notes = "每轮给速率加上一个固定的数（加法变动的是两个数的差，同加同减差不变）；与乘法减少合成 AIMD（第 22 讲）"

[[term]]
en = "multiplicative decrease"
zh = "乘法减少"
notes = "每轮把速率乘上一个固定的因子（通常是减半，乘法变动的是两个数的比）；与加法增加合成 AIMD（第 22 讲）"

[[term]]
en = "AIMD"
zh = "加法增加乘法减少"
notes = "additive increase, multiplicative decrease：慢加、快减。四种加减组合里唯一会让两条连接的差距收敛到 0 的那种（第 22 讲）"

[[term]]
en = "BBR"
zh = "BBR 协议"
notes = "Google 在 2016 年提出的基于延迟的拥塞控制，用来说明延迟这条信号在实践中可行；源文只给到这一句（第 22 讲）"

[[term]]
en = "throughput"
zh = "吞吐量"
notes = "单位时间内成功送达的数据量。TCP 的吞吐量不是一个固定值，它随丢包率与往返时间变化；本讲把它写成 RTT 与丢包率的函数（第 24 讲）"

[[term]]
en = "loss rate"
zh = "丢包率"
notes = "发送的分组里被丢掉的比例，源文记作 p。吞吐量模型的另一半输入：两次丢包之间发 N 个分组、丢 1 个，则 p = 1/N（第 24 讲）"

[[term]]
en = "rate-based congestion control"
zh = "基于速率的拥塞控制"
notes = "源文也叫 equation-based：不按丢包动态调速率的规则办，而是测出 RTT 与丢包率、代进吞吐量公式，按算出的速率恒速发（第 24 讲）"

[[term]]
en = "TCP-friendly"
zh = "TCP 友好"
notes = "替代实现的判据：与 TCP 共存时该降速就降速，因而不会比同样情形下的 TCP 多吃带宽；一条链路上两种实现混跑也能公平分享（第 24 讲）"

[[term]]
en = "corruption"
zh = "损坏"
notes = "分组在链路上被改动而内容出错；它与拥塞是丢包的两个不同来源，而 TCP 只看得到丢包这个结果"

[[term]]
en = "bufferbloat"
zh = "缓冲膨胀"
notes = "路由器把队列做得过大，导致排队时延长期偏高；源头是缓冲区容量远超所需的带宽时延积"

[[term]]
en = "fair queuing"
zh = "公平排队"
notes = "路由器按连接分队列、按公平的方式挑队列发送，用排队本身强制跨连接的公平；它只保证一条链路上的分配（第 26 讲）"

[[term]]
en = "max-min fairness"
zh = "最大最小公平"
notes = "分配口径 a_i = min(f, r_i)，f 是唯一让所有 a_i 之和等于总容量的值；等长分组下轮询就是这种分配（第 26 讲）"

[[term]]
en = "round-robin"
zh = "轮询"
notes = "依次从每个队列各取一个分组发送；分组等长时它是最大最小公平的一种实现（第 26 讲）"

[[term]]
en = "first-in-first-out"
zh = "先进先出"
notes = "默认的队列纪律：按到达顺序送出，路由器不区分分组属于哪条连接；源文缩写成 FIFO（第 26 讲）"

[[term]]
en = "explicit congestion notification"
zh = "显式拥塞通知"
notes = "IP 首部里由路由器置位的拥塞信号，缩写成 ECN；接收方在回复的确认里把它带回发送方，源文写作一个位而规范里是两个比特（第 26 讲）"

[[term]]
en = "deficit round robin"
zh = "赤字轮询"
notes = "公平排队在高速路由器里的近似实现，源文举的例子；现代路由器一般用近似，并把队列数开得比连接数少（第 26 讲）"

[[term]]
en = "Domain Name System"
zh = "域名系统"
notes = "把人类可读的名字翻译成 IP 地址的那套系统；本课程里只取它的第一个应用场景"

[[term]]
en = "name server"
zh = "名字服务器"
notes = "专门回答 DNS 请求的服务器；一台名字服务器负责一个区域，它自己也有域名与 IP 地址"

[[term]]
en = "name resolution"
zh = "名字解析"
notes = "把一个域名翻成对应 IP 地址的过程"

[[term]]
en = "zone"
zh = "区域"
notes = "某个组织有权管理的那一部分名字空间；一个区域有一台或多台名字服务器为它应答"

[[term]]
en = "root server"
zh = "根服务器"
notes = "名字空间树最顶层的那批服务器，它的区域写成点号"

[[term]]
en = "recursive resolver"
zh = "递归解析器"
notes = "替终端主机去逐个问名字服务器、并把最终答案带回来的服务器"

[[term]]
en = "stub resolver"
zh = "存根解析器"
notes = "主机上那一小段负责把查询交给递归解析器的代码；它自己也可以有缓存"

[[term]]
en = "resource record"
zh = "资源记录"
notes = "DNS 报文里的键值对；键写成名字、类别与类型，值写成生存时间与数据"

[[term]]
en = "time-to-live"
zh = "生存时间"
notes = "一条记录可以被缓存多少秒；源文在报文里沿用了 TTL 这个缩写"

[[term]]
en = "anycast"
zh = "任播"
notes = "多台镜像对外宣告同一个 IP 地址，于是谁离得近就由谁来应答"

[[term]]
en = "top-level domain"
zh = "顶级域"
notes = "根区域下面那一层区域，例如 com、edu、uk"

[[term]]
en = "MX record"
zh = "MX 记录"
notes = "把域名映射到邮件服务器的资源记录，值里还带一个优先级"

[[term]]
en = "registrar"
zh = "注册商"
notes = "持有一批区域的商业机构，用户向它购买区域里的域名，由它把名字到地址的映射加进名字服务器"

[[term]]
en = "load balancing"
zh = "负载均衡"
notes = "把同一个域名对应到多个 IP 地址，或按请求来源返回不同地址，用来摊开访问压力"

[[term]]
en = "cache"
zh = "缓存"
notes = "把已经查到的记录留在本地或解析器上一段时间，避免重复去问"
