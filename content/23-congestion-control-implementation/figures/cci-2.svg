<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" width="760" height="305"
     role="img" aria-labelledby="fig-cci-2-title fig-cci-2-desc">
  <title id="fig-cci-2-title">窗口与速率是同一个量的两种单位</title>
  <desc id="fig-cci-2-desc">第一行三格：分组视图把窗口看成多少个分组，本讲为了简单按这个算；字节视图把窗口看成多少字节，实践里 TCP 按这个算；两者靠 MSS 换算，MSS 乘分组数等于字节数。三格之间各有一支向右的箭头。第二行一条横格给出等式：速率乘 RTT 等于窗口大小，并带进一组数字，MSS 50 字节、窗口 10 个分组等于 500 字节、RTT 100 ms，于是速率是每秒 5000 字节。最下方注明速率和窗口是同一个量的两种单位，调速率就是在调窗口。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="305" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">窗口与速率是同一个量的两种单位</text>

  <rect x="22" y="76" width="221" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="132.5" y="98" font-size="12" fill="#1e40af" text-anchor="middle">① 分组视图</text>
  <text x="132.5" y="116" font-size="12" fill="#1e40af" text-anchor="middle">窗口 = 多少个分组</text>
  <text x="132.5" y="134" font-size="12" fill="#1e40af" text-anchor="middle">本讲为简单按这个算</text>

  <rect x="269" y="76" width="221" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="379.5" y="98" font-size="12" fill="#b45309" text-anchor="middle">② 字节视图</text>
  <text x="379.5" y="116" font-size="12" fill="#b45309" text-anchor="middle">窗口 = 多少字节</text>
  <text x="379.5" y="134" font-size="12" fill="#b45309" text-anchor="middle">实践里 TCP 按这个算</text>

  <rect x="516" y="76" width="221" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="626.5" y="98" font-size="12" fill="#166534" text-anchor="middle">③ 换算靠 MSS</text>
  <text x="626.5" y="116" font-size="12" fill="#166534" text-anchor="middle">MSS × 分组数 = 字节数</text>
  <text x="626.5" y="134" font-size="12" fill="#166534" text-anchor="middle">同一个量的两种单位</text>
  <path d="M248,112 L 258,112" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M495,112 L 505,112" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="174" width="715" height="72" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="379.5" y="196" font-size="12" fill="#6b21a8" text-anchor="middle">速率 × RTT = 窗口大小</text>
  <text x="379.5" y="214" font-size="12" fill="#6b21a8" text-anchor="middle">数字例子：MSS 50 字节，窗口 10 个分组 = 500 字节，RTT 100 ms</text>
  <text x="379.5" y="232" font-size="12" fill="#6b21a8" text-anchor="middle">速率 = 500 字节 ÷ 0.1 秒 = 每秒 5000 字节</text>
  <text x="380" y="280" font-size="10" fill="#64748b" text-anchor="middle">速率和窗口是同一个量的两种单位，调速率就是在调窗口</text>
</svg>
