<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" width="760" height="305"
     role="img" aria-labelledby="fig-cci-5-title fig-cci-5-desc">
  <title id="fig-cci-5-title">加法增：每个确认加 1/CWND</title>
  <desc id="fig-cci-5-desc">第一行两格。左边一格说目标是每个 RTT 让窗口加 1 个分组，难点是 RTT 本身测不准，于是换个角度：一个 RTT 里会收到一个窗口那么多的确认。右边一格说把这份增加摊到每个确认上，窗口是 10 就每个确认加 1/10，一个 RTT 下来正好加 1 个分组。第二行一条横格说字节视图还要乘一个 MSS，并给出数字例子：CWND 3 个分组等于 150 字节、MSS 50 字节，50/150 等于 1/3，再乘 MSS，总共加 50 字节。最下方注明增量不是严格线性的，只是够用的近似，CWND 从 4 出发四次更新后是 4.92，精确模型想要 5。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="305" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">加法增：每个确认加 1/CWND</text>

  <rect x="22" y="76" width="344" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="98" font-size="12" fill="#1e40af" text-anchor="middle">① 每个 RTT 想加 1 个分组</text>
  <text x="194" y="116" font-size="12" fill="#1e40af" text-anchor="middle">但 RTT 本身测不准</text>
  <text x="194" y="134" font-size="12" fill="#1e40af" text-anchor="middle">换个角度：一个 RTT 收到一个窗口那么多确认</text>

  <rect x="393" y="76" width="344" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="565" y="98" font-size="12" fill="#b45309" text-anchor="middle">② 摊到每个确认上</text>
  <text x="565" y="116" font-size="12" fill="#b45309" text-anchor="middle">窗口 10 就每个确认加 1/10</text>
  <text x="565" y="134" font-size="12" fill="#b45309" text-anchor="middle">一个 RTT 下来正好加 1 个分组</text>

  <rect x="22" y="174" width="715" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="379.5" y="196" font-size="12" fill="#166534" text-anchor="middle">③ 字节视图还要乘一个 MSS</text>
  <text x="379.5" y="214" font-size="12" fill="#166534" text-anchor="middle">CWND 3 个分组 = 150 字节，MSS = 50 字节</text>
  <text x="379.5" y="232" font-size="12" fill="#166534" text-anchor="middle">50/150 = 1/3，再乘 MSS，总共加 50 字节</text>
  <text x="380" y="280" font-size="10" fill="#64748b" text-anchor="middle">增量不是严格线性的，只是够用的近似：CWND 从 4 出发，四次更新后是 4.92，精确模型想要 5</text>
</svg>
