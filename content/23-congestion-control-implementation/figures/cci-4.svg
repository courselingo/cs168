<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 287" width="760" height="287"
     role="img" aria-labelledby="fig-cci-4-title fig-cci-4-desc">
  <title id="fig-cci-4-title">慢启动：一个 RTT 翻一倍</title>
  <desc id="fig-cci-4-desc">第一行四格按时间从左到右：起步时窗口是 1 个分组，一个 RTT 后变成 2 个，再一个 RTT 后变成 4 个，又一个 RTT 后变成 8 个，格与格之间各有一支向右的箭头。第二行一条横格说明原因：每个确认让窗口加 1 个分组，而一个 RTT 里会收到一个窗口那么多的确认，所以每个 RTT 窗口翻一倍。最下方注明撞上丢包时把 SSTHRESH 设成当前窗口的一半，窗口 32 丢就设成 16。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="287" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">慢启动：一个 RTT 翻一倍</text>

  <rect x="22" y="76" width="159" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="101.5" y="98" font-size="12" fill="#1e40af" text-anchor="middle">① 起步</text>
  <text x="101.5" y="116" font-size="12" fill="#1e40af" text-anchor="middle">窗口 1 个分组</text>

  <rect x="207" y="76" width="159" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="286.5" y="98" font-size="12" fill="#1e40af" text-anchor="middle">② 一个 RTT 后</text>
  <text x="286.5" y="116" font-size="12" fill="#1e40af" text-anchor="middle">窗口 2 个分组</text>

  <rect x="392" y="76" width="159" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="471.5" y="98" font-size="12" fill="#b45309" text-anchor="middle">③ 再一个 RTT</text>
  <text x="471.5" y="116" font-size="12" fill="#b45309" text-anchor="middle">窗口 4 个分组</text>

  <rect x="577" y="76" width="159" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="656.5" y="98" font-size="12" fill="#b45309" text-anchor="middle">④ 又一个 RTT</text>
  <text x="656.5" y="116" font-size="12" fill="#b45309" text-anchor="middle">窗口 8 个分组</text>
  <path d="M186,103 L 196,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M371,103 L 381,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M556,103 L 566,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="156" width="715" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="379.5" y="178" font-size="12" fill="#166534" text-anchor="middle">每个确认让窗口加 1 个分组</text>
  <text x="379.5" y="196" font-size="12" fill="#166534" text-anchor="middle">一个 RTT 里会收到一个窗口那么多的确认</text>
  <text x="379.5" y="214" font-size="12" fill="#166534" text-anchor="middle">所以每个 RTT 窗口翻一倍：1 → 2 → 4 → 8</text>
  <text x="380" y="262" font-size="10" fill="#64748b" text-anchor="middle">撞上丢包时把 SSTHRESH 设成当前窗口的一半：窗口 32 丢，就设成 16</text>
</svg>
