<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 298" width="760" height="298"
     role="img" aria-labelledby="fig-mc-5-title fig-mc-5-desc">
  <title id="fig-mc-5-title">组播放在哪一层：IP 组播与覆盖组播的取舍</title>
  <desc id="fig-mc-5-desc">上排三格是选项一与它的代价：在第三层实现、叫 IP 组播，要给路由器加专门支持让它们懂得组播，换来的是性能更好，付出的是更难实现。第二排三格是选项二与它的代价：在第七层实现、叫覆盖组播，由应用自己包办组播功能，换来的是第三层原封不动、路由器只需要懂单播，因此更容易实现，付出的是性能更差。最下面一条是源文的态度：两者都不是严格更好，这一段会把两种都看一遍并分析它们之间的取舍。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="298" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">组播放在哪一层：IP 组播与覆盖组播的取舍</text>
  <rect x="25" y="64" width="220" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">选项一：第三层</text>
  <text x="135" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">叫 IP 组播</text>
  <text x="135" y="112.5" font-size="10" fill="#1e40af" text-anchor="middle">要给路由器加专门支持，让它们懂得组播</text>
  <rect x="270" y="64" width="220" height="60" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="90" font-size="10" fill="#166534" text-anchor="middle">它换来什么</text>
  <text x="380" y="105" font-size="10" fill="#166534" text-anchor="middle">性能更好</text>
  <rect x="515" y="64" width="220" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="90" font-size="10" fill="#b45309" text-anchor="middle">它付出什么</text>
  <text x="625" y="105" font-size="10" fill="#b45309" text-anchor="middle">更难实现</text>
  <rect x="25" y="152" width="220" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="170.5" font-size="10" fill="#1e40af" text-anchor="middle">选项二：第七层</text>
  <text x="135" y="185.5" font-size="10" fill="#1e40af" text-anchor="middle">叫覆盖组播</text>
  <text x="135" y="200.5" font-size="10" fill="#1e40af" text-anchor="middle">由应用自己包办组播功能</text>
  <rect x="270" y="152" width="220" height="60" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="170.5" font-size="10" fill="#166534" text-anchor="middle">它换来什么</text>
  <text x="380" y="185.5" font-size="10" fill="#166534" text-anchor="middle">第三层原封不动，路由器只需要懂单播</text>
  <text x="380" y="200.5" font-size="10" fill="#166534" text-anchor="middle">因此更容易实现</text>
  <rect x="515" y="152" width="220" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="178" font-size="10" fill="#b45309" text-anchor="middle">它付出什么</text>
  <text x="625" y="193" font-size="10" fill="#b45309" text-anchor="middle">性能更差</text>
  <rect x="25" y="240" width="710" height="33" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="260.35" font-size="11" fill="#6b21a8" text-anchor="middle">源文的态度：两者都不是严格更好；这一段会把两种都看一遍，并分析它们之间的取舍</text>
</svg>
