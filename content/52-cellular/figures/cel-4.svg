<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 277" width="760" height="277"
     role="img" aria-labelledby="fig-cel-4-title fig-cel-4-desc">
  <title id="fig-cel-4-title">移动带来的四个基本挑战</title>
  <desc id="fig-cel-4-desc">上面一条说明蜂窝难在哪里：移动性，而四个基本挑战是这一讲的主线之一。第二排三格是前三个挑战：发现（我在移动时怎么知道该连哪座基站）、认证（AT&amp;T 的基站可能只愿意给自己人提供连接）、无缝通信（移出一座基站、进入另一座时连接不能中断）。第三排三格是第四个挑战与它的来由：计费与追责（只买了 6GB 的用户，超额后应停止或降级）；它来自老蜂窝网的按分钟计费；而它至今还在，是因为蜂窝网络里的资源是稀缺的。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="277" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">移动带来的四个基本挑战</text>
  <rect x="25" y="64" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">蜂窝难在哪里：移动性。四个基本挑战是这一讲的主线之一</text>
  <rect x="25" y="125" width="220" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="145.35" font-size="11" fill="#1e40af" text-anchor="middle">发现</text>
  <text x="135" y="161.85" font-size="11" fill="#1e40af" text-anchor="middle">我在移动时怎么知道该连哪座基站</text>
  <rect x="270" y="125" width="220" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="145.35" font-size="11" fill="#166534" text-anchor="middle">认证</text>
  <text x="380" y="161.85" font-size="11" fill="#166534" text-anchor="middle">基站可能只愿意给自己人提供连接</text>
  <rect x="515" y="125" width="220" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="145.35" font-size="11" fill="#6b21a8" text-anchor="middle">无缝通信</text>
  <text x="625" y="161.85" font-size="11" fill="#6b21a8" text-anchor="middle">换基站时连接不能中断</text>
  <rect x="25" y="202.5" width="220" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="222.85" font-size="11" fill="#b45309" text-anchor="middle">计费与追责</text>
  <text x="135" y="239.35" font-size="11" fill="#b45309" text-anchor="middle">超额后应停止或降级</text>
  <rect x="270" y="202.5" width="220" height="49.5" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="222.85" font-size="11" fill="#1e293b" text-anchor="middle">它从哪来</text>
  <text x="380" y="239.35" font-size="11" fill="#1e293b" text-anchor="middle">老蜂窝网的按分钟计费</text>
  <rect x="515" y="202.5" width="220" height="49.5" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="625" y="222.85" font-size="11" fill="#1e293b" text-anchor="middle">为什么还在</text>
  <text x="625" y="239.35" font-size="11" fill="#1e293b" text-anchor="middle">因为蜂窝网络里的资源是稀缺的</text>
</svg>
