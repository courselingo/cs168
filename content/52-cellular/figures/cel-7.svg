<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" width="760" height="570"
     role="img" aria-labelledby="fig-cel-7-title fig-cel-7-desc">
  <title id="fig-cel-7-title">五步操作、切换为什么复杂，以及漫游的两种走法</title>
  <desc id="fig-cel-7-desc">第一排三格是第 0 步到第 2 步：注册（办套餐、签合同，运营商把信息存进数据库）；发现（在荒郊野外打开手机，发现附近的基站并挑一座）；附着（设备请求连接、基站去问管理器，认证通过后配置一条到互联网的通路）。第二排三格是第 3 步与第 4 步：数据交换（此时设备可以用它的 IP 收发，而转发靠隧道、不靠路由协议）；切换（旧基站、新基站与设备一起决定，由管理器重新配置新通路）；以及切换必须无缝（用户全程可能一直在收发数据，所以网络要一直照看着设备）。第三条解释切换为什么复杂：它不是原子的，旧基站在切换期间继续缓存该用户的数据、切换后再转给新基站转发，而传统 TCP/IP 网络并不需要这种缓存，这是为无缝切换新增的功能。第四条说明决定始终由运营商做：好处是控制力强（过载时可以负载均衡，也可以把低优先级用户送到更差的基站），代价是更慢、要更多往返、更复杂；而切换期间用户的 IP 地址保持不变，只更新隧道。最下面一条是漫游：拜访网络与归属网络的移动性管理器要协调；两种走法是归属路由（包要绕回归属网关，好处是归属网络能追踪用户）与本地疏导（路程更短，但计费更麻烦）。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="570" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">五步操作、切换为什么复杂，以及漫游的两种走法</text>
  <rect x="25" y="64" width="220" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">第 0 步：注册</text>
  <text x="135" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">办套餐、签合同</text>
  <text x="135" y="112.5" font-size="10" fill="#1e40af" text-anchor="middle">运营商把信息存进数据库</text>
  <rect x="270" y="64" width="220" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">第 1 步：发现</text>
  <text x="380" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">在荒郊野外打开手机</text>
  <text x="380" y="112.5" font-size="10" fill="#1e40af" text-anchor="middle">发现附近的基站并挑一座</text>
  <rect x="515" y="64" width="220" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="625" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">第 2 步：附着</text>
  <text x="625" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">设备请求连接，基站去问管理器</text>
  <text x="625" y="112.5" font-size="10" fill="#1e40af" text-anchor="middle">认证通过后配置一条到互联网的通路</text>
  <rect x="25" y="152" width="220" height="60" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="135" y="170.5" font-size="10" fill="#166534" text-anchor="middle">第 3 步：数据交换</text>
  <text x="135" y="185.5" font-size="10" fill="#166534" text-anchor="middle">此时设备可以用它的 IP 收发</text>
  <text x="135" y="200.5" font-size="10" fill="#166534" text-anchor="middle">转发靠隧道，不靠路由协议</text>
  <rect x="270" y="152" width="220" height="60" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="170.5" font-size="10" fill="#166534" text-anchor="middle">第 4 步：切换</text>
  <text x="380" y="185.5" font-size="10" fill="#166534" text-anchor="middle">旧基站、新基站与设备一起决定</text>
  <text x="380" y="200.5" font-size="10" fill="#166534" text-anchor="middle">由管理器重新配置新通路</text>
  <rect x="515" y="152" width="220" height="60" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="170.5" font-size="10" fill="#166534" text-anchor="middle">切换必须无缝</text>
  <text x="625" y="185.5" font-size="10" fill="#166534" text-anchor="middle">用户全程可能一直在收发数据</text>
  <text x="625" y="200.5" font-size="10" fill="#166534" text-anchor="middle">所以网络要一直照看着设备</text>
  <rect x="25" y="240" width="710" height="27" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="256.65" font-size="9" fill="#b45309" text-anchor="middle">切换为什么复杂：它不是原子的，旧基站在切换期间继续缓存该用户的数据，切换后再转给新基站转发；传统 TCP/IP 网络并不需要这种缓存，这是为无缝切换新增的功能</text>
  <rect x="25" y="295" width="710" height="27" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="311.65" font-size="9" fill="#6b21a8" text-anchor="middle">决定始终由运营商做：好处是控制力强，过载时可以负载均衡</text>
  <rect x="25" y="350" width="710" height="27" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="366.65" font-size="9" fill="#6b21a8" text-anchor="middle">也可以把低优先级用户送到更差的基站；代价是更慢、要更多往返、更复杂</text>
  <rect x="25" y="405" width="710" height="27" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="421.65" font-size="9" fill="#6b21a8" text-anchor="middle">切换期间用户的 IP 地址保持不变，只更新隧道</text>
  <rect x="25" y="460" width="710" height="30" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="478.5" font-size="10" fill="#1e293b" text-anchor="middle">漫游：拜访网络与归属网络的移动性管理器要协调</text>
  <rect x="25" y="518" width="710" height="27" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="534.65" font-size="9" fill="#1e293b" text-anchor="middle">两种走法是归属路由（包绕回归属网关，好处是归属网络能追踪用户）与本地疏导（路程更短，但计费更麻烦）</text>
</svg>
