<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221"
     role="img" aria-labelledby="fig-ls-1-title fig-ls-1-desc">
  <title id="fig-ls-1-title">距离向量靠邻居的结果，链路状态靠自己的整张图</title>
  <desc id="fig-ls-1-desc">左栏是距离向量：分布式协作计算，用邻居算出的结果，每台只算自己那一份，只需要邻居给的局部信息，看不到整张网络图。右栏是链路状态：做的是本地计算，每台节点独立地、从零算出完整答案，完全不用邻居的计算结果，但要做到这一点就必须掌握来自网络各处的全局信息。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两条完全不同的思路</text>

  <rect x="22" y="76" width="344" height="90" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="98" font-size="12" fill="#1e40af" text-anchor="middle">距离向量：分布式协作</text>
  <text x="194" y="116" font-size="12" fill="#1e40af" text-anchor="middle">用邻居算出的结果</text>
  <text x="194" y="134" font-size="12" fill="#1e40af" text-anchor="middle">每台只算自己那一份</text>
  <text x="194" y="152" font-size="12" fill="#1e40af" text-anchor="middle">只要邻居的局部信息</text>

  <rect x="394" y="76" width="344" height="90" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="98" font-size="12" fill="#166534" text-anchor="middle">链路状态：本地计算</text>
  <text x="566" y="116" font-size="12" fill="#166534" text-anchor="middle">独立从零算完整答案</text>
  <text x="566" y="134" font-size="12" fill="#166534" text-anchor="middle">不用邻居的结果</text>
  <text x="566" y="152" font-size="12" fill="#166534" text-anchor="middle">但需要全局信息</text>

  <text x="380" y="196" font-size="10" fill="#64748b" text-anchor="middle">一句话：每台路由器学到完整的网络图，再在图上跑最短路填表</text>
</svg>
