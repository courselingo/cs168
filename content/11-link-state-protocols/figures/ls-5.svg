<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 189" width="760" height="189"
     role="img" aria-labelledby="fig-ls-5-title fig-ls-5-desc">
  <title id="fig-ls-5-title">泛滥失控：同一条消息被反复转发，重复数量成倍增长</title>
  <desc id="fig-ls-5-desc">箭头依次向右，是一台路由器广播次数随时间增长的过程：第 1 步 R1 广播给 R2、R3；第 2 步 R2、R3 各自广播；第 3 步 R1 收到两条消息就发出两次广播；到第 5 步，三台路由器分别发出 6 次、5 次、5 次广播。信息其实在第 1 步就学完了，可重复消息成倍增长，最终会把网络压垮。这与为了可靠而每隔几秒重发一次完全不是一回事。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="189" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">泛滥失控</text>

  <rect x="22" y="76" width="160" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="102" y="98" font-size="12" fill="#1e40af" text-anchor="middle">第 1 步</text>
  <text x="102" y="116" font-size="12" fill="#1e40af" text-anchor="middle">R1 广播一次</text>

  <rect x="207" y="76" width="160" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="287" y="98" font-size="12" fill="#1e40af" text-anchor="middle">第 2 步</text>
  <text x="287" y="116" font-size="12" fill="#1e40af" text-anchor="middle">R2、R3 互发</text>

  <rect x="392" y="76" width="160" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="472" y="98" font-size="12" fill="#b45309" text-anchor="middle">第 3 步</text>
  <text x="472" y="116" font-size="12" fill="#b45309" text-anchor="middle">R1 收到两条，发两次</text>

  <rect x="577" y="76" width="160" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="657" y="98" font-size="12" fill="#9d174d" text-anchor="middle">第 5 步</text>
  <text x="657" y="116" font-size="12" fill="#9d174d" text-anchor="middle">6 次 / 5 次 / 5 次</text>

  <path d="M187,103 L 196,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M372,103 L 381,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M557,103 L 566,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <text x="380" y="164" font-size="10" fill="#64748b" text-anchor="middle">信息第 1 步就学完了，重复却在成倍增长；有环时更糟</text>
</svg>
