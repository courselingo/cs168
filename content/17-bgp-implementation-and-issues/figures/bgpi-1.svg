<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 187" width="760" height="187"
     role="img" aria-labelledby="fig-bgpi-1-title fig-bgpi-1-desc">
  <title id="fig-bgpi-1-title">边界路由器对外说话，内部路由器只在本自治系统内转发</title>
  <desc id="fig-bgpi-1-desc">两格并排：边界路由器至少有一条链路通向别的自治系统，只有它需要向别的自治系统宣告路由，这类路由器也叫 BGP 发声者，必须懂 BGP 的语法与语义；内部路由器只有通向本自治系统内其他路由器的链路。所谓「一个自治系统是一台机器」，是靠这两类路由器之间的协议配合实现出来的。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="187" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">自治系统里的两类路由器</text>

  <rect x="22" y="76" width="344" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="98" font-size="12" fill="#1e40af" text-anchor="middle">边界路由器</text>
  <text x="194" y="116" font-size="12" fill="#1e40af" text-anchor="middle">对外宣告路由，也叫 BGP 发声者</text>

  <rect x="394" y="76" width="344" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="98" font-size="12" fill="#166534" text-anchor="middle">内部路由器</text>
  <text x="566" y="116" font-size="12" fill="#166534" text-anchor="middle">只有本自治系统内的链路</text>

  <text x="380" y="162" font-size="10" fill="#64748b" text-anchor="middle">「一个 AS 是一台机器」是内部这些协议配合出来的结果</text>
</svg>
