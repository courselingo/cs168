<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 205" width="760" height="205"
     role="img" aria-labelledby="fig-bgpi-6-title fig-bgpi-6-desc">
  <title id="fig-bgpi-6-title">导入优先级的四步</title>
  <desc id="fig-bgpi-6-desc">箭头依次向右四步：先按 Gao-Rexford 规则，客户宣告的路径优于对等体优于提供者；若优先级相同（例如都来自客户），选更短的那条，也就是经过更少自治系统的；若长度也相同，选出口路由器更近的那条，用 IGP 算距离；若到出口的距离也相同，选 MED 更小的那条。MED 也相同时就随意打破，例如选 IP 地址更小的。教材指出最近的出口路由器与 MED 经常互相矛盾，这也导致互联网上的路径常常不对称。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="205" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">导入优先级的四步</text>

  <rect x="22" y="76" width="160" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="102" y="98" font-size="12" fill="#1e40af" text-anchor="middle">一、钱款关系</text>
  <text x="102" y="116" font-size="12" fill="#1e40af" text-anchor="middle">客户 &gt; 对等</text>
  <text x="102" y="134" font-size="12" fill="#1e40af" text-anchor="middle">&gt; 提供者</text>

  <rect x="207" y="76" width="160" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="287" y="98" font-size="12" fill="#1e40af" text-anchor="middle">二、路径更短</text>
  <text x="287" y="116" font-size="12" fill="#1e40af" text-anchor="middle">经过的 AS 更少</text>
  <text x="287" y="134" font-size="12" fill="#1e40af" text-anchor="middle">看 ASPATH</text>

  <rect x="392" y="76" width="160" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="472" y="98" font-size="12" fill="#b45309" text-anchor="middle">三、出口更近</text>
  <text x="472" y="116" font-size="12" fill="#b45309" text-anchor="middle">用 IGP 算距离</text>
  <text x="472" y="134" font-size="12" fill="#b45309" text-anchor="middle">热土豆路由</text>

  <rect x="577" y="76" width="160" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="657" y="98" font-size="12" fill="#166534" text-anchor="middle">四、MED 更小</text>
  <text x="657" y="116" font-size="12" fill="#166534" text-anchor="middle">对方希望你走的</text>
  <text x="657" y="134" font-size="12" fill="#166534" text-anchor="middle">那条</text>

  <path d="M187,112 L 196,112" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M372,112 L 381,112" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M557,112 L 566,112" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <text x="380" y="180" font-size="10" fill="#64748b" text-anchor="middle">前两步与第三步经常互相拉扯，于是互联网上的路径常常不对称</text>
</svg>
