<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 205" width="760" height="205"
     role="img" aria-labelledby="fig-model-9-title fig-model-9-desc">
  <title id="fig-model-9-title">链路只是尽力而为：发出去不保证到达</title>
  <desc id="fig-model-9-desc">第三层及以下都是尽力而为：分组在一条链路上发出之后，并不保证它到达对面，链路可能把它丢掉。所以路由协议不能假设发出去就一定到，它得在会丢包、会变图、每台路由器只知道一小块的情况下，仍然让分组走到目的地。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="205" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">链路只是尽力而为</text>

  <rect x="22" y="76" width="716" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="98" font-size="12" fill="#9d174d" text-anchor="middle">分组在一条链路上发出之后</text>
  <text x="380" y="116" font-size="12" fill="#9d174d" text-anchor="middle">并不保证它到达对面，链路可能把它丢掉</text>

  <text x="380" y="180" font-size="10" fill="#64748b" text-anchor="middle">所以协议必须把「会丢包、会变图、只知道一小块」这三件事一起算进去</text>
</svg>
