<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 331" width="760" height="331"
     role="img" aria-labelledby="fig-model-3-title fig-model-3-desc">
  <title id="fig-model-3-title">两类机器：路由器画方框，端主机画圆圈</title>
  <desc id="fig-model-3-desc">左边与右边都是圆圈，代表端主机，它们收发自己的数据，通常只连一个或几个路由器，一般不去转发目的地不是自己的中间分组。中间是方框，代表路由器，它的职责是接收并转发中间分组，把它们往最终目的地推近。这套圆圈与方框的画法是教材定下的约定。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="331" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两类机器：路由器画方框，端主机画圆圈</text>

  <circle cx="142" cy="160" r="120" fill="#d1fae5" stroke="#22c55e"/>
  <text x="142" y="140" font-size="12" fill="#166534" text-anchor="middle">端主机</text>
  <text x="142" y="162" font-size="12" fill="#166534" text-anchor="middle">收发自己的数据</text>
  <text x="142" y="184" font-size="12" fill="#166534" text-anchor="middle">通常只连路由器</text>

  <rect x="287" y="124" width="186" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="146" font-size="12" fill="#b45309" text-anchor="middle">路由器</text>
  <text x="380" y="164" font-size="12" fill="#b45309" text-anchor="middle">转发中间分组</text>
  <text x="380" y="182" font-size="12" fill="#b45309" text-anchor="middle">往目的地推近</text>

  <circle cx="618" cy="160" r="120" fill="#d1fae5" stroke="#22c55e"/>
  <text x="618" y="140" font-size="12" fill="#166534" text-anchor="middle">端主机</text>
  <text x="618" y="162" font-size="12" fill="#166534" text-anchor="middle">通常不是目的地</text>
  <text x="618" y="184" font-size="12" fill="#166534" text-anchor="middle">指路由器自己</text>

  <text x="380" y="306" font-size="10" fill="#64748b" text-anchor="middle">路由器是方框，端主机是圆圈：这套画法在本套讲义里一直沿用</text>
</svg>
