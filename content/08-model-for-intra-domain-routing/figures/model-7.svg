<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 189" width="760" height="189"
     role="img" aria-labelledby="fig-model-7-title fig-model-7-desc">
  <title id="fig-model-7-title">地址先用唯一标签代替，好把路由问题与编址问题分开</title>
  <desc id="fig-model-7-desc">三台路由器分别标成 X、Y、Z，这些唯一标签暂时当作它们的地址。这样做是为了把路由问题和编址问题分开想，一次只想一件；可扩展的编址方案留到这一部分后面讲。有了地址，路由问题就能写成一句话：路由器收到分组后，怎么知道该往哪里转发，才能让它最终到达目的地。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="189" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">地址先用标签代替</text>

  <rect x="22" y="76" width="222" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="133" y="98" font-size="12" fill="#b45309" text-anchor="middle">路由器 X</text>
  <text x="133" y="116" font-size="12" fill="#b45309" text-anchor="middle">地址就是 X</text>

  <rect x="269" y="76" width="222" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="98" font-size="12" fill="#b45309" text-anchor="middle">路由器 Y</text>
  <text x="380" y="116" font-size="12" fill="#b45309" text-anchor="middle">地址就是 Y</text>

  <rect x="516" y="76" width="222" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="627" y="98" font-size="12" fill="#b45309" text-anchor="middle">路由器 Z</text>
  <text x="627" y="116" font-size="12" fill="#b45309" text-anchor="middle">地址就是 Z</text>

  <text x="380" y="164" font-size="10" fill="#64748b" text-anchor="middle">路由问题：路由器收到分组后，怎么知道该往哪里转发，才能让它最终到达目的地</text>
</svg>
