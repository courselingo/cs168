<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 302" width="760" height="302"
     role="img" aria-labelledby="fig-model-4-title fig-model-4-desc">
  <title id="fig-model-4-title">用路由器把机器连起来</title>
  <desc id="fig-model-4-desc">箭头依次向右：端主机接到路由器，两台路由器之间有直连，另有一条经过中间路由器的绕行路，再到另一端的端主机。这个拓扑比全互联用的链路少，带宽又比单链路多，而且对故障更稳健：直连那条断了，分组可以沿绕行的那条走，仍然到达目的地。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="302" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">用路由器把机器连起来</text>

  <rect x="22" y="70" width="160" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="102" y="92.2" font-size="12" fill="#166534" text-anchor="middle">端主机</text>
  <text x="102" y="110.2" font-size="12" fill="#166534" text-anchor="middle">只连一台路由器</text>

  <rect x="207" y="70" width="160" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="287" y="92.2" font-size="12" fill="#b45309" text-anchor="middle">路由器</text>
  <text x="287" y="110.2" font-size="12" fill="#b45309" text-anchor="middle">连着好几个邻居</text>

  <rect x="392" y="70" width="160" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="472" y="92.2" font-size="12" fill="#b45309" text-anchor="middle">路由器</text>
  <text x="472" y="110.2" font-size="12" fill="#b45309" text-anchor="middle">连着好几个邻居</text>

  <rect x="577" y="70" width="160" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="657" y="92.2" font-size="12" fill="#166534" text-anchor="middle">端主机</text>
  <text x="657" y="110.2" font-size="12" fill="#166534" text-anchor="middle">最终目的地</text>

  <rect x="300" y="184" width="160" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="206.2" font-size="12" fill="#b45309" text-anchor="middle">路由器</text>
  <text x="380" y="224.2" font-size="12" fill="#b45309" text-anchor="middle">绕行的另一条路</text>

  <path d="M187,97 L 196,97" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M372,97 L 381,97" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M557,97 L 566,97" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M280,129 C 280,151 340,151 340,173" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M420,179 C 420,157 480,157 480,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="380" y="278" font-size="10" fill="#64748b" text-anchor="middle">线比全互联少、带宽比单链路多；直连那条断了，分组还能走绕行的那条</text>
</svg>
