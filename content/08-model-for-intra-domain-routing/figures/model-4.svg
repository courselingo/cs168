<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260"
     role="img" aria-labelledby="fig-model-4-title fig-model-4-desc">
  <title id="fig-model-4-title">用路由器把机器连起来</title>
  <desc id="fig-model-4-desc">箭头依次向右：端主机接到路由器，三台路由器依次相连，另外还有一条从第一台路由器直通第三台的路，再接到另一端的端主机。这个拓扑比全互联用的链路少，带宽又比单链路多，而且对故障更稳健：任何一段断了，分组都可以沿另一条路绕过去，仍然到达目的地。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="260" fill="#ffffff"/>

  <text x="379.5" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">用路由器把机器连起来</text>

  <rect x="22" y="70" width="123" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="83.5" y="92.2" font-size="12" fill="#166534" text-anchor="middle">端主机</text>
  <text x="83.5" y="110.2" font-size="12" fill="#166534" text-anchor="middle">只连一台路由器</text>

  <rect x="170" y="70" width="123" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="231.5" y="92.2" font-size="12" fill="#b45309" text-anchor="middle">路由器</text>
  <text x="231.5" y="110.2" font-size="12" fill="#b45309" text-anchor="middle">连着好几个邻居</text>

  <rect x="318" y="70" width="123" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="379.5" y="92.2" font-size="12" fill="#b45309" text-anchor="middle">路由器</text>
  <text x="379.5" y="110.2" font-size="12" fill="#b45309" text-anchor="middle">环上的中间站</text>

  <rect x="466" y="70" width="123" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="527.5" y="92.2" font-size="12" fill="#b45309" text-anchor="middle">路由器</text>
  <text x="527.5" y="110.2" font-size="12" fill="#b45309" text-anchor="middle">另一条路还在</text>

  <rect x="614" y="70" width="123" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="675.5" y="92.2" font-size="12" fill="#166534" text-anchor="middle">端主机</text>
  <text x="675.5" y="110.2" font-size="12" fill="#166534" text-anchor="middle">最终目的地</text>

  <path d="M150,97 L 159,97" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M298,97 L 307,97" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M446,97 L 455,97" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M594,97 L 603,97" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M231.5,129 C 231.5,190 527.5,190 527.5,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="379.5" y="204" font-size="12" fill="#64748b" text-anchor="middle">另一条路：绕开中间那一台</text>

  <text x="379.5" y="236" font-size="10" fill="#64748b" text-anchor="middle">线比全互联少、带宽比单链路多；任何一段断了，分组还能绕另一条走</text>
</svg>
