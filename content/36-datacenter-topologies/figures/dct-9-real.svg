<svg xmlns="http://www.w3.org/2000/svg" viewBox="-22 0 804 328" width="804" height="328"
     role="img" aria-labelledby="fig-dct-9-real-title fig-dct-9-real-desc">
  <title id="fig-dct-9-real-title">真实世界的拓扑：2008 与 2015 年的论文图里，任意两台主机之间都有多条路径，而变体共享同一个目标</title>
  <desc id="fig-dct-9-real-desc">真实世界的拓扑有很多变体：2008 年的图里任意两台终端主机之间已有多条路径，2015 年的论文探索了多种拓扑，而 2009 等年份也有不同摆法，它们共享的目标都是在任意两台服务器之间取得高带宽。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="328" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">真实世界的拓扑：2008 与 2015 年的论文图里，任意两台主机之间都有多条路径，而变体共享同一个目标</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">2008 年那张论文图：任意两台终端主机之间已经有许多条不同路径</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="147" font-size="12" fill="#1e40af" text-anchor="middle">2015 年那篇论文：探索了多种拓扑变体</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="208" font-size="12" fill="#b45309" text-anchor="middle">还有 2009 等年份的变体，摆法各不相同</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="269" font-size="12" fill="#166534" text-anchor="middle">但它们共享同一个目标：在任意两台服务器之间取得高带宽</text>
  <text x="380" y="305" font-size="10" fill="#64748b" text-anchor="middle">公式定下骨架，现实在骨架里挑摆法</text>
</svg>
