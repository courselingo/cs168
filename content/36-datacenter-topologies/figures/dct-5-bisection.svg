<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-dct-5-bisection-title fig-dct-5-bisection-desc">
  <title id="fig-dct-5-bisection-title">二分带宽与超订：切一半数剪掉的链路带宽，与满二分带宽相比得到超订倍数</title>
  <desc id="fig-dct-5-bisection-desc">二分带宽是把网络切成等大两半所需剪掉的链路带宽之和，等价说法是最坏划分下两边能同时发送的最小总带宽；满二分带宽是 N/2 乘 R；超订倍数是满二分带宽除以二分带宽。例子里 2 Gbps 对 4 Gbps 即 2 倍超订。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">二分带宽与超订：切一半数剪掉的链路带宽，与满二分带宽相比得到超订倍数</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">定义一：把网络切成等大两半，要剪掉的链路带宽之和就是二分带宽</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="147" font-size="12" fill="#1e40af" text-anchor="middle">定义二（等价）：最坏划分下，两边能同时发送的最小总带宽</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="208" font-size="12" fill="#166534" text-anchor="middle">满二分带宽：没有瓶颈的理想值 —— N 台主机、半边 N/2 台全速 R ⇒ N/2 乘 R</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="269" font-size="12" fill="#b45309" text-anchor="middle">超订倍数 = 满二分带宽 ÷ 二分带宽（越大离理想越远）</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="330" font-size="12" fill="#9d174d" text-anchor="middle">例子：所有链路 1 Gbps，切开左右各四台只需剪两条链路 ⇒ 2 Gbps 对 4 Gbps = 2 倍超订</text>
  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">注意：定义句与紧接的例子用了互为倒数的两种口径，本页采用例子的口径</text>
</svg>
