<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-dct-2-different-title fig-dct-2-different-desc">
  <title id="fig-dct-2-different-title">三条差异来自同一个事实：单一组织拥有这张网络</title>
  <desc id="fig-dct-2-different-desc">数据中心的本地网络由单一组织运营，由此得到三条差异：可控（能自定义协议并强制所有机器遵守）、同构（服务器与交换机同一代，整体升级）、单一地点（不必考虑长距离链路，但要支撑极高带宽）。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三条差异来自同一个事实：单一组织拥有这张网络</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">共同前提：这张本地网络由单一组织运营</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="147" font-size="12" fill="#166534" text-anchor="middle">差异一：可控 —— 硬件与软件自定，能强制每台机器跑同一套自定义协议</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="208" font-size="12" fill="#166534" text-anchor="middle">差异二：同构 —— 服务器与交换机同一代，升级时整个数据中心一起换</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="269" font-size="12" fill="#6b21a8" text-anchor="middle">（通用互联网里要迁就无线与有线混用、新旧机器并存）</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="330" font-size="12" fill="#9d174d" text-anchor="middle">差异三：单一地点 —— 不必考虑海底光缆，但要在这一处支撑极高带宽</text>
  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">三条差异来自同一个事实：单一组织拥有这张网络</text>
</svg>
