<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 343" width="760" height="343"
     role="img" aria-labelledby="fig-headers-4-title fig-headers-4-desc">
  <title id="fig-headers-4-title">往下走一层层包上，往上走一层层剥掉</title>
  <desc id="fig-headers-4-desc">自上而下就是「往下走」的方向：最上面是最内层的信纸，写的是正文；中间是信封，写的是收件人；最下面是最外层的箱子，写的是街道地址。所以往下走是从信纸到箱子，一路包上；往上走是从箱子到信纸，一路剥掉。每一层只看懂自己那一层的封皮，实际上是在跟同一层的对端说话。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="343" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">往下走一层层包上，往上走一层层剥掉</text>

  <rect x="22" y="76" width="716" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="98" font-size="12" fill="#166534" text-anchor="middle">最内层：信纸</text>
  <text x="380" y="116" font-size="12" fill="#166534" text-anchor="middle">写的是正文，只有收信人关心</text>

  <rect x="22" y="155" width="716" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="177" font-size="12" fill="#b45309" text-anchor="middle">中间层：信封</text>
  <text x="380" y="195" font-size="12" fill="#b45309" text-anchor="middle">写的是收件人姓名，秘书按它把信交到人手里</text>

  <rect x="22" y="234" width="716" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="256" font-size="12" fill="#9d174d" text-anchor="middle">最外层：箱子</text>
  <text x="380" y="274" font-size="12" fill="#9d174d" text-anchor="middle">写的是街道地址，运输公司按它送到那家公司</text>

  <text x="380" y="318" font-size="11" fill="#64748b" text-anchor="middle">往下走＝从里往外一层层包上；往上走＝从外往里一层层剥掉</text>
</svg>
