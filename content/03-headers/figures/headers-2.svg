<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 185" width="760" height="185"
     role="img" aria-labelledby="fig-headers-2-title fig-headers-2-desc">
  <title id="fig-headers-2-title">首部是所有人都要遵守的接口</title>
  <desc id="fig-headers-2-desc">左边是大家共用的同一套首部格式，程序怎么调用网络就写在它里面；右边是有人单独改了格式的后果，他发出去的包别人读不懂。首部一旦部署就很难改，要改必须让所有人同意，标准组织为此要花好几年。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="185" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">首部是所有人都要遵守的接口</text>

  <rect x="22" y="66" width="344" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="88" font-size="12" fill="#1e40af" text-anchor="middle">大家都用同一套首部格式</text>
  <text x="194" y="106" font-size="12" fill="#1e40af" text-anchor="middle">怎么调用网络，就写在这套格式里</text>

  <rect x="394" y="66" width="344" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566" y="88" font-size="12" fill="#9d174d" text-anchor="middle">谁单独换了格式</text>
  <text x="566" y="106" font-size="12" fill="#9d174d" text-anchor="middle">他发出去的包别人就读不懂</text>

  <path d="M371,93 L 383,93" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <text x="380" y="160" font-size="10" fill="#64748b" text-anchor="middle">首部一旦部署就很难改：要改必须让所有人同意，标准组织为此要花好几年</text>
</svg>
