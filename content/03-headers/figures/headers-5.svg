<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221"
     role="img" aria-labelledby="fig-headers-5-title fig-headers-5-desc">
  <title id="fig-headers-5-title">同一台主机，在分层里有好几个名字</title>
  <desc id="fig-headers-5-desc">三列并排：给人看的域名，比如 www.google.com；给机器看的 IP 地址，比如 74.124.56.2，它多少编码了服务器所在的位置，服务器搬家就可能变；还有硬件地址，也就是 MAC 地址，它从不改变。不同层用不同的地址写法。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同一台主机，在分层里有好几个名字</text>

  <rect x="22" y="100" width="220" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="132" y="122" font-size="12" fill="#1e40af" text-anchor="middle">www.google.com</text>
  <text x="132" y="140" font-size="12" fill="#1e40af" text-anchor="middle">给人看的名字</text>

  <rect x="270" y="100" width="220" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="122" font-size="12" fill="#1e40af" text-anchor="middle">74.124.56.2</text>
  <text x="380" y="140" font-size="12" fill="#1e40af" text-anchor="middle">机器读的地址，搬家会变</text>

  <rect x="518" y="100" width="220" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="628" y="122" font-size="12" fill="#166534" text-anchor="middle">MAC 地址</text>
  <text x="628" y="140" font-size="12" fill="#166534" text-anchor="middle">硬件地址，从不改变</text>

  <text x="380" y="196" font-size="11" fill="#64748b" text-anchor="middle">不同层有各自的地址写法：楼里写房间号就够，寄到外地要写完整街道地址</text>
</svg>
