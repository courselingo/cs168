<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260.5" width="760" height="260.5"
     role="img" aria-labelledby="fig-end-1-title fig-end-1-desc">
  <title id="fig-end-1-title">一次完整走位所涉及的三个网络</title>
  <desc id="fig-end-1-desc">上面一条说明这一讲要做什么：把前面所有协议串起来，走一遍开机、插上网线、在浏览器里敲 www.berkeley.edu 的过程。第二排三格是这条路径上的三个网络：家庭网络（我们这台主机与那台网关路由器）、ISP 网络（中间的若干路由器，DNS 服务器也在这里）、伯克利网络（目标服务器所在的那一侧）。最下面一条是源文声明的前提：不假设要从零把互联网建起来，路由器已经在跑路由协议、转发表也已填好。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="260.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一次完整走位所涉及的三个网络</text>
  <rect x="25" y="64" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">这一讲把前面所有协议串起来走一遍：开机、插上网线、在浏览器里敲 www.berkeley.edu</text>
  <rect x="25" y="125" width="220" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="135" y="145.35" font-size="11" fill="#166534" text-anchor="middle">家庭网络</text>
  <text x="135" y="161.85" font-size="11" fill="#166534" text-anchor="middle">我们这台主机与那台网关路由器</text>
  <rect x="270" y="125" width="220" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="145.35" font-size="11" fill="#b45309" text-anchor="middle">ISP 网络</text>
  <text x="380" y="161.85" font-size="11" fill="#b45309" text-anchor="middle">中间的若干路由器，DNS 服务器也在这里</text>
  <rect x="515" y="125" width="220" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="625" y="145.35" font-size="11" fill="#1e40af" text-anchor="middle">伯克利网络</text>
  <text x="625" y="161.85" font-size="11" fill="#1e40af" text-anchor="middle">目标服务器所在的那一侧</text>
  <rect x="25" y="202.5" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="222.85" font-size="11" fill="#1e293b" text-anchor="middle">前提：不假设要从零把互联网建起来，路由器已经在跑路由协议、转发表也已填好</text>
</svg>
