<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312.0" width="760" height="312.0"
     role="img" aria-labelledby="fig-ratcc-9-title fig-ratcc-9-desc">
  <title id="fig-ratcc-9-title">公平排队看得到自己这一段，看不到下游</title>
  <desc id="fig-ratcc-9-desc">三格自上而下，每两格之间一支向下的箭头。第一格是源文的例子：一条瓶颈链路上有上下两条连接，瓶颈链路做公平排队，给每条连接 0.5 Gbps，作弊照样被挡住。第二格是这个办法的漏洞：上面那条若真的按 0.5 Gbps 发，紧接着的下一条链路会丢掉 0.4 Gbps，最后只有 0.1 Gbps 过得去。第三格是更好的分法：上面那条只给 0.1 Gbps，下面那条给 0.9 Gbps，加起来还是 1.0，容量没有浪费。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="312.0" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">公平排队看得到自己这一段，看不到下游</text>
  <rect x="22" y="76" width="715" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="379.5" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">源文的例子：一条瓶颈链路上有上下两条连接</text>
  <text x="379.5" y="116.2" font-size="12" fill="#1e40af" text-anchor="middle">瓶颈链路做公平排队，给每条连接 0.5 Gbps，作弊照样被挡住</text>
  <rect x="22" y="155" width="715" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="379.5" y="177.2" font-size="12" fill="#9d174d" text-anchor="middle">可是上面那条若真的按 0.5 Gbps 发，紧接着的下一条链路会丢掉 0.4 Gbps</text>
  <text x="379.5" y="195.2" font-size="12" fill="#9d174d" text-anchor="middle">最后只有 0.1 Gbps 过得去</text>
  <path d="M380,135 Q 380,139.5 380,144" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="22" y="234" width="715" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="379.5" y="256.2" font-size="12" fill="#166534" text-anchor="middle">更好的分法：上面那条只给 0.1 Gbps，下面那条给 0.9 Gbps</text>
  <text x="379.5" y="274.2" font-size="12" fill="#166534" text-anchor="middle">0.1 加 0.9 = 1.0，这条瓶颈链路的容量没有浪费</text>
  <path d="M380,214 Q 380,218.5 380,223" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
