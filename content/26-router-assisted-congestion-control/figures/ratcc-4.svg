<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 269.0" width="760" height="269.0"
     role="img" aria-labelledby="fig-ratcc-4-title fig-ratcc-4-desc">
  <title id="fig-ratcc-4-title">最大最小公平的算账：容量 10 分到 4、4、2</title>
  <desc id="fig-ratcc-4-desc">第一行三格是源文那三步推理：先按人头平均每人 3.33，也就是 10 除以 3；C 只要 2，就先给 C 2，剩下 10 减 2 得 8；A 与 B 再把 8 平分，各拿 4。三支向下箭头指向最后一整格：把三个数代回 min(4, 8) 加 min(4, 6) 加 min(4, 2) 得到 4 加 4 加 2 等于 10，正好是容量，所以这一例里 f 就是 4。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="269.0" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">最大最小公平的算账：容量 10 分到 4、4、2</text>
  <rect x="22" y="76" width="222" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="133" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">① 按人头平均</text>
  <text x="133" y="116.2" font-size="12" fill="#1e40af" text-anchor="middle">每人 3.33</text>
  <text x="133" y="134.2" font-size="12" fill="#1e40af" text-anchor="middle">这是 10 ÷ 3</text>
  <rect x="269" y="76" width="222" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">② C 只要 2</text>
  <text x="380" y="116.2" font-size="12" fill="#1e40af" text-anchor="middle">那就给 C 2</text>
  <text x="380" y="134.2" font-size="12" fill="#1e40af" text-anchor="middle">剩下 10 − 2 = 8</text>
  <rect x="516" y="76" width="222" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="627" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">③ A 与 B 再平均</text>
  <text x="627" y="116.2" font-size="12" fill="#1e40af" text-anchor="middle">各拿 4</text>
  <text x="627" y="134.2" font-size="12" fill="#1e40af" text-anchor="middle">这是 8 ÷ 2</text>
  <rect x="22" y="173" width="715" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="379.5" y="195.2" font-size="12" fill="#166534" text-anchor="middle">例子里 f = 4：min(4, 8) + min(4, 6) + min(4, 2) = 4 + 4 + 2 = 10</text>
  <text x="379.5" y="213.2" font-size="12" fill="#166534" text-anchor="middle">A 与 B 拿到 f，因为它们要得多；C 拿到 2，因为它要得少</text>
  <text x="379.5" y="231.2" font-size="12" fill="#166534" text-anchor="middle">f 是唯一让所有 a_i 加起来等于总容量 C 的那个值</text>
  <path d="M133,153 Q 133,157.5 133,162" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M380,153 Q 380,157.5 380,162" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M627,153 Q 627,157.5 627,162" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
