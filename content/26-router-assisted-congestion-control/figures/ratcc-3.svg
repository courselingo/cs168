<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312.0" width="760" height="312.0"
     role="img" aria-labelledby="fig-ratcc-3-title fig-ratcc-3-desc">
  <title id="fig-ratcc-3-title">轮询算账：16 个待发，10 个名额</title>
  <desc id="fig-ratcc-3-desc">第一行三格是三条连接送来的量：A 每秒 8 个、B 每秒 6 个、C 每秒 2 个。三支向下箭头指向中间一整格：三条连接一共排了 16 个分组，而这一秒只送得出 10 个，按轮询每一轮各拿一个名额。再一支向下箭头指向第三行三格：A 发出 4 个、B 发出 4 个、C 发出 2 个，总共正好 10 个。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="312.0" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">轮询算账：16 个待发，10 个名额</text>
  <rect x="22" y="76" width="222" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="133" y="98.2" font-size="12" fill="#9d174d" text-anchor="middle">A 每秒送来 8 个</text>
  <text x="133" y="116.2" font-size="12" fill="#9d174d" text-anchor="middle">队列里排着 8 个</text>
  <rect x="269" y="76" width="222" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="98.2" font-size="12" fill="#9d174d" text-anchor="middle">B 每秒送来 6 个</text>
  <text x="380" y="116.2" font-size="12" fill="#9d174d" text-anchor="middle">队列里排着 6 个</text>
  <rect x="516" y="76" width="222" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="627" y="98.2" font-size="12" fill="#9d174d" text-anchor="middle">C 每秒送来 2 个</text>
  <text x="627" y="116.2" font-size="12" fill="#9d174d" text-anchor="middle">队列里只有 2 个</text>
  <rect x="22" y="155" width="715" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="379.5" y="177.2" font-size="12" fill="#b45309" text-anchor="middle">三条连接一共排了 16 个分组，而这一秒只送得出 10 个</text>
  <text x="379.5" y="195.2" font-size="12" fill="#b45309" text-anchor="middle">按轮询走：每一轮 A、B、C 各拿一个名额</text>
  <path d="M133,135 Q 133,139.5 133,144" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M380,135 Q 380,139.5 380,144" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M627,135 Q 627,139.5 627,144" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="22" y="234" width="222" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="133" y="256.2" font-size="12" fill="#166534" text-anchor="middle">A 发出 4 个</text>
  <text x="133" y="274.2" font-size="12" fill="#166534" text-anchor="middle">还剩 4 个没发</text>
  <rect x="269" y="234" width="222" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="256.2" font-size="12" fill="#166534" text-anchor="middle">B 发出 4 个</text>
  <text x="380" y="274.2" font-size="12" fill="#166534" text-anchor="middle">还剩 2 个没发</text>
  <rect x="516" y="234" width="222" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="627" y="256.2" font-size="12" fill="#166534" text-anchor="middle">C 发出 2 个</text>
  <text x="627" y="274.2" font-size="12" fill="#166534" text-anchor="middle">它只送来 2 个</text>
  <path d="M380,214 Q 380,218.5 380,223" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
