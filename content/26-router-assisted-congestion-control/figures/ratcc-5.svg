<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 269.0" width="760" height="269.0"
     role="img" aria-labelledby="fig-ratcc-5-title fig-ratcc-5-desc">
  <title id="fig-ratcc-5-title">读一遍 a_i = min(f, r_i) 的两个分支</title>
  <desc id="fig-ratcc-5-desc">上一格写着式子 a_i = min(f, r_i)，以及 f 是唯一让所有 a_i 加起来等于总容量 C 的值。两支向下的箭头分成左右两格：左边是需求小于 f 的情形，min 取的是 r_i，所以拿到自己要的那个数，比公平份额还少；右边是需求大于 f 的情形，min 取的是 f，被压在公平份额上，但也没有别人比他拿得多。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="269.0" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">读一遍 a_i = min(f, r_i) 的两个分支</text>
  <rect x="22" y="76" width="715" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="379.5" y="98.2" font-size="12" fill="#6b21a8" text-anchor="middle">式子只有一条：分给第 i 条连接的带宽 a_i = min(f, r_i)</text>
  <text x="379.5" y="116.2" font-size="12" fill="#6b21a8" text-anchor="middle">f 是唯一让所有 a_i 加起来等于总容量 C 的值</text>
  <rect x="22" y="155" width="345" height="90" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194.5" y="177.2" font-size="12" fill="#1e40af" text-anchor="middle">要得比 f 少的（r_i &lt; f）</text>
  <text x="194.5" y="195.2" font-size="12" fill="#1e40af" text-anchor="middle">min 取的是左边 r_i</text>
  <text x="194.5" y="213.2" font-size="12" fill="#1e40af" text-anchor="middle">拿到自己要的那个数</text>
  <text x="194.5" y="231.2" font-size="12" fill="#1e40af" text-anchor="middle">比公平份额 f 还少</text>
  <rect x="393" y="155" width="345" height="90" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="565.5" y="177.2" font-size="12" fill="#166534" text-anchor="middle">要得比 f 多的（r_i &gt; f）</text>
  <text x="565.5" y="195.2" font-size="12" fill="#166534" text-anchor="middle">min 取的是右边 f</text>
  <text x="565.5" y="213.2" font-size="12" fill="#166534" text-anchor="middle">被压在公平份额上</text>
  <text x="565.5" y="231.2" font-size="12" fill="#166534" text-anchor="middle">但没人比他拿得多</text>
  <path d="M194.5,135 Q 194.5,139.5 194.5,144" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M565.5,135 Q 565.5,139.5 565.5,144" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
