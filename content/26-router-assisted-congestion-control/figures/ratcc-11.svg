<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 287.0" width="760" height="287.0"
     role="img" aria-labelledby="fig-ratcc-11-title fig-ratcc-11-desc">
  <title id="fig-ratcc-11-title">路由器开口的两种尺度：给数值与报「堵了」</title>
  <desc id="fig-ratcc-11-desc">第一行左右两格对照。左边是第一条路，路由器直接给出速率：分组里加一个速率字段，路由器填上这条连接的公平份额，发送方据此设定自己的速率。右边是第二条路，只报拥塞：IP 首部里一个 ECN 位，堵了就置成 1，降多少由发送方自己决定。两支向下箭头汇到最后一整格：一条给的是数值，代价是路由器得知道每人该分多少；另一条只报「堵了」，代价是发送方还得自己琢磨降多少；两条都要沿途大多数路由器配合，而后一条的部署成本低得多。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="287.0" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">路由器开口的两种尺度：给数值与报「堵了」</text>
  <rect x="22" y="76" width="345" height="90" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194.5" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">第一条路：路由器直接给速率</text>
  <text x="194.5" y="116.2" font-size="12" fill="#1e40af" text-anchor="middle">分组里加一个速率字段</text>
  <text x="194.5" y="134.2" font-size="12" fill="#1e40af" text-anchor="middle">路由器填上公平份额</text>
  <text x="194.5" y="152.2" font-size="12" fill="#1e40af" text-anchor="middle">发送方据此设自己的速率</text>
  <rect x="393" y="76" width="345" height="90" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="565.5" y="98.2" font-size="12" fill="#b45309" text-anchor="middle">第二条路：只报拥塞</text>
  <text x="565.5" y="116.2" font-size="12" fill="#b45309" text-anchor="middle">IP 首部里一个 ECN 位</text>
  <text x="565.5" y="134.2" font-size="12" fill="#b45309" text-anchor="middle">堵了就置成 1</text>
  <text x="565.5" y="152.2" font-size="12" fill="#b45309" text-anchor="middle">发送方自己决定降多少</text>
  <rect x="22" y="191" width="715" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="379.5" y="213.2" font-size="12" fill="#166534" text-anchor="middle">一条给的是数值，发送方拿到就不用再探，代价是路由器得知道每人该分多少</text>
  <text x="379.5" y="231.2" font-size="12" fill="#166534" text-anchor="middle">另一条只报「堵了」，代价是发送方还得自己琢磨降多少</text>
  <text x="379.5" y="249.2" font-size="12" fill="#166534" text-anchor="middle">两条都要沿途大多数路由器配合，而后一条的部署成本低得多</text>
  <path d="M194.5,171 Q 194.5,175.5 194.5,180" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M565.5,171 Q 565.5,175.5 565.5,180" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
