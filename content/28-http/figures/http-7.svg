<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310.0" width="760" height="310.0"
     role="img" aria-labelledby="fig-http-7-title fig-http-7-desc">
  <title id="fig-http-7-title">没有流水线与有流水线</title>
  <desc id="fig-http-7-desc">上排是没有流水线：两次 GET 各开一条 TCP 连接，每条连接都要先握手，用完就关。下排是 HTTP/1.1 的流水线：两个请求排在同一条连接上发出，握手只做一次。底部一行写代价：服务器要维持更多同时打开的连接，还得给它们设超时，撑不住时客户端会拿到 503。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="310.0" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">没有流水线与有流水线</text>
  <rect x="22" y="76" width="345" height="54.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="393" y="76" width="345" height="54.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <rect x="22" y="155" width="345" height="54.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="393" y="155" width="345" height="54.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <rect x="22" y="234" width="716" height="54.0" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194.5" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">客户端</text>
  <text x="194.5" y="116.2" font-size="12" fill="#1e40af" text-anchor="middle">两次 GET 各开一条连接</text>
  <text x="565.5" y="98.2" font-size="12" fill="#166534" text-anchor="middle">服务器</text>
  <text x="565.5" y="116.2" font-size="12" fill="#166534" text-anchor="middle">每条连接都要先握手</text>
  <text x="194.5" y="177.2" font-size="12" fill="#1e40af" text-anchor="middle">客户端</text>
  <text x="194.5" y="195.2" font-size="12" fill="#1e40af" text-anchor="middle">两个请求排在同一条连接上</text>
  <text x="565.5" y="177.2" font-size="12" fill="#166534" text-anchor="middle">服务器</text>
  <text x="565.5" y="195.2" font-size="12" fill="#166534" text-anchor="middle">握手只做一次，连接留着复用</text>
  <text x="380.0" y="256.2" font-size="12" fill="#9d174d" text-anchor="middle">代价：服务器要维持更多同时打开的连接，还得给它们设超时</text>
  <text x="380.0" y="274.2" font-size="12" fill="#9d174d" text-anchor="middle">撑不住时客户端拿到 503，攻击者也可以拿这一点做拒绝服务</text>
  <path d="M372,100 Q 377.0,100 382,100" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M372,106 Q 377.0,106 382,106" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M194.5,135 Q 194.5,139.5 194.5,144" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M565.5,135 Q 565.5,139.5 565.5,144" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M372,182 Q 377.0,182 382,182" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
