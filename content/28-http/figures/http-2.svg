<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310.0" width="760" height="310.0"
     role="img" aria-labelledby="fig-http-2-title fig-http-2-desc">
  <title id="fig-http-2-title">HTTP 架在 TCP 之上：一次请求换一次响应</title>
  <desc id="fig-http-2-desc">第一行左右两格。左边是客户端，它挑一个临时端口发起连接；右边是服务器，它在 80 端口上等连接，HTTPS 换成 443。两格之间是 TCP 字节流，长度不限的任意数据，到达顺序不乱也不丢包。第二行说明字节流替 HTTP 挡掉了什么；第三行说清规则：客户端每发一个请求，服务器就回恰好一个响应。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="310.0" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">HTTP 架在 TCP 之上：一次请求换一次响应</text>
  <rect x="22" y="76" width="345" height="54.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="393" y="76" width="345" height="54.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <rect x="22" y="155" width="716" height="54.0" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <rect x="22" y="234" width="716" height="54.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194.5" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">客户端</text>
  <text x="194.5" y="116.2" font-size="12" fill="#1e40af" text-anchor="middle">挑一个临时端口发起连接</text>
  <text x="565.5" y="98.2" font-size="12" fill="#166534" text-anchor="middle">服务器</text>
  <text x="565.5" y="116.2" font-size="12" fill="#166534" text-anchor="middle">在 80 端口等连接，HTTPS 用 443</text>
  <text x="380.0" y="177.2" font-size="12" fill="#b45309" text-anchor="middle">中间这条线是 TCP 字节流</text>
  <text x="380.0" y="195.2" font-size="12" fill="#b45309" text-anchor="middle">长度不限的任意数据，不重排、不丢包，两端都不用自己操心</text>
  <text x="380.0" y="256.2" font-size="12" fill="#166534" text-anchor="middle">一次请求换一个响应</text>
  <text x="380.0" y="274.2" font-size="12" fill="#166534" text-anchor="middle">客户端每发一个请求，服务器就回恰好一个响应</text>
  <path d="M372,100.0 Q 377.0,100.0 382,100.0" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M388,106.0 Q 383.0,106.0 378,106.0" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M194.5,135.0 Q 194.5,139.5 194.5,144" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M565.5,135.0 Q 565.5,139.5 565.5,144" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M380,214 Q 380,218.5 380,223" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
