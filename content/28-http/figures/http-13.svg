<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760.0 259.5" width="760.0" height="259.5"
     role="img" aria-labelledby="fig-http-13-title fig-http-13-desc">
  <title id="fig-http-13-title">三种把客户端指向最近服务器的办法</title>
  <desc id="fig-http-13-desc">三格并排，每格是一个办法和它的毛病。任播：多台服务器宣告同一个地址前缀，路由算法自己挑最近的一台，可长连接会出事，中间链路一断，路由器可能把后续分组发到另一台同地址的服务器上，而那条 TCP 连接只在原来那台上。DNS 负载均衡：同一个域名解析到不同地址，粒度很粗，一个 ISP 的用户共用一台递归解析器时，名字服务器只看到这一个解析器。应用层映射：让响应里的链接或 300 级别的状态码把客户端指过去，粒度最细，但应用仍要猜哪台最近。底部一行说清三者的分野：越往下粒度越细，代价是应用自己多算一步。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760.0" height="259.5" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三种把客户端指向最近服务器的办法</text>
  <rect x="22.0" y="76" width="221.33" height="82.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="269.33" y="76" width="221.33" height="82.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <rect x="516.67" y="76" width="221.33" height="82.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <rect x="22" y="183.5" width="716" height="54.0" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="132.67" y="96.35" font-size="11" fill="#1e40af" text-anchor="middle">任播</text>
  <text x="132.67" y="112.85" font-size="11" fill="#1e40af" text-anchor="middle">多台服务器宣告同一个前缀</text>
  <text x="132.67" y="129.35" font-size="11" fill="#1e40af" text-anchor="middle">路由算法挑最近的一台</text>
  <text x="132.67" y="145.85" font-size="11" fill="#1e40af" text-anchor="middle">毛病：长连接会被换服务器</text>
  <text x="380.0" y="96.35" font-size="11" fill="#b45309" text-anchor="middle">DNS 负载均衡</text>
  <text x="380.0" y="112.85" font-size="11" fill="#b45309" text-anchor="middle">同一个域名解析到不同地址</text>
  <text x="380.0" y="129.35" font-size="11" fill="#b45309" text-anchor="middle">毛病：粒度粗</text>
  <text x="380.0" y="145.85" font-size="11" fill="#b45309" text-anchor="middle">一台解析器后面的用户只算一个</text>
  <text x="627.33" y="96.35" font-size="11" fill="#166534" text-anchor="middle">应用层映射</text>
  <text x="627.33" y="112.85" font-size="11" fill="#166534" text-anchor="middle">响应里给出该去哪台服务器</text>
  <text x="627.33" y="129.35" font-size="11" fill="#166534" text-anchor="middle">也可以用 300 级别做跳转</text>
  <text x="627.33" y="145.85" font-size="11" fill="#166534" text-anchor="middle">粒度最细，但要自己猜谁近</text>
  <text x="380.0" y="205.7" font-size="12" fill="#1e293b" text-anchor="middle">越往下粒度越细，代价是应用自己多算一步</text>
  <text x="380.0" y="223.7" font-size="12" fill="#1e293b" text-anchor="middle">源文说这一条最结实：它既没有任播的长连接问题，也没有 DNS 的粒度问题</text>
</svg>
