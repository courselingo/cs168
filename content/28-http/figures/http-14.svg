<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 407.0" width="760" height="407.0"
     role="img" aria-labelledby="fig-http-14-title fig-http-14-desc">
  <title id="fig-http-14-title">HTTP/3 为了效率把两层合起来设计</title>
  <desc id="fig-http-14-desc">左右两个堆栈对照。左边是 HTTP/1.1 与 HTTP/2 的堆栈：HTTP 在上面，TCP 在下面，再下面是 IP，两层各自独立，换掉一层另一层照旧。右边是 HTTP/3：HTTP/3 与 QUIC 一起设计，QUIC 直接跑在 UDP 上。源文的说法是，这是主动放弃分层这一核心做法、用来换效率的一次交换，换来的是两层可以互相迁就。底部一行列出这一讲里的版本与年份：1.1 是 1997 年，HTTP/2 是 2015 年，HTTP/3 是 2022 年，QUIC 源文展开为 Quick UDP Connections。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="407.0" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">HTTP/3 为了效率把两层合起来设计</text>
  <rect x="22" y="76" width="345" height="54.0" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="22" y="155" width="345" height="54.0" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <rect x="22" y="234" width="345" height="54.0" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="393" y="76" width="345" height="54.0" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <rect x="393" y="155" width="345" height="54.0" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <rect x="393" y="234" width="345" height="54.0" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="22" y="313" width="716" height="72.0" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="194.5" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">HTTP/1.1 与 HTTP/2</text>
  <text x="194.5" y="116.2" font-size="12" fill="#1e40af" text-anchor="middle">HTTP 报文与首部</text>
  <text x="194.5" y="177.2" font-size="12" fill="#b45309" text-anchor="middle">TCP</text>
  <text x="194.5" y="195.2" font-size="12" fill="#b45309" text-anchor="middle">可靠的字节流，三次握手</text>
  <text x="194.5" y="256.2" font-size="12" fill="#1e293b" text-anchor="middle">IP</text>
  <text x="194.5" y="274.2" font-size="12" fill="#1e293b" text-anchor="middle">把分组送到对端</text>
  <text x="565.5" y="98.2" font-size="12" fill="#166534" text-anchor="middle">HTTP/3 与 QUIC 一起设计</text>
  <text x="565.5" y="116.2" font-size="12" fill="#166534" text-anchor="middle">两层可以互相迁就</text>
  <text x="565.5" y="177.2" font-size="12" fill="#9d174d" text-anchor="middle">UDP</text>
  <text x="565.5" y="195.2" font-size="12" fill="#9d174d" text-anchor="middle">QUIC 自己实现可靠与有序</text>
  <text x="565.5" y="256.2" font-size="12" fill="#1e293b" text-anchor="middle">IP</text>
  <text x="565.5" y="274.2" font-size="12" fill="#1e293b" text-anchor="middle">把分组送到对端</text>
  <text x="380.0" y="335.2" font-size="12" fill="#6b21a8" text-anchor="middle">1.1 是 1997 年，HTTP/2 是 2015 年，HTTP/3 是 2022 年</text>
  <text x="380.0" y="353.2" font-size="12" fill="#6b21a8" text-anchor="middle">HTTP/3 换了下面的传输层，语义与 HTTP/2 一样</text>
  <text x="380.0" y="371.2" font-size="12" fill="#6b21a8" text-anchor="middle">源文说这是主动放弃分层这一核心做法，换来的是效率</text>
  <path d="M194.5,135 Q 194.5,139.5 194.5,144" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M194.5,214 Q 194.5,218.5 194.5,223" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M565.5,135 Q 565.5,139.5 565.5,144" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M565.5,214 Q 565.5,218.5 565.5,223" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
