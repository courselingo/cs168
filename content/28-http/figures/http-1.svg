<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760.0 147.5" width="760.0" height="147.5"
     role="img" aria-labelledby="fig-http-1-title fig-http-1-desc">
  <title id="fig-http-1-title">HTTP 的版本时间线：从换文档到换传输层</title>
  <desc id="fig-http-1-desc">六个版本排成一条从左到右的链，每格是一个时刻与那一刻多出来的东西。1989 年 Tim Berners-Lee 在 CERN 想让科学家之间的文档互相链接；1991 年第一个版本编号 HTTP/0.9；1996 年 1.0 标准化；1997 年 1.1 标准化；2015 年第一次大改，引入服务器推送；2022 年换掉传输层，改跑 QUIC。1.0 到 1.1 只隔一年，而 1.1 撑了 20 多年。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760.0" height="147.5" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">HTTP 的版本时间线：从换文档到换传输层</text>
  <rect x="22.0" y="76" width="97.67" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="145.67" y="76" width="97.67" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <rect x="269.33" y="76" width="97.67" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <rect x="393.0" y="76" width="97.67" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <rect x="516.67" y="76" width="97.67" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <rect x="640.33" y="76" width="97.67" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="70.83" y="96.35" font-size="11" fill="#1e40af" text-anchor="middle">1989</text>
  <text x="70.83" y="112.85" font-size="11" fill="#1e40af" text-anchor="middle">想让文档互链</text>
  <text x="194.5" y="96.35" font-size="11" fill="#1e40af" text-anchor="middle">1991</text>
  <text x="194.5" y="112.85" font-size="11" fill="#1e40af" text-anchor="middle">第一个版本</text>
  <text x="318.17" y="96.35" font-size="11" fill="#6b21a8" text-anchor="middle">1996</text>
  <text x="318.17" y="112.85" font-size="11" fill="#6b21a8" text-anchor="middle">1.0 标准化</text>
  <text x="441.83" y="96.35" font-size="11" fill="#6b21a8" text-anchor="middle">1997</text>
  <text x="441.83" y="112.85" font-size="11" fill="#6b21a8" text-anchor="middle">1.1 标准化</text>
  <text x="565.5" y="96.35" font-size="11" fill="#166534" text-anchor="middle">2015</text>
  <text x="565.5" y="112.85" font-size="11" fill="#166534" text-anchor="middle">2.0 引入推送</text>
  <text x="689.17" y="96.35" font-size="11" fill="#166534" text-anchor="middle">2022</text>
  <text x="689.17" y="112.85" font-size="11" fill="#166534" text-anchor="middle">3.0 改跑 QUIC</text>
  <path d="M124.66666666666667,100.75 Q 129.66666666666669,100.75 134.66666666666669,100.75" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M248.33333333333337,100.75 Q 253.33333333333337,100.75 258.33333333333337,100.75" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M372.00000000000006,100.75 Q 377.00000000000006,100.75 382.00000000000006,100.75" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M495.6666666666667,100.75 Q 500.66666666666674,100.75 505.66666666666674,100.75" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M619.3333333333334,100.75 Q 624.3333333333334,100.75 629.3333333333334,100.75" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
