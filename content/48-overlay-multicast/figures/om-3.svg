<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 237" width="760" height="237"
     role="img" aria-labelledby="fig-om-3-title fig-om-3-desc">
  <title id="fig-om-3-title">覆盖网的节点可以是终端主机，也可以是代理服务器</title>
  <desc id="fig-om-3-desc">上排两格是节点的两种可能：终端主机（例如你自己的笔记本，它得懂协议、自己建表、并转发包）与公司部署的代理服务器（类似 CDN 服务器，但仍然是终端主机、不是第三层路由器）。第二排两格是这套思路的其他用法（包也可以沿覆盖网单播，还能搭点对点文件共享：任何用户与任何用户共享，不依赖集中存所有文件的服务器）与一个有意思的性质（许多覆盖网可以共存于同一张底层网，每个应用各有一套表与邻居清单）。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="237" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">覆盖网的节点可以是终端主机，也可以是代理服务器</text>
  <rect x="25" y="64" width="342.5" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">节点可以是终端主机</text>
  <text x="196.25" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">例如你自己的笔记本</text>
  <text x="196.25" y="112.5" font-size="10" fill="#1e40af" text-anchor="middle">它得懂协议、自己建表、并转发包</text>
  <rect x="392.5" y="64" width="342.5" height="60" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.75" y="82.5" font-size="10" fill="#166534" text-anchor="middle">节点也可以是代理服务器</text>
  <text x="563.75" y="97.5" font-size="10" fill="#166534" text-anchor="middle">由某家公司部署，类似 CDN 服务器</text>
  <text x="563.75" y="112.5" font-size="10" fill="#166534" text-anchor="middle">仍是终端主机，不是第三层路由器</text>
  <rect x="25" y="152" width="342.5" height="60" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="196.25" y="170.5" font-size="10" fill="#6b21a8" text-anchor="middle">这套思路的其他用法</text>
  <text x="196.25" y="185.5" font-size="10" fill="#6b21a8" text-anchor="middle">包也可以沿覆盖网单播</text>
  <text x="196.25" y="200.5" font-size="10" fill="#6b21a8" text-anchor="middle">还能搭点对点文件共享：任何用户与任何用户共享，不依赖集中服务器</text>
  <rect x="392.5" y="152" width="342.5" height="60" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="563.75" y="170.5" font-size="10" fill="#1e293b" text-anchor="middle">一个有意思的性质</text>
  <text x="563.75" y="185.5" font-size="10" fill="#1e293b" text-anchor="middle">许多覆盖网可以共存于同一张底层网</text>
  <text x="563.75" y="200.5" font-size="10" fill="#1e293b" text-anchor="middle">每个应用各有一套表与邻居清单</text>
</svg>
