<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268"
     role="img" aria-labelledby="fig-om-1-title fig-om-1-desc">
  <title id="fig-om-1-title">这一讲的来路与它选的那条路</title>
  <desc id="fig-om-1-desc">上面一条说明上一讲的结论是 IP 组播基本停在域内，而这一讲给出那条出路：把网络功能搬到第七层。第二排三格是这条路的来历：IP 组播在 1990 年代到 2000 年代发展起来、2000 年代初铺得很慢；于是冒出一批公司，包括伯克利的 FastForward Networks 与 ProxyNet、MIT 的 Sightpath 与 Akamai；它们的共同思路是工作大体各自独立，但都用基于覆盖网的组播。最下面一条是这一讲要解决的那件难事：跨不同网络实现组播，也就是让分处不同网络的路由器们协调整齐地发给整个组。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="268" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">这一讲的来路与它选的那条路</text>
  <rect x="25" y="64" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">上一讲的结论是 IP 组播基本停在域内，这一讲给出那条出路：把网络功能搬到第七层</text>
  <rect x="25" y="125" width="220" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="143.5" font-size="10" fill="#b45309" text-anchor="middle">IP 组播部署得慢</text>
  <text x="135" y="158.5" font-size="10" fill="#b45309" text-anchor="middle">1990 年代到 2000 年代发展起来</text>
  <text x="135" y="173.5" font-size="10" fill="#b45309" text-anchor="middle">2000 年代初铺得很慢</text>
  <rect x="270" y="125" width="220" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="144.65" font-size="9" fill="#1e40af" text-anchor="middle">于是冒出一批公司</text>
  <text x="380" y="158.15" font-size="9" fill="#1e40af" text-anchor="middle">FastForward Networks 与 ProxyNet</text>
  <text x="380" y="171.65" font-size="9" fill="#1e40af" text-anchor="middle">（伯克利）；Sightpath 与 Akamai（MIT）</text>
  <rect x="515" y="125" width="220" height="60" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="143.5" font-size="10" fill="#166534" text-anchor="middle">它们的共同思路</text>
  <text x="625" y="158.5" font-size="10" fill="#166534" text-anchor="middle">工作大体各自独立</text>
  <text x="625" y="173.5" font-size="10" fill="#166534" text-anchor="middle">但都用基于覆盖网的组播</text>
  <rect x="25" y="213" width="710" height="30" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="231.5" font-size="10" fill="#1e293b" text-anchor="middle">这一讲要解决的那件难事：跨不同网络实现组播，也就是让分处不同网络的路由器们协调整齐地发给整个组</text>
</svg>
