<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 187" width="760" height="187"
     role="img" aria-labelledby="fig-iphdr-5-title fig-iphdr-5-desc">
  <title id="fig-iphdr-5-title">IPv6 的四项改动</title>
  <desc id="fig-iphdr-5-desc">箭头依次向右四项改动：取消首部校验和，理由是带宽不再是瓶颈、坏分组一路传到底的性能影响不大；取消路由器上的分片，过大的分组直接丢弃并回一条带 MTU 的错误消息，由源主机拆分重发，把这份工作从路由器挪到端主机以提升可扩展性；用固定首部加「下一个首部」取代变长的选项段，于是首部定长、连首部长度字段都能省掉，而且可以串起多个协议、面向未来；新增流标签，让中间盒不必再靠猜来判断哪些分组属于同一条流。地址也扩到 128 位。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="187" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">IPv6 的四项改动</text>

  <rect x="22" y="76" width="160" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="102" y="98" font-size="12" fill="#9d174d" text-anchor="middle">砍校验和</text>
  <text x="102" y="116" font-size="12" fill="#9d174d" text-anchor="middle">带宽不再是瓶颈</text>

  <rect x="207" y="76" width="160" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="287" y="98" font-size="12" fill="#9d174d" text-anchor="middle">砍路由器分片</text>
  <text x="287" y="116" font-size="12" fill="#9d174d" text-anchor="middle">交给源主机</text>

  <rect x="392" y="76" width="160" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="472" y="98" font-size="12" fill="#1e40af" text-anchor="middle">下一个首部</text>
  <text x="472" y="116" font-size="12" fill="#1e40af" text-anchor="middle">首部定长、可串接</text>

  <rect x="577" y="76" width="160" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="657" y="98" font-size="12" fill="#166534" text-anchor="middle">流标签</text>
  <text x="657" y="116" font-size="12" fill="#166534" text-anchor="middle">中间盒不必再猜</text>

  <path d="M187,103 L 196,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M372,103 L 381,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M557,103 L 566,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <text x="380" y="162" font-size="10" fill="#64748b" text-anchor="middle">地址同时从 32 位扩到 128 位；这是一次清理，不是一次革命</text>
</svg>
