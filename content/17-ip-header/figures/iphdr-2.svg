<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 205" width="760" height="205"
     role="img" aria-labelledby="fig-iphdr-2-title fig-iphdr-2-desc">
  <title id="fig-iphdr-2-title">四件事配四组字段：解析、转发、上送、回信</title>
  <desc id="fig-iphdr-2-desc">四个格子依次向右：所有人都要能解析分组，为此有版本（4 位）、首部长度（4 位，以 4 字节为单位，因为首部长度不固定）与分组总长度（16 位，以字节为单位）；路由器要转发，为此有目的 IP 地址（32 位）；端主机要把它交给上层，为此有协议号（8 位，6 表示 TCP、17 表示 UDP）；端主机与路由器要能回信给源，为此有源 IP 地址（32 位）。也正因为这样，只有目的地址是转发必需的，而协议号只有端主机关心。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="205" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">字段跟着四件事来</text>

  <rect x="22" y="76" width="160" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="102" y="98" font-size="12" fill="#1e40af" text-anchor="middle">① 解析</text>
  <text x="102" y="116" font-size="12" fill="#1e40af" text-anchor="middle">版本 4 位</text>
  <text x="102" y="134" font-size="12" fill="#1e40af" text-anchor="middle">首部长度 4 位</text>

  <rect x="207" y="76" width="160" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="287" y="98" font-size="12" fill="#1e40af" text-anchor="middle">② 转发</text>
  <text x="287" y="116" font-size="12" fill="#1e40af" text-anchor="middle">目的 IP 32 位</text>
  <text x="287" y="134" font-size="12" fill="#1e40af" text-anchor="middle">只有路由器用</text>

  <rect x="392" y="76" width="160" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="472" y="98" font-size="12" fill="#b45309" text-anchor="middle">③ 上送</text>
  <text x="472" y="116" font-size="12" fill="#b45309" text-anchor="middle">协议号 8 位</text>
  <text x="472" y="134" font-size="12" fill="#b45309" text-anchor="middle">6 = TCP，17 = UDP</text>

  <rect x="577" y="76" width="160" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="657" y="98" font-size="12" fill="#166534" text-anchor="middle">④ 回信</text>
  <text x="657" y="116" font-size="12" fill="#166534" text-anchor="middle">源 IP 32 位</text>
  <text x="657" y="134" font-size="12" fill="#166534" text-anchor="middle">主机与路由器都要</text>

  <path d="M187,112 L 196,112" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M372,112 L 381,112" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M557,112 L 566,112" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <text x="380" y="180" font-size="10" fill="#64748b" text-anchor="middle">另有分组总长度 16 位；四组字段的分工决定了谁能用哪些字段</text>
</svg>
