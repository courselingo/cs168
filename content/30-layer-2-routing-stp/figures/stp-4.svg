<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376.5" width="760" height="376.5"
     role="img" aria-labelledby="fig-stp-4-title fig-stp-4-desc">
  <title id="fig-stp-4-title">环路为什么致命：关于 B 的表项永远装不上</title>
  <desc id="fig-stp-4-desc">上排四格是源文那个环的走法：R1 没有 B 于是洪泛给 R2 与 R3，R2 洪泛给 R4，R4 洪泛给 R3，R3 洪泛给 R1，回到起点。第二排一条说明另一个方向上还有一份副本在绕。第三排一条说明为什么它解不开：关于 A 的表项装上了，关于 B 的表项永远装不上，于是谁收到就洪泛，也就是广播风暴。第四排两格是两个被否掉的替代方案（给包加 TTL 字段；记住见过的包并丢掉重复的）。最下面一条是它们被否掉的共同理由：以太网头部里没有放这些信息的位置。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="376.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">环路为什么致命：关于 B 的表项永远装不上</text>
  <rect x="25" y="64" width="158.75" height="40.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="104.375" y="80.65" font-size="9" fill="#1e40af" text-anchor="middle">R1 没有 B</text>
  <text x="104.375" y="94.15" font-size="9" fill="#1e40af" text-anchor="middle">洪泛给 R2 与 R3</text>
  <rect x="208.75" y="64" width="158.75" height="40.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="288.125" y="80.65" font-size="9" fill="#1e40af" text-anchor="middle">R2 没有 B</text>
  <text x="288.125" y="94.15" font-size="9" fill="#1e40af" text-anchor="middle">洪泛给 R4</text>
  <rect x="392.5" y="64" width="158.75" height="40.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="471.875" y="80.65" font-size="9" fill="#1e40af" text-anchor="middle">R4 没有 B</text>
  <text x="471.875" y="94.15" font-size="9" fill="#1e40af" text-anchor="middle">洪泛给 R3</text>
  <rect x="576.25" y="64" width="158.75" height="40.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="655.625" y="80.65" font-size="9" fill="#b45309" text-anchor="middle">R3 没有 B</text>
  <text x="655.625" y="94.15" font-size="9" fill="#b45309" text-anchor="middle">洪泛给 R1，回到起点</text>
  <rect x="25" y="132.5" width="710" height="30" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="151" font-size="10" fill="#1e293b" text-anchor="middle">另一个方向上还有一份副本在绕：R1 给 R3，R3 给 R4，R4 给 R2，R2 再给 R1</text>
  <rect x="25" y="190.5" width="710" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="209" font-size="10" fill="#b45309" text-anchor="middle">为什么解不开：关于 A 的表项装上了，关于 B 的表项永远装不上，于是谁收到就洪泛，这就是广播风暴</text>
  <rect x="25" y="248.5" width="342.5" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="196.25" y="267" font-size="10" fill="#1e293b" text-anchor="middle">被否掉的替代方案一</text>
  <text x="196.25" y="282" font-size="10" fill="#1e293b" text-anchor="middle">给每个包加一个 TTL 字段，转发太多次就过期</text>
  <rect x="392.5" y="248.5" width="342.5" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="563.75" y="267" font-size="10" fill="#1e293b" text-anchor="middle">被否掉的替代方案二</text>
  <text x="563.75" y="282" font-size="10" fill="#1e293b" text-anchor="middle">记住见过的包，重复的就丢掉</text>
  <rect x="25" y="321.5" width="710" height="30" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="340" font-size="10" fill="#6b21a8" text-anchor="middle">两条被同一个事实否掉：以太网头部里没有放这些信息的位置，所以都实现不了</text>
</svg>
