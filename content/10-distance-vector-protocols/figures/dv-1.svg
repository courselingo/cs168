<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 189" width="760" height="189"
     role="img" aria-labelledby="fig-dv-1-title fig-dv-1-desc">
  <title id="fig-dv-1-title">宣告从目的地向外扩散</title>
  <desc id="fig-dv-1-desc">箭头依次向右：目的地 A 先告诉 R1「我是 A」；R1 有了路，就告诉邻居 R2、R3「我是 R1，我能到 A」；R2、R3 再往下告诉它们各自的邻居；一层层铺开，直到所有人的转发表都填满。整个协议只有两条动作：听到谁能到某地就记下他，自己有路就转告邻居。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="189" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">宣告从目的地向外扩散</text>

  <rect x="22" y="76" width="160" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="102" y="98" font-size="12" fill="#166534" text-anchor="middle">目的地 A</text>
  <text x="102" y="116" font-size="12" fill="#166534" text-anchor="middle">我是 A</text>

  <rect x="207" y="76" width="160" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="287" y="98" font-size="12" fill="#b45309" text-anchor="middle">R1</text>
  <text x="287" y="116" font-size="12" fill="#b45309" text-anchor="middle">我能到 A</text>

  <rect x="392" y="76" width="160" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="472" y="98" font-size="12" fill="#b45309" text-anchor="middle">R2、R3</text>
  <text x="472" y="116" font-size="12" fill="#b45309" text-anchor="middle">经 R1 能到 A</text>

  <rect x="577" y="76" width="160" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="657" y="98" font-size="12" fill="#b45309" text-anchor="middle">再下一层</text>
  <text x="657" y="116" font-size="12" fill="#b45309" text-anchor="middle">一直往外传</text>

  <path d="M187,103 L 196,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M372,103 L 381,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M557,103 L 566,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <text x="380" y="164" font-size="10" fill="#64748b" text-anchor="middle">听到谁能到某地就记下他；自己有路就转告所有邻居</text>
</svg>
