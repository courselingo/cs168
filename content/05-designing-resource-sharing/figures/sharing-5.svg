<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 189" width="760" height="189"
     role="img" aria-labelledby="fig-sharing-5-title fig-sharing-5-desc">
  <title id="fig-sharing-5-title">电路交换的一生：选路、预约、传数据、拆除</title>
  <desc id="fig-sharing-5-desc">箭头依次向右：先由两端主机确定一条穿过网络的路径；再发预约请求，沿途每台交换机都要同意，电路才建立起来；全部确认之后数据才能开始发送；流结束时发一条拆除消息，沿途每台交换机看到它就把自己的容量释放掉。电路这个名字来自电话网络。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="189" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">电路交换的一生</text>

  <rect x="22" y="76" width="160" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="102" y="98" font-size="12" fill="#1e40af" text-anchor="middle">一、选路</text>
  <text x="102" y="116" font-size="12" fill="#1e40af" text-anchor="middle">先定一条路径</text>

  <rect x="207" y="76" width="160" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="287" y="98" font-size="12" fill="#1e40af" text-anchor="middle">二、预约</text>
  <text x="287" y="116" font-size="12" fill="#1e40af" text-anchor="middle">沿途都要同意</text>

  <rect x="392" y="76" width="160" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="472" y="98" font-size="12" fill="#166534" text-anchor="middle">三、传数据</text>
  <text x="472" y="116" font-size="12" fill="#166534" text-anchor="middle">全部确认之后</text>

  <rect x="577" y="76" width="160" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="657" y="98" font-size="12" fill="#9d174d" text-anchor="middle">四、拆除</text>
  <text x="657" y="116" font-size="12" fill="#9d174d" text-anchor="middle">沿途释放容量</text>

  <path d="M187,103 L 196,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M372,103 L 381,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M557,103 L 566,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <text x="380" y="164" font-size="10" fill="#64748b" text-anchor="middle">「电路」这个名字来自电话网，它就是用这套办法让两个人互相通话的</text>
</svg>
