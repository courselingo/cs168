<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 203" width="760" height="203"
     role="img" aria-labelledby="fig-sharing-1-title fig-sharing-1-desc">
  <title id="fig-sharing-1-title">静态划分与统计复用</title>
  <desc id="fig-sharing-1-desc">左边是静态划分：无论用户当下在不在用，都先切一块留着，没人用也照样占着。右边是统计复用：谁要就给谁，按需求动态分配，不用了就还给别人。链路与交换机的容量都是有限的，这一讲要解决的就是怎么把它分出去。就像电脑不会预先切一半 CPU 给一个程序，而是按需要动态分配。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="203" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">静态划分与统计复用</text>

  <rect x="22" y="76" width="344" height="72" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="194" y="98" font-size="12" fill="#1e293b" text-anchor="middle">静态划分</text>
  <text x="194" y="116" font-size="12" fill="#1e293b" text-anchor="middle">先切一块留着，谁在不在都一样</text>
  <text x="194" y="134" font-size="12" fill="#1e293b" text-anchor="middle">没人用也占着</text>

  <rect x="394" y="76" width="344" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="566" y="98" font-size="12" fill="#1e40af" text-anchor="middle">统计复用</text>
  <text x="566" y="116" font-size="12" fill="#1e40af" text-anchor="middle">谁要就给谁，按需求动态分配</text>
  <text x="566" y="134" font-size="12" fill="#1e40af" text-anchor="middle">不用了就还给别人</text>

  <text x="380" y="178" font-size="10" fill="#64748b" text-anchor="middle">链路与交换机的容量有限，这一讲要解决的就是怎么把它分出去</text>
</svg>
