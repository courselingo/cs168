<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221"
     role="img" aria-labelledby="fig-sharing-4-title fig-sharing-4-desc">
  <title id="fig-sharing-4-title">先到先得与订座：分组交换与电路交换</title>
  <desc id="fig-sharing-4-desc">左边是分组交换，像餐厅先到先得：每个人都直接送数据，不做预约，交换机逐个分组独立转发，不保证有带宽。右边是电路交换，像订座：开流前先申请并预留带宽，沿途每台交换机都要同意，用完释放给别人订。两者其实都在做统计复用，区别只是分配资源的粒度：按流，还是按分组。教材原话是 both circuit switching and packet switching are embodying statistical multiplexing。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">先到先得与订座：分组交换与电路交换</text>

  <rect x="22" y="76" width="344" height="90" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="98" font-size="12" fill="#1e40af" text-anchor="middle">分组交换（packet switching）</text>
  <text x="194" y="116" font-size="12" fill="#1e40af" text-anchor="middle">每个人都直接送，不做预约</text>
  <text x="194" y="134" font-size="12" fill="#1e40af" text-anchor="middle">交换机逐个分组独立转发</text>
  <text x="194" y="152" font-size="12" fill="#1e40af" text-anchor="middle">不保证有带宽</text>

  <rect x="394" y="76" width="344" height="90" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="566" y="98" font-size="12" fill="#6b21a8" text-anchor="middle">电路交换（circuit switching）</text>
  <text x="566" y="116" font-size="12" fill="#6b21a8" text-anchor="middle">开流前先申请并预留带宽</text>
  <text x="566" y="134" font-size="12" fill="#6b21a8" text-anchor="middle">沿途每台交换机都要同意</text>
  <text x="566" y="152" font-size="12" fill="#6b21a8" text-anchor="middle">用完释放，给别人订</text>

  <text x="380" y="196" font-size="10" fill="#64748b" text-anchor="middle">教材原话：两种做法都在做统计复用，区别只在分配的粒度（按流预约 / 按分组尽力而为）</text>
</svg>
