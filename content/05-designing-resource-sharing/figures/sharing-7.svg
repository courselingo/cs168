<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 189" width="760" height="189"
     role="img" aria-labelledby="fig-sharing-7-title fig-sharing-7-desc">
  <title id="fig-sharing-7-title">第二把尺子：效率与突发度</title>
  <desc id="fig-sharing-7-desc">三列并排：语音通话的突发度约 3:1，比较平滑；网页浏览约 100:1，比较突发；预约式的浪费在于订了 12 Mbps 却绝大多数时间用不到。突发度是峰值速率与平均速率之比，没有明确的分界。三条流要 12、11、13 Mbps 而链路只有 30 Mbps 时，必然有一条预约被拒绝。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="189" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">第二把尺子：效率与突发度</text>

  <rect x="22" y="76" width="222" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="133" y="98" font-size="12" fill="#1e40af" text-anchor="middle">语音通话</text>
  <text x="133" y="116" font-size="12" fill="#1e40af" text-anchor="middle">突发度约 3:1</text>

  <rect x="269" y="76" width="222" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="98" font-size="12" fill="#1e40af" text-anchor="middle">网页浏览</text>
  <text x="380" y="116" font-size="12" fill="#1e40af" text-anchor="middle">突发度约 100:1</text>

  <rect x="516" y="76" width="222" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="627" y="98" font-size="12" fill="#9d174d" text-anchor="middle">预约式的浪费</text>
  <text x="627" y="116" font-size="12" fill="#9d174d" text-anchor="middle">订了 12，多数时候用不到</text>

  <text x="380" y="164" font-size="10" fill="#64748b" text-anchor="middle">突发度 = 峰值速率 ÷ 平均速率，没有明确的分界，只是描述性的说法</text>
</svg>
