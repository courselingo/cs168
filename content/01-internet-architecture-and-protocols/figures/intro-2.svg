<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 313" width="760" height="313"
     role="img" aria-labelledby="fig-intro-2-title fig-intro-2-desc">
  <title id="fig-intro-2-title">它不是又一种网络技术，而是把已有网络连起来</title>
  <desc id="fig-intro-2-desc">左列「再设计一套网络技术铺满全球」是 CourseLingo 的教学化简，不是源里的说法：源只说互联网不是又一种网络技术，而是把不同的网络连起来。左列的两条原因是网络技术早就存在、十万多个网络各有运营者；右列是源的做法：各片网络保留自己的技术，只要共同协议一致就能互通。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="313" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">它不是又一种网络技术，而是把已有网络连起来</text>

  <rect x="22" y="66" width="344" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194" y="88" font-size="12" fill="#9d174d" text-anchor="middle">直觉：再设计一套网络技术</text>
  <text x="194" y="106" font-size="12" fill="#9d174d" text-anchor="middle">铺满全球就解决了</text>

  <rect x="22" y="145" width="344" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194" y="167" font-size="12" fill="#9d174d" text-anchor="middle">可网络技术早就存在了</text>

  <rect x="22" y="206" width="344" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194" y="228" font-size="12" fill="#9d174d" text-anchor="middle">十万多个网络各有运营者</text>

  <rect x="394" y="66" width="344" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="88" font-size="12" fill="#166534" text-anchor="middle">互联网的实际做法</text>
  <text x="566" y="106" font-size="12" fill="#166534" text-anchor="middle">把不同的网络连起来</text>

  <rect x="394" y="145" width="344" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="167" font-size="12" fill="#166534" text-anchor="middle">各片网络保留自己的技术</text>

  <rect x="394" y="206" width="344" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="228" font-size="12" fill="#166534" text-anchor="middle">只要共同协议一致就能互通</text>

  <text x="380" y="268" font-size="11" fill="#64748b" text-anchor="middle">源的重点：互操作是互联网最重要的目标（s32）</text>
  <text x="380" y="288" font-size="10" fill="#9d174d" text-anchor="middle">左列是我们的教学化简：源只说「不是又一种网络技术，而是把不同的网络连起来」</text>
</svg>
