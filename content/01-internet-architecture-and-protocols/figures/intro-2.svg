<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 325" width="760" height="325"
     role="img" aria-labelledby="fig-intro-2-title fig-intro-2-desc">
  <title id="fig-intro-2-title">省事的做法是建一张新网，可行的是把旧网连起来</title>
  <desc id="fig-intro-2-desc">左列是「新建一张网」的代价：全世界的网络都得换掉、一家公司扛不住全球规模、升级要等唯一的老板点头；右列是「把已有网络互连」的代价：各家网络保持原样，只需约定一套共同协议，规模随网络数量增长。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="325" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">省事的做法是建一张新网，可行的是把旧网连起来</text>

  <!-- 左列：新建一张网 -->
  <rect x="22" y="66" width="344" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194" y="88" font-size="12" fill="#9d174d" text-anchor="middle">做法一：新建一张网</text>
  <text x="194" y="106" font-size="12" fill="#9d174d" text-anchor="middle">全世界的网络都得换成它的</text>

  <rect x="22" y="145" width="344" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194" y="167" font-size="12" fill="#9d174d" text-anchor="middle">可现成的网络不可能一起换掉</text>

  <rect x="22" y="206" width="344" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194" y="228" font-size="12" fill="#9d174d" text-anchor="middle">一家公司也扛不住全球规模</text>

  <rect x="22" y="267" width="344" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194" y="289" font-size="12" fill="#9d174d" text-anchor="middle">升级要等唯一的老板点头</text>

  <!-- 右列：把已有网络互连 -->
  <rect x="394" y="66" width="344" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="88" font-size="12" fill="#166534" text-anchor="middle">做法二：把已有网络互连</text>
  <text x="566" y="106" font-size="12" fill="#166534" text-anchor="middle">各家网络保持原样</text>

  <rect x="394" y="145" width="344" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="167" font-size="12" fill="#166534" text-anchor="middle">只需约定一套共同协议</text>

  <rect x="394" y="206" width="344" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="228" font-size="12" fill="#166534" text-anchor="middle">规模随网络数量增长</text>

  <rect x="394" y="267" width="344" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="289" font-size="12" fill="#166534" text-anchor="middle">一家出问题不拖垮全部</text>
</svg>
