<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 255" width="760" height="255"
     role="img" aria-labelledby="fig-intro-5-title fig-intro-5-desc">
  <title id="fig-intro-5-title">联邦的代价：升级「互联网」不是一个选项</title>
  <desc id="fig-intro-5-desc">三个框一路向右：互操作要求大家都支持同一个协议，于是源留下一个问句「你靠什么做出区别」，再往下，升级「互联网」不是一个选项。粉色弧线是回环，标出源里的结论：整条链的后果是创新被拖慢。图内灰字注明：中间那个框是源留下的问句，不是已成立的命题。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="255" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">联邦的代价：升级「互联网」不是一个选项</text>

  <rect x="22" y="76" width="220" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="132" y="98" font-size="12" fill="#1e40af" text-anchor="middle">互操作要求大家</text>
  <text x="132" y="116" font-size="12" fill="#1e40af" text-anchor="middle">都支持同一个协议</text>

  <rect x="270" y="76" width="220" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="107" font-size="12" fill="#1e40af" text-anchor="middle">那你怎么做出区别</text>

  <rect x="518" y="76" width="220" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="628" y="98" font-size="12" fill="#1e40af" text-anchor="middle">而升级「互联网」</text>
  <text x="628" y="116" font-size="12" fill="#1e40af" text-anchor="middle">不是一个选项</text>

  <!-- 一路向右的推进 -->
  <path d="M247,103 L 259,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M495,103 L 507,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <!-- 回环：绕回起点，源里的结论是创新被拖慢 -->
  <path d="M628,135 C 628,196 132,196 132,141" fill="none" stroke="#ec4899" marker-end="url(#arrow)"/>
  <text x="380" y="206" font-size="11" fill="#9d174d" text-anchor="middle">整条链的后果：创新被拖慢</text>

  <text x="380" y="232" font-size="10" fill="#64748b" text-anchor="middle">中间那个框是源留下的问句，不是已成立的命题</text>
</svg>
