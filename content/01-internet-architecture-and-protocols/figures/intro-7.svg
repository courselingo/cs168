<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 343" width="760" height="343"
     role="img" aria-labelledby="fig-intro-7-title fig-intro-7-desc">
  <title id="fig-intro-7-title">部件越多，整体可靠率掉得比直觉快</title>
  <desc id="fig-intro-7-desc">三条长短不同的条形，分别表示 1 个、10 个、50 个部件串在一条路径上时的整体可靠率：单个部件 99% 可靠时，1 个部件几乎不出错，10 个降到 90.4%，50 个只剩 60.5%，也就是失败 39.5%。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="343" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">部件越多，整体可靠率掉得比直觉快</text>

  <rect x="22" y="76" width="716" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="98" font-size="12" fill="#166534" text-anchor="middle">1 个部件：可靠率 99%</text>
  <text x="380" y="116" font-size="12" fill="#166534" text-anchor="middle">单点几乎不出错</text>

  <rect x="22" y="155" width="648" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="346" y="177" font-size="12" fill="#b45309" text-anchor="middle">10 个部件：可靠率 90.4%</text>
  <text x="346" y="195" font-size="12" fill="#b45309" text-anchor="middle">失败率已经接近一成</text>

  <rect x="22" y="234" width="433" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="239" y="256" font-size="12" fill="#9d174d" text-anchor="middle">50 个部件：可靠率 60.5%</text>
  <text x="239" y="274" font-size="12" fill="#9d174d" text-anchor="middle">失败 39.5%</text>

  <text x="380" y="318" font-size="12" fill="#64748b" text-anchor="middle">0.99 连乘 50 次 ≈ 0.605，也就是失败 39.5%</text>
</svg>
