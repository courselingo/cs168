<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 303" width="760" height="303"
     role="img" aria-labelledby="fig-intro-9-title fig-intro-9-desc">
  <title id="fig-intro-9-title">网络架构谈的是取舍，不是最优解</title>
  <desc id="fig-intro-9-desc">三行对照，左边是架构更看重的一侧，右边是它相对不那么看重的一侧：思考得严谨而不是严谨的数学证明，理解各种取舍而不是跑性能基准，实用而不是最优。两列等宽，列标题各自居中。页脚标出处：这三条措辞来自幻灯片 s47，不是教材原话。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="303" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">网络架构谈的是取舍，不是最优解</text>

  <text x="194" y="68" font-size="11" fill="#64748b" text-anchor="middle">架构更看重</text>
  <text x="566" y="68" font-size="11" fill="#64748b" text-anchor="middle">而不是</text>

  <rect x="22" y="86" width="344" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="194" y="108" font-size="12" fill="#6b21a8" text-anchor="middle">思考得严谨</text>

  <rect x="394" y="86" width="344" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="566" y="108" font-size="12" fill="#1e293b" text-anchor="middle">严谨的数学证明</text>

  <rect x="22" y="147" width="344" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="194" y="169" font-size="12" fill="#6b21a8" text-anchor="middle">理解各种取舍</text>

  <rect x="394" y="147" width="344" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="566" y="169" font-size="12" fill="#1e293b" text-anchor="middle">跑性能基准</text>

  <rect x="22" y="208" width="344" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="194" y="230" font-size="12" fill="#6b21a8" text-anchor="middle">实用</text>

  <rect x="394" y="208" width="344" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="566" y="230" font-size="12" fill="#1e293b" text-anchor="middle">最优</text>

  <text x="380" y="278" font-size="12" fill="#64748b" text-anchor="middle">幻灯片原话（s47）：更关于思考得严谨、更关于理解取舍、更关于实用</text>
</svg>
