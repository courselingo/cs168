<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-mc-5-two-parts-title fig-mc-5-two-parts-desc">
  <title id="fig-mc-5-two-parts-title">两块拼图：本地那一块由 IGMP 解决，全局那一块由 DVMRP 或 CBT 解决，而且二选一</title>
  <desc id="fig-mc-5-two-parts-desc">实现多播分成两块：一是路由器怎么知道直连主机属于哪些组，用 IGMP 解决；二是路由器怎么把分组送到网络里的成员，有 DVMRP 与 CBT 两个协议，它们目标相同所以二选一，就像域内路由可以在距离向量与链路状态之间选一个。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两块拼图：本地那一块由 IGMP 解决，全局那一块由 DVMRP 或 CBT 解决，而且二选一</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">实现问题被切成两半：本地与全局</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="147" font-size="12" fill="#b45309" text-anchor="middle">第一块：路由器怎么知道直连主机属于哪些组</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="208" font-size="12" fill="#166534" text-anchor="middle">答案：用 IGMP 这个协议解决</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="269" font-size="12" fill="#b45309" text-anchor="middle">第二块：路由器怎么把分组在网络里送到各成员</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="330" font-size="12" fill="#166534" text-anchor="middle">答案：DVMRP 与 CBT 两个协议目标相同、二选一（就像距离向量与链路状态，不能都上）</text>
  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">本地那一块是所有多播协议共用的地基</text>
</svg>
