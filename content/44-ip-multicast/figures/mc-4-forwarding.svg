<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-mc-4-forwarding-title fig-mc-4-forwarding-desc">
  <title id="fig-mc-4-forwarding-title">从单播到多播：下一跳可以是零条、一条或多条，而每条链路上同一分组只转发一次</title>
  <desc id="fig-mc-4-forwarding-desc">单播里路由器沿唯一一条下一跳转发，而多播里可以沿零条、一条或多条出链路转发，使分组到达所有成员；零条对应这个方向没有成员。为此路由器要多存一点组成员关系状态，只往通向成员的下一跳送；而同一个分组在每条链路上只转发一次。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">从单播到多播：下一跳可以是零条、一条或多条，而每条链路上同一分组只转发一次</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">单播：路由器收到分组后沿唯一的一条下一跳转发</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="147" font-size="12" fill="#166534" text-anchor="middle">多播：路由器沿零条、一条或多条出链路转发，使分组到达所有成员</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="208" font-size="12" fill="#b45309" text-anchor="middle">零条的含义：这个方向没有组成员，所以不必往那边送</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="269" font-size="12" fill="#b45309" text-anchor="middle">因此路由器要多存一点状态（组成员关系），只往通向成员的下一跳送</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="330" font-size="12" fill="#9d174d" text-anchor="middle">配图注解：同一个分组在每条链路上只转发一次，避免沿同一条链路重复发送同一份数据</text>
  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">多播没有单一的「下一条」，只有一棵通往成员的树</text>
</svg>
