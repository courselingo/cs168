<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-mc-1-history-title fig-mc-1-history-desc">
  <title id="fig-mc-1-history-title">IP 多播的历史与现状：九十年代为直播而生、采用喜忧参半、如今在 AI 训练里重新有用</title>
  <desc id="fig-mc-1-history-desc">IP 多播在九十年代到两千年代被大量研究，当时的预期是直播电视或电台会成为互联网的杀手级应用；结果采用情况喜忧参半：现代路由器支持这些协议，但运营者不总是打开，而且它们很少跨域部署，所以用户不能指望在全局互联网上使用多播；不过这些技术在 AI 训练等场景里重新变得有用。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">IP 多播的历史与现状：九十年代为直播而生、采用喜忧参半、如今在 AI 训练里重新有用</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">九十年代到两千年代：多播被大量研究与开发</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="147" font-size="12" fill="#1e40af" text-anchor="middle">当年的预期：互联网的杀手级应用会是直播电视或电台（1994 年滚石乐队是最早的直播演唱会之一）</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="208" font-size="12" fill="#b45309" text-anchor="middle">现状一：现代路由器支持这些协议，但运营者不总是打开（关掉就等于不支持）</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="269" font-size="12" fill="#9d174d" text-anchor="middle">现状二：有时在单个域内用（例如数据中心内部），但很少或从不跨域部署</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="330" font-size="12" fill="#166534" text-anchor="middle">所以用户不能指望在全互联网范围内使用多播；不过这些技术后来在 AI 训练里重新变得有用</text>
  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">协议没铺开，技术留下来了</text>
</svg>
