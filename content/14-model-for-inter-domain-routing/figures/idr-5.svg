<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 335" width="760" height="335"
     role="img" aria-labelledby="fig-idr-5-title fig-idr-5-desc">
  <title id="fig-idr-5-title">客户-提供者关系不成环，于是形成提供者层级</title>
  <desc id="fig-idr-5-desc">最上面两个一级 AS 之间画一条对等边，它们没有提供者，而且彼此都对等。中间是一个区域提供者，箭头向下表示它把连通性卖给下面的末端 AS：层级里服务往下走、钱往上走。最下面两行是推论，从任何一个 AS 出发沿着提供者一路上行，总会走到某个一级 AS，这正是整张 AS 图连成一体、而不是断成两张网的原因。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="335" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">客户-提供者关系不成环，于是形成提供者层级</text>
  <rect x="165" y="70" width="200" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="265" y="92" font-size="12" fill="#166534" text-anchor="middle">一级 AS 甲</text>
  <rect x="395" y="70" width="200" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="495" y="92" font-size="12" fill="#166534" text-anchor="middle">一级 AS 乙</text>
  <path d="M370,88 L390,88" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="190" y="133" width="380" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="155" font-size="12" fill="#b45309" text-anchor="middle">区域提供者</text>
  <path d="M265,111 L265,122" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M495,111 L495,122" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="180" y="196" width="200" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="280" y="218" font-size="12" fill="#1e40af" text-anchor="middle">末端 AS</text>
  <rect x="410" y="196" width="200" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="510" y="218" font-size="12" fill="#1e40af" text-anchor="middle">末端 AS</text>
  <path d="M280,174 L280,185" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M510,174 L510,185" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="22" y="259" width="716" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="281" font-size="12" fill="#6b21a8" text-anchor="middle">一级 AS 没有提供者，而且彼此对等；每个非一级 AS 至少有一个提供者</text>
  <text x="380" y="299" font-size="12" fill="#6b21a8" text-anchor="middle">沿着提供者一路上行总能走到一级 AS，所以整张图是连通的</text>
</svg>
