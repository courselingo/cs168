<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 342" width="760" height="342"
     role="img" aria-labelledby="fig-idr-10-title fig-idr-10-desc">
  <title id="fig-idr-10-title">路径先上坡，翻过一个峰，然后一路下坡</title>
  <desc id="fig-idr-10-desc">三个方框给出路径在山谷形状上的三个阶段：上坡是往提供者走，峰上最多跨一条对等边，下坡是往客户走。下面的曲线画出这条单峰路径：从左边上坡，翻过唯一的峰，再一路下坡到右边。最下面两行是推论：一旦下坡就不能回头上坡，也不能横着走；上坡之后可以接对等、接下坡，或者继续上坡。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="342" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">路径先上坡，翻过一个峰，然后一路下坡</text>
  <rect x="22" y="70" width="220" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="132" y="92" font-size="12" fill="#b45309" text-anchor="middle">上坡：下一跳是提供者</text>
  <rect x="272" y="70" width="220" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="382" y="92" font-size="12" fill="#6b21a8" text-anchor="middle">峰：最多一条对等边</text>
  <rect x="522" y="70" width="216" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="630" y="92" font-size="12" fill="#166534" text-anchor="middle">下坡：之后只能下坡</text>
  <rect x="22" y="133" width="716" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="155" font-size="12" fill="#9d174d" text-anchor="middle">一旦下坡（去客户）就不能回头上坡，也不能横着走</text>
  <text x="380" y="173" font-size="12" fill="#9d174d" text-anchor="middle">上坡之后可以接对等、接下坡，或者继续上坡</text>
  <path d="M40,320 C 190,320 200,240 380,240 C 560,240 570,320 720,320" fill="none" stroke="#64748b" stroke-width="1.5"/>
</svg>
