<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" width="760" height="272"
     role="img" aria-labelledby="fig-idr-3-title fig-idr-3-desc">
  <title id="fig-idr-3-title">两类 AS：只为自己人收发，和替别人转发</title>
  <desc id="fig-idr-3-desc">左框是末端 AS：只为本地网络里的主机收发分组，不替别的 AS 转发，银行、大学、UC Berkeley 都是这一类，世界上绝大多数 AS 也是这一类。右框是中转 AS：替别的 AS 转发分组，AT&amp;T、Verizon、加州本地的 Sonic 都是这一类。下面两行是类比与例子：末端 AS 像端主机，中转 AS 像路由器。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="272" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两类 AS：只为自己人收发，和替别人转发</text>
  <rect x="22" y="70" width="343" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="193.5" y="92" font-size="12" fill="#166534" text-anchor="middle">末端 AS（stub）</text>
  <text x="193.5" y="110" font-size="12" fill="#166534" text-anchor="middle">只为自己的主机收发</text>
  <rect x="395" y="70" width="343" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="566.5" y="92" font-size="12" fill="#b45309" text-anchor="middle">中转 AS（transit）</text>
  <text x="566.5" y="110" font-size="12" fill="#b45309" text-anchor="middle">替别的 AS 转发分组</text>
  <rect x="22" y="151" width="716" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="173" font-size="12" fill="#6b21a8" text-anchor="middle">类比上一讲的模型：末端 AS 像端主机，中转 AS 像路由器</text>
  <rect x="22" y="214" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="236" font-size="12" fill="#1e40af" text-anchor="middle">例：银行、大学的末端 AS；AT&amp;T、Verizon、Sonic 是中转 AS</text>
</svg>
