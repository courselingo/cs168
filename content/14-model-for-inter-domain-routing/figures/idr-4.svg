<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 335" width="760" height="335"
     role="img" aria-labelledby="fig-idr-4-title fig-idr-4-desc">
  <title id="fig-idr-4-title">有向边表示谁付钱，无向边表示对等</title>
  <desc id="fig-idr-4-desc">上面一行是客户-提供者关系：箭头从提供者指向客户，说的是客户付钱、提供者给连通性。下面一行是对等关系：两个对等 AS 互相送的流量大致相当，通常签一份合同互不付费，画成一条没有箭头的边。最下面指出箭头方向与分组方向无关：有向边上，分组两个方向都能走。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="335" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">有向边表示谁付钱，无向边表示对等</text>
  <rect x="290" y="70" width="180" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="92" font-size="12" fill="#1e40af" text-anchor="middle">提供者</text>
  <rect x="500" y="70" width="180" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="590" y="92" font-size="12" fill="#b45309" text-anchor="middle">客户</text>
  <path d="M475,88 L489,88" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="290" y="133" width="180" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="155" font-size="12" fill="#6b21a8" text-anchor="middle">对等 A</text>
  <rect x="500" y="133" width="180" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="590" y="155" font-size="12" fill="#6b21a8" text-anchor="middle">对等 B</text>
  <path d="M475,151 L495,151" fill="none" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="22" y="196" width="716" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="218" font-size="12" fill="#166534" text-anchor="middle">箭头从提供者指向客户，说的是谁付钱</text>
  <text x="380" y="236" font-size="12" fill="#166534" text-anchor="middle">对等是一条没有箭头的边：流量大致相当，通常互不付费</text>
  <rect x="22" y="277" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="299" font-size="12" fill="#9d174d" text-anchor="middle">箭头方向跟分组往哪走没关系：有向边上，分组两个方向都能走</text>
</svg>
