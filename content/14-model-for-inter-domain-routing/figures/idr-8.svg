<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-idr-8-title fig-idr-8-desc">
  <title id="fig-idr-8-title">第二条规则：两组邻居里至少有一个是客户</title>
  <desc id="fig-idr-8-desc">六张卡片逐条摆出教材列出的六种邻居组合：客户加客户、客户加对等、客户加提供者三种是好的，因为至少有一个邻居付我钱；对等加对等、对等加提供者、提供者加提供者三种是不好的，因为没有人为这一趟付钱，最后一种还要我两边都付。最下面两行给出更一般的说法：对等链路不替别的对等转发，路径不能在同一层连走两跳。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">第二条规则：两组邻居里至少有一个是客户</text>
  <rect x="22" y="70" width="343" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="193.5" y="92" font-size="12" fill="#166534" text-anchor="middle">客户 + 客户</text>
  <text x="193.5" y="110" font-size="12" fill="#166534" text-anchor="middle">两边都付我钱：好</text>
  <rect x="395" y="70" width="343" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566.5" y="92" font-size="12" fill="#166534" text-anchor="middle">客户 + 对等</text>
  <text x="566.5" y="110" font-size="12" fill="#166534" text-anchor="middle">客户付钱就够：好</text>
  <rect x="22" y="151" width="343" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="193.5" y="173" font-size="12" fill="#166534" text-anchor="middle">客户 + 提供者</text>
  <text x="193.5" y="191" font-size="12" fill="#166534" text-anchor="middle">至少客户付钱：好</text>
  <rect x="395" y="151" width="343" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566.5" y="173" font-size="12" fill="#9d174d" text-anchor="middle">对等 + 对等</text>
  <text x="566.5" y="191" font-size="12" fill="#9d174d" text-anchor="middle">没人付钱：不好</text>
  <rect x="22" y="232" width="343" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="193.5" y="254" font-size="12" fill="#9d174d" text-anchor="middle">对等 + 提供者</text>
  <text x="193.5" y="272" font-size="12" fill="#9d174d" text-anchor="middle">没人付钱：不好</text>
  <rect x="395" y="232" width="343" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566.5" y="254" font-size="12" fill="#9d174d" text-anchor="middle">提供者 + 提供者</text>
  <text x="566.5" y="272" font-size="12" fill="#9d174d" text-anchor="middle">两边都要我付：不好</text>
  <rect x="22" y="313" width="716" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="335" font-size="12" fill="#6b21a8" text-anchor="middle">更一般地说：对等链路不替别的对等转发</text>
  <text x="380" y="353" font-size="12" fill="#6b21a8" text-anchor="middle">路径不能在同一层连走两跳，否则没有人为它付钱</text>
</svg>
