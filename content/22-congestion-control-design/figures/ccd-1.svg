<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 305" width="760" height="305"
     role="img" aria-labelledby="fig-ccd-1-title fig-ccd-1-desc">
  <title id="fig-ccd-1-title">主机侧算法的循环与三个待定项</title>
  <desc id="fig-ccd-1-desc">上排三格按顺序向右：先按速率 R 发一段固定的时间；再问这一段有没有拥塞，信号可以是丢包也可以是延迟；然后拥塞就把 R 减小、没拥塞就把 R 增大。下排一条横格列出还没定的三项：起始速率 R 取多少、怎么判断有没有拥塞、每次该加多少该减多少。最下方注明这一圈会一直重复，因为网络在变，速率不是定一次就不管了。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="305" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">主机侧算法的循环与三个待定项</text>

  <rect x="22" y="76" width="221" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="132" y="98" font-size="12" fill="#1e40af" text-anchor="middle">① 按速率 R 发一段</text>
  <text x="132" y="116" font-size="12" fill="#1e40af" text-anchor="middle">R 是每秒发多少数据</text>
  <text x="132" y="134" font-size="12" fill="#1e40af" text-anchor="middle">发上一段固定的时间</text>

  <rect x="269" y="76" width="221" height="72" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="98" font-size="12" fill="#6b21a8" text-anchor="middle">② 这一段堵了吗</text>
  <text x="380" y="116" font-size="12" fill="#6b21a8" text-anchor="middle">信号要么是丢包</text>
  <text x="380" y="134" font-size="12" fill="#6b21a8" text-anchor="middle">要么是延迟在变大</text>

  <rect x="516" y="76" width="221" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="626" y="98" font-size="12" fill="#b45309" text-anchor="middle">③ 堵了减，没堵加</text>
  <text x="626" y="116" font-size="12" fill="#b45309" text-anchor="middle">加多少、减多少</text>
  <text x="626" y="134" font-size="12" fill="#b45309" text-anchor="middle">决定了跟得多快</text>

  <path d="M248,112 L258,112" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M495,112 L505,112" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="174" width="716" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="196" font-size="12" fill="#166534" text-anchor="middle">三个待定项</text>
  <text x="380" y="214" font-size="12" fill="#166534" text-anchor="middle">起始速率 R 取多少，拥塞怎么判断</text>
  <text x="380" y="232" font-size="12" fill="#166534" text-anchor="middle">还有每次该加多少、该减多少</text>

  <text x="380" y="280" font-size="10" fill="#64748b" text-anchor="middle">这一圈会一直重复：网络在变，速率不是定一次就不管了</text>
</svg>
