<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-col-8-overlay-title fig-col-8-overlay-desc">
  <title id="fig-col-8-overlay-title">overlay 是一圈虚拟链路，underlay 是一跳跳真实转发；编号方式决定平均拉伸</title>
  <desc id="fig-col-8-overlay-desc">用户任选 p 台主机时，它们几乎不可能物理上连成环，于是用 overlay 画一圈虚拟链路：overlay 看是一跳，underlay 看要走好几跳。性能取决于两者贴得多近，而编号方式会影响性能（两种编号的平均拉伸分别是 3.5 与 2.5）。优化方向是让环上相邻的节点在网络里也相邻。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">overlay 是一圈虚拟链路，underlay 是一跳跳真实转发；编号方式决定平均拉伸</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">用户任选 p 台主机，它们几乎不可能物理上连成环，所以在 overlay 上画一圈虚拟链路</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="147" font-size="12" fill="#b45309" text-anchor="middle">overlay 看是一跳，underlay 看要走好几跳到目的地</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="208" font-size="12" fill="#9d174d" text-anchor="middle">性能取决于 overlay 与 underlay 贴得多近，而 AI 训练要搬的数据量极大</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="269" font-size="12" fill="#166534" text-anchor="middle">编号会影响性能：两种编号的平均拉伸分别是 3.5 与 2.5（后者把环上相邻的放得更近）</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="330" font-size="12" fill="#6b21a8" text-anchor="middle">优化方向：让环上相邻的节点在网络里也相邻（同机 GPU 最快，跨机架最慢）</text>
  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">算法看到的是环，网络看到的是路径</text>
</svg>
