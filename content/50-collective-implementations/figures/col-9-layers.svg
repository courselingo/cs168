<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328"
     role="img" aria-labelledby="fig-col-9-layers-title fig-col-9-layers-desc">
  <title id="fig-col-9-layers-title">集合操作的三层抽象：定义、overlay、underlay</title>
  <desc id="fig-col-9-layers-desc">集合操作的三个抽象层：定义层（用输入与期望输出定义操作，用户只需要懂这一层）、overlay 层（假设节点已排成树或环，讨论交换什么数据）、underlay 层（虚拟链路怎么落到真实物理链路与转发上）。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="328" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">集合操作的三层抽象：定义、overlay、underlay</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">定义层：用输入与期望输出定义操作；用户只需要懂这一层</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="147" font-size="12" fill="#b45309" text-anchor="middle">overlay 层：假设节点已排成有用的拓扑（树或环），讨论在这层交换什么数据</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="208" font-size="12" fill="#166534" text-anchor="middle">underlay 层：虚拟链路怎么落到真实的物理链路与转发上</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="269" font-size="12" fill="#6b21a8" text-anchor="middle">三层各回答自己那一层的问题：能不能用、怎么排数据、怎么落到硬件</text>
  <text x="380" y="305" font-size="10" fill="#64748b" text-anchor="middle">同一个操作可以在三个抽象层上被讨论</text>
</svg>
