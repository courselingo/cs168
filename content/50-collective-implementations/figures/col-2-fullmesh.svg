<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-col-2-fullmesh-title fig-col-2-fullmesh-desc">
  <title id="fig-col-2-fullmesh-title">全网状：每对节点直连，带宽 O(Dp²)，但一个时间步就能完成</title>
  <desc id="fig-col-2-fullmesh-desc">全网状拓扑下每对节点都有直连链路：所有人把整个向量发给其他每个节点再各自求和。带宽是 Dp(p-1)，即 O(D·p²)，是本节最贵的方案；但无资源限制时只需一个时间步完成。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">全网状：每对节点直连，带宽 O(Dp²)，但一个时间步就能完成</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">拓扑：全网状，每两个节点之间都有直连链路</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="147" font-size="12" fill="#b45309" text-anchor="middle">做法：所有人把整个向量直接发给其他每一个节点，然后各自把收到的向量加起来</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="208" font-size="12" fill="#9d174d" text-anchor="middle">带宽：每节点发 D(p-1) 字节，共 p 个节点，合计 Dp(p-1) = O(D·p²)，是本节最贵的</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="269" font-size="12" fill="#166534" text-anchor="middle">时间：无资源限制时一次发完，只需一个时间步</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="330" font-size="12" fill="#6b21a8" text-anchor="middle">注意：源文这段按每条节点 3 条出链路讲，那只对应 p=4；本节 p=5，应为 4 条出链路</text>
  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">用平方级的带宽买来最少的时间步</text>
</svg>
