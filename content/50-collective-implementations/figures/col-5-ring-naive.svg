<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-col-5-ring-naive-title fig-col-5-ring-naive-desc">
  <title id="fig-col-5-ring-naive-title">朴素环：第一趟绕着环累加，第二趟把总和绕着环分发</title>
  <desc id="fig-col-5-ring-naive-desc">环方案第一趟让 5 号节点往左发，每个节点把右边邻居的向量与自己的相加后再往左发，绕一圈后 1 号节点算出总和；第二趟把总和再绕一圈分发。两趟各 2D·p 字节，合计 4D·p 即 O(D·p)；时间上两趟各 p 步，合计 O(p)。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">朴素环：第一趟绕着环累加，第二趟把总和绕着环分发</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">拓扑：环；绕回来那条链路与其他链路没有区别，画得长不代表更远</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="147" font-size="12" fill="#b45309" text-anchor="middle">第一趟：5 号节点往左发，每个节点把右边邻居的向量与自己的相加后再往左发，绕一圈</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="208" font-size="12" fill="#166534" text-anchor="middle">收尾：1 号节点算出总和</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="269" font-size="12" fill="#b45309" text-anchor="middle">第二趟：把总和再绕一圈分发，每个节点收到后往左发一份拷贝</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="330" font-size="12" fill="#6b21a8" text-anchor="middle">带宽：两趟各 2D·p，合计 4D·p = O(D·p)；时间：两趟各 p 步，合计 O(p)</text>
  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">没有任何中心节点，代价是必须绕够一整圈</text>
</svg>
