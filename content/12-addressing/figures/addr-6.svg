<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 187" width="760" height="187"
     role="img" aria-labelledby="fig-addr-6-title fig-addr-6-desc">
  <title id="fig-addr-6-title">CIDR：网络 ID 的长度按需切</title>
  <desc id="fig-addr-6-desc">三格并排：十人小公司在分类编址下会拿到 256 个地址的 C 类，改成 28 位网络 ID 就只剩 16 个地址（浪费 6 个）；需要 450 个地址的组织，C 类的 256 不够、B 类的 65,000 又太浪费，改成 23 位网络 ID 得到 512 个地址，刚好够用。核心差别是网络 ID 的固定位数可以是任意值，不再只有三类。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="187" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">CIDR：位数按需切</text>

  <rect x="22" y="76" width="222" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="133" y="98" font-size="12" fill="#1e40af" text-anchor="middle">十人小公司</text>
  <text x="133" y="116" font-size="12" fill="#1e40af" text-anchor="middle">/28 = 16 个地址</text>

  <rect x="269" y="76" width="222" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="98" font-size="12" fill="#1e40af" text-anchor="middle">需要 450 个地址</text>
  <text x="380" y="116" font-size="12" fill="#1e40af" text-anchor="middle">/23 = 512 个地址</text>

  <rect x="516" y="76" width="222" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="627" y="98" font-size="12" fill="#166534" text-anchor="middle">对比分类编址</text>
  <text x="627" y="116" font-size="12" fill="#166534" text-anchor="middle">256 或 65,000</text>

  <text x="380" y="162" font-size="10" fill="#64748b" text-anchor="middle">切不到刚好，但浪费远小于「不是太小就是太大」</text>
</svg>
