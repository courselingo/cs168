<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 223" width="760" height="223"
     role="img" aria-labelledby="fig-addr-5-title fig-addr-5-desc">
  <title id="fig-addr-5-title">分类编址：A/B/C 三类各自的位数与死结</title>
  <desc id="fig-addr-5-desc">三类并排：A 类首位是 0，接 7 位网络 ID 共 128 个网络，再 24 位主机 ID 共 1600 万台主机；B 类开头是 10，接 14 位网络 ID 共 16,000 个网络，再 16 位主机 ID 共 65,000 台；C 类开头是 110，接 21 位网络 ID 共 200 万个网络，再 8 位主机 ID 共 256 台。死结在于规模都不合用：A 类太大、C 类太小，于是大家都挤 B 类，而 B 类只有 16,000 个网络 ID，1994 年就耗尽了。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="223" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">分类编址：三类网络</text>

  <rect x="22" y="76" width="222" height="90" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="133" y="98" font-size="12" fill="#1e40af" text-anchor="middle">A 类：0 开头</text>
  <text x="133" y="116" font-size="12" fill="#1e40af" text-anchor="middle">7 位网络：128 个</text>
  <text x="133" y="134" font-size="12" fill="#1e40af" text-anchor="middle">24 位主机</text>
  <text x="133" y="152" font-size="12" fill="#1e40af" text-anchor="middle">1600 万台主机</text>

  <rect x="269" y="76" width="222" height="90" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="98" font-size="12" fill="#b45309" text-anchor="middle">B 类：10 开头</text>
  <text x="380" y="116" font-size="12" fill="#b45309" text-anchor="middle">14 位网络：16,000 个</text>
  <text x="380" y="134" font-size="12" fill="#b45309" text-anchor="middle">16 位主机</text>
  <text x="380" y="152" font-size="12" fill="#b45309" text-anchor="middle">65,000 台主机</text>

  <rect x="516" y="76" width="222" height="90" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="627" y="98" font-size="12" fill="#9d174d" text-anchor="middle">C 类：110 开头</text>
  <text x="627" y="116" font-size="12" fill="#9d174d" text-anchor="middle">21 位网络：200 万个</text>
  <text x="627" y="134" font-size="12" fill="#9d174d" text-anchor="middle">8 位主机</text>
  <text x="627" y="152" font-size="12" fill="#9d174d" text-anchor="middle">256 台主机</text>

  <text x="380" y="198" font-size="10" fill="#64748b" text-anchor="middle">A 太大、C 太小，大家都挤 B 类；B 类只有 16,000 个，1994 年耗尽</text>
</svg>
