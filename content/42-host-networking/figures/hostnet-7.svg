<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 223" width="760" height="223"
     role="img" aria-labelledby="fig-hostnet-7-title fig-hostnet-7-desc">
  <title id="fig-hostnet-7-title">RDMA：数据路径绕开两端 CPU，程序用的是队列对与 WQE、CQE</title>
  <desc id="fig-hostnet-7-desc">四行自上而下：RDMA 的抽象是服务器 A 直接访问服务器 B 的内存，两端都不需要操作系统与 CPU 参与数据传输的主体，但开头建立传输与结尾收尾仍要 CPU；编程不再用套接字，主要抽象是队列对，发送队列放「我要发」的待办、接收队列放「我要收」的待办，可靠有序的那一对最接近传统 TCP 连接；队列元素叫 WQE，让应用把任务描述得更细，例如指明数据块的起止；任务完成后 WQE 出队、网卡生成 CQE 放进完成队列，等应用来读，所以 RDMA 是异步的。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="223" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">RDMA：队列对、WQE 与 CQE</text>

  <rect x="22" y="76" width="716" height="90" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="98" font-size="12" fill="#1e40af" text-anchor="middle">抽象：A 直接访问 B 的内存，主体传输不需要两端的操作系统与 CPU</text>
  <text x="380" y="116" font-size="12" fill="#1e40af" text-anchor="middle">编程：不用套接字，用队列对（发送队列 + 接收队列）</text>
  <text x="380" y="134" font-size="12" fill="#1e40af" text-anchor="middle">任务：WQE 让应用描述要做什么，比如数据块的起止</text>
  <text x="380" y="152" font-size="12" fill="#1e40af" text-anchor="middle">完成：WQE 出队，网卡生成 CQE 放进完成队列等应用来读</text>

  <text x="380" y="198" font-size="10" fill="#64748b" text-anchor="middle">RDMA 是异步的：与「数据一到就中断 CPU」正好相反</text>
</svg>
