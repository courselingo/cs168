<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 187" width="760" height="187"
     role="img" aria-labelledby="fig-dcr-1-title fig-dcr-1-desc">
  <title id="fig-dcr-1-title">两条路径只走一条：另一条链路白闲着</title>
  <desc id="fig-dcr-1-desc">左栏是只走一条路：A 与 B 之间的流量全被塞进同一条路径，另一条路径从头到尾没有流量，于是上行 200 Gbps 的带宽只吃到 100 Gbps。右栏是两条路都用：把流量摊到两条路径上，上行就能跑满，而且不需要增加任何链路。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="187" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">只走一条路会浪费什么</text>

  <rect x="22" y="76" width="344" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194" y="98" font-size="12" fill="#9d174d" text-anchor="middle">只走一条路</text>
  <text x="194" y="116" font-size="12" fill="#9d174d" text-anchor="middle">另一条路径全程闲置，上行只吃到一半</text>

  <rect x="394" y="76" width="344" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="98" font-size="12" fill="#166534" text-anchor="middle">两条路都用</text>
  <text x="566" y="116" font-size="12" fill="#166534" text-anchor="middle">上行跑满，不必增加任何链路</text>

  <text x="380" y="162" font-size="10" fill="#64748b" text-anchor="middle">A 与 B 的上行各 200 Gbps，而交换机之间的链路是 100 Gbps</text>
</svg>
