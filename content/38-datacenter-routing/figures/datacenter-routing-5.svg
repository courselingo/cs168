<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 205" width="760" height="205"
     role="img" aria-labelledby="fig-dcr-5-title fig-dcr-5-desc">
  <title id="fig-dcr-5-title">单个字段不够：目的 IP 与源 IP 各自会塌到一条路上</title>
  <desc id="fig-dcr-5-desc">三格并排：只看目的 IP 时，很多源都把分组发给同一个目的地，目的 IP 相同，于是全被映射到同一条链路；只看源 IP 时场景翻了过来，一个源往很多目的地发，源 IP 相同，同样都挤在一条路上；把源与目的 IP 一起哈希再映射到链路，熵就足够了，不会再塌到一条路上。而同一个源与同一个目的之间若有多条大连接，两端 IP 仍然一样，还要把端口也算进来。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="205" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">看哪些字段才够</text>

  <rect x="22" y="76" width="222" height="72" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="133" y="98" font-size="12" fill="#9d174d" text-anchor="middle">只看目的 IP</text>
  <text x="133" y="116" font-size="12" fill="#9d174d" text-anchor="middle">很多源去同一个目的地</text>
  <text x="133" y="134" font-size="12" fill="#9d174d" text-anchor="middle">全塌到一条路</text>

  <rect x="269" y="76" width="222" height="72" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="98" font-size="12" fill="#9d174d" text-anchor="middle">只看源 IP</text>
  <text x="380" y="116" font-size="12" fill="#9d174d" text-anchor="middle">一个源去很多目的地</text>
  <text x="380" y="134" font-size="12" fill="#9d174d" text-anchor="middle">同样塌到一条路</text>

  <rect x="516" y="76" width="222" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="627" y="98" font-size="12" fill="#166534" text-anchor="middle">源与目的一起哈希</text>
  <text x="627" y="116" font-size="12" fill="#166534" text-anchor="middle">熵够了</text>
  <text x="627" y="134" font-size="12" fill="#166534" text-anchor="middle">两种塌法都不会出现</text>

  <text x="380" y="180" font-size="10" fill="#64748b" text-anchor="middle">但同一对源与目的之间若有多条连接，两端 IP 仍一样，要再加上端口</text>
</svg>
