<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 298" width="760" height="298"
     role="img" aria-labelledby="fig-ipmc-5-title fig-ipmc-5-desc">
  <title id="fig-ipmc-5-title">安全这一关：没有访问控制，以及换密钥的麻烦</title>
  <desc id="fig-ipmc-5-desc">上面一条说明这一关的起点：IP 组播没有访问控制，任何人都能加入一个组、任何人都能往任何组发消息。第二排三格是它的后果：想做访问控制（例如只让付费用户看那场比赛）就得另外实现这套功能；缺少访问控制带来的漏洞是恶意发送方往某个组灌包就能让这个组的所有成员被压垮；而这比单播那种替代方案更有效，因为单播里恶意发送方得给每个成员分别灌包。第三排三格是加密的麻烦：给每个组员一个共享密钥来加密，可有人退组呢；如果继续用同一个密钥，退组的人仍然知道密钥、仍然能读你的消息；如果换一个新密钥，还需要一条途径安全地把新密钥分发给剩下的人。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="298" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">安全这一关：没有访问控制，以及换密钥的麻烦</text>
  <rect x="25" y="64" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">IP 组播没有访问控制：任何人都能加入一个组，任何人都能往任何组发消息</text>
  <rect x="25" y="125" width="220" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="143.5" font-size="10" fill="#1e40af" text-anchor="middle">想做访问控制</text>
  <text x="135" y="158.5" font-size="10" fill="#1e40af" text-anchor="middle">例如只让付费用户看那场比赛</text>
  <text x="135" y="173.5" font-size="10" fill="#1e40af" text-anchor="middle">这套功能得另外实现</text>
  <rect x="270" y="125" width="220" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="143.5" font-size="10" fill="#b45309" text-anchor="middle">带来的漏洞</text>
  <text x="380" y="158.5" font-size="10" fill="#b45309" text-anchor="middle">恶意发送方往某个组灌包</text>
  <text x="380" y="173.5" font-size="10" fill="#b45309" text-anchor="middle">就能让这个组的所有成员被压垮</text>
  <rect x="515" y="125" width="220" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="151" font-size="10" fill="#b45309" text-anchor="middle">为什么这比单播更有效</text>
  <text x="625" y="166" font-size="10" fill="#b45309" text-anchor="middle">单播里恶意发送方得给每个成员分别灌包</text>
  <rect x="25" y="213" width="220" height="60" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="135" y="231.5" font-size="10" fill="#6b21a8" text-anchor="middle">加密的麻烦</text>
  <text x="135" y="246.5" font-size="10" fill="#6b21a8" text-anchor="middle">给每个组员一个共享密钥</text>
  <text x="135" y="261.5" font-size="10" fill="#6b21a8" text-anchor="middle">可有人退组呢</text>
  <rect x="270" y="213" width="220" height="60" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="239" font-size="10" fill="#6b21a8" text-anchor="middle">继续用同一个密钥</text>
  <text x="380" y="254" font-size="10" fill="#6b21a8" text-anchor="middle">退组的人仍然知道密钥、仍然能读</text>
  <rect x="515" y="213" width="220" height="60" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="231.5" font-size="10" fill="#6b21a8" text-anchor="middle">换新密钥</text>
  <text x="625" y="246.5" font-size="10" fill="#6b21a8" text-anchor="middle">还需要一条途径</text>
  <text x="625" y="261.5" font-size="10" fill="#6b21a8" text-anchor="middle">安全地把新密钥分发给剩下的人</text>
</svg>
