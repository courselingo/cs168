<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 271" width="760" height="271"
     role="img" aria-labelledby="fig-ipmc-6-title fig-ipmc-6-desc">
  <title id="fig-ipmc-6-title">实践里它落在哪，以及下一步指向覆盖组播</title>
  <desc id="fig-ipmc-6-desc">上面一条是那句结论：因为所有这些难处，今天 IP 组播主要在单个域内使用、而不跨域使用。第二排三格是应用那一边：它们仍有跨网络的群通信需求（例如多人游戏与视频会议），于是各自实现了自己的方案；如果组足够小，可以架一台中央中继服务器，群通信先单播到中继、再由中继单播给其他组员；或者如果组足够小，最朴素的单播方案（给每个组员各发一个单播包）本来也就够用了。最下面一条把问题指向下一讲：覆盖组播把网络功能实现在第七层，而不是第三层。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="271" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">实践里它落在哪，以及下一步指向覆盖组播</text>
  <rect x="25" y="64" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">因为所有这些难处：今天 IP 组播主要在单个域内使用，而不跨域使用</text>
  <rect x="25" y="125" width="220" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="143.5" font-size="10" fill="#1e40af" text-anchor="middle">应用仍有跨网络的群通信需求</text>
  <text x="135" y="158.5" font-size="10" fill="#1e40af" text-anchor="middle">例如多人游戏与视频会议</text>
  <text x="135" y="173.5" font-size="10" fill="#1e40af" text-anchor="middle">它们各自实现了自己的方案</text>
  <rect x="270" y="125" width="220" height="60" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="143.5" font-size="10" fill="#166534" text-anchor="middle">方案一：中央中继服务器</text>
  <text x="380" y="158.5" font-size="10" fill="#166534" text-anchor="middle">组足够小时可用</text>
  <text x="380" y="173.5" font-size="10" fill="#166534" text-anchor="middle">群通信先单播到中继，再由中继单播给其他人</text>
  <rect x="515" y="125" width="220" height="60" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="143.5" font-size="10" fill="#166534" text-anchor="middle">方案二：最朴素的单播</text>
  <text x="625" y="158.5" font-size="10" fill="#166534" text-anchor="middle">组足够小时</text>
  <text x="625" y="173.5" font-size="10" fill="#166534" text-anchor="middle">给每个组员各发一个单播包也就够用了</text>
  <rect x="25" y="213" width="710" height="33" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="233.35" font-size="11" fill="#6b21a8" text-anchor="middle">于是问题指向下一讲：覆盖组播把网络功能实现在第七层，而不是第三层</text>
</svg>
