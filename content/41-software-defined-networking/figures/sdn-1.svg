<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" width="760" height="256"
     role="img" aria-labelledby="fig-sdn-1-title fig-sdn-1-desc">
  <title id="fig-sdn-1-title">这一讲的定位：把「每台路由器各自算」换成「一个中心算好再发下去」</title>
  <desc id="fig-sdn-1-desc">上面三格是前面几讲各自解决了什么：拓扑看这个场景长什么样、有哪些约束；拥塞控制看排队延迟成为主导、小鼠会被大象堵住；路由与地址看协议可以改造、地址可以按拓扑分配。中间一条指出这些讲共同的、没有被动过的前提：控制面始终是每台路由器各自算、各自配。最下面一条是这一讲动它的办法：让一个集中的控制中心算出全部路由，再分发到各台路由器上。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="256" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">这一讲的定位：把「每台路由器各自算」换成「一个中心算好再发下去」</text>
  <rect x="25" y="64" width="220" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">拓扑</text>
  <text x="135" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">这个场景长什么样、有哪些约束</text>
  <rect x="270" y="64" width="220" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">拥塞控制</text>
  <text x="380" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">排队延迟成为主导，小鼠会被大象堵住</text>
  <rect x="515" y="64" width="220" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="625" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">路由与地址</text>
  <text x="625" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">协议可以改造，地址按拓扑分配</text>
  <rect x="25" y="137" width="710" height="33" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="157.35" font-size="11" fill="#b45309" text-anchor="middle">这些讲共同的、没有被动过的前提：控制面始终是每台路由器各自算、各自配</text>
  <rect x="25" y="198" width="710" height="33" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="218.35" font-size="11" fill="#6b21a8" text-anchor="middle">这一讲动它：让一个集中的控制中心算出全部路由，再分发到各台路由器上</text>
</svg>
