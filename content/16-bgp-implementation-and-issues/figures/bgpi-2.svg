<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 223" width="760" height="223"
     role="img" aria-labelledby="fig-bgpi-2-title fig-bgpi-2-desc">
  <title id="fig-bgpi-2-title">eBGP 对外、iBGP 对内，两者都不是 IGP</title>
  <desc id="fig-bgpi-2-desc">左栏是外部 BGP：发生在不同自治系统之间，用来交换宣告、学到通向其他自治系统的路由，只有边界路由器参与。右栏是内部 BGP：发生在同一个自治系统的路由器之间（不要求直连），边界路由器学到新路由后用它分发给本系统的其他路由器，边界与内部路由器都参与。教材特别提醒：iBGP 属于域间协议，帮路由器了解通向其他自治系统的路径；IGP 是域内协议，帮路由器了解本自治系统内的路径，两者容易混。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="223" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两种 BGP 会话</text>

  <rect x="22" y="76" width="344" height="90" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="98" font-size="12" fill="#1e40af" text-anchor="middle">eBGP：跨自治系统</text>
  <text x="194" y="116" font-size="12" fill="#1e40af" text-anchor="middle">只有边界路由器参与</text>
  <text x="194" y="134" font-size="12" fill="#1e40af" text-anchor="middle">学到通向其他 AS 的路由</text>
  <text x="194" y="152" font-size="12" fill="#1e40af" text-anchor="middle">对外交换宣告</text>

  <rect x="394" y="76" width="344" height="90" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="98" font-size="12" fill="#166534" text-anchor="middle">iBGP：本自治系统内</text>
  <text x="566" y="116" font-size="12" fill="#166534" text-anchor="middle">边界与内部路由器都参与</text>
  <text x="566" y="134" font-size="12" fill="#166534" text-anchor="middle">把外部路由分发给自己人</text>
  <text x="566" y="152" font-size="12" fill="#166534" text-anchor="middle">让全系统像一个整体</text>

  <text x="380" y="198" font-size="10" fill="#64748b" text-anchor="middle">iBGP 学的是通向别的 AS 的路；IGP 学的是本 AS 内的路，别把两者混起来</text>
</svg>
