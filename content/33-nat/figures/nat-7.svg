<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268"
     role="img" aria-labelledby="fig-nat-7-title fig-nat-7-desc">
  <title id="fig-nat-7-title">跨讲的那条线：从链路共用，到无环，到二三层互译，到拿到地址，到内外网互译</title>
  <desc id="fig-nat-7-desc">上排三格是这条线的前三讲：第 29 讲解决一根线怎么被多台机器共用；第 30 讲解决一张多段链路的网络如何无环；第 31 讲解决私网内部IP 地址怎么落到链路层地址。第二排两格是后两讲：第 32 讲管新机器刚接进来时怎么拿到 IP 地址；第 33 讲也就是本讲，管内外网之间私有地址怎么变成公网地址。最下面一条总结这条线的作用：前面几讲让私网内部能正常通信，这一讲让私网能跟外面通信。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="268" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">跨讲的那条线：从链路共用，到无环，到二三层互译，到拿到地址，到内外网互译</text>
  <rect x="25" y="64" width="220" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">第 29 讲</text>
  <text x="135" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">一根线怎么被多台机器共用</text>
  <rect x="270" y="64" width="220" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">第 30 讲</text>
  <text x="380" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">一张多段链路的网络如何无环</text>
  <rect x="515" y="64" width="220" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="625" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">第 31 讲</text>
  <text x="625" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">私网内部：IP 地址怎么落到链路层地址</text>
  <rect x="25" y="137" width="342.5" height="45" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="196.25" y="155.5" font-size="10" fill="#166534" text-anchor="middle">第 32 讲</text>
  <text x="196.25" y="170.5" font-size="10" fill="#166534" text-anchor="middle">新机器刚接进来时怎么拿到 IP 地址</text>
  <rect x="392.5" y="137" width="342.5" height="45" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.75" y="155.5" font-size="10" fill="#b45309" text-anchor="middle">第 33 讲（本讲）</text>
  <text x="563.75" y="170.5" font-size="10" fill="#b45309" text-anchor="middle">内外网之间：私有地址怎么变成公网地址</text>
  <rect x="25" y="210" width="710" height="33" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="230.35" font-size="11" fill="#6b21a8" text-anchor="middle">前面几讲让私网内部能正常通信，这一讲让私网能跟外面通信</text>
</svg>
