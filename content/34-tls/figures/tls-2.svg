<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400.5" width="760" height="400.5"
     role="img" aria-labelledby="fig-tls-2-title fig-tls-2-desc">
  <title id="fig-tls-2-title">TLS 的位置：插在应用层与传输层之间的第四点五层</title>
  <desc id="fig-tls-2-desc">上排三格与第二排三格是那套分层图：第七层应用（DNS、HTTP）、第四点五层安全传输（TLS）、第四层传输（TCP、UDP）、第三层网络（IP）、第二层链路（Ethernet）、第一层物理（光纤、铜线）。中间一条解释为什么用这么奇怪的层号：被废弃的第五层与第六层与安全没有关系。第三排两格是它与上下两边的接口：对下面依赖 TCP 的字节流抽象，不去想单个报文、丢包与乱序；对上面提供同样形状的字节流，只不过这条字节流能顶住网络攻击者。最下面一条是推论：HTTP 与 HTTPS 在语义上是同一个协议，区别只在跑在裸 TCP 上还是跑在 TLS 之上。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="400.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">TLS 的位置：插在应用层与传输层之间的第四点五层</text>
  <rect x="25" y="64" width="220" height="45" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="135" y="82.5" font-size="10" fill="#6b21a8" text-anchor="middle">第七层</text>
  <text x="135" y="97.5" font-size="10" fill="#6b21a8" text-anchor="middle">应用：DNS、HTTP</text>
  <rect x="270" y="64" width="220" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">第四点五层</text>
  <text x="380" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">安全传输：TLS</text>
  <rect x="515" y="64" width="220" height="45" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="82.5" font-size="10" fill="#166534" text-anchor="middle">第四层</text>
  <text x="625" y="97.5" font-size="10" fill="#166534" text-anchor="middle">传输：TCP、UDP</text>
  <rect x="25" y="137" width="220" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="135" y="155.5" font-size="10" fill="#1e293b" text-anchor="middle">第三层</text>
  <text x="135" y="170.5" font-size="10" fill="#1e293b" text-anchor="middle">网络：IP</text>
  <rect x="270" y="137" width="220" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="155.5" font-size="10" fill="#1e293b" text-anchor="middle">第二层</text>
  <text x="380" y="170.5" font-size="10" fill="#1e293b" text-anchor="middle">链路：Ethernet</text>
  <rect x="515" y="137" width="220" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="625" y="155.5" font-size="10" fill="#1e293b" text-anchor="middle">第一层</text>
  <text x="625" y="170.5" font-size="10" fill="#1e293b" text-anchor="middle">物理：光纤、铜线</text>
  <rect x="25" y="210" width="710" height="30" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="228.5" font-size="10" fill="#1e40af" text-anchor="middle">为什么用这么奇怪的层号：被废弃的第五层与第六层与安全没有关系</text>
  <rect x="25" y="268" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="288.35" font-size="11" fill="#1e40af" text-anchor="middle">对下面：依赖 TCP 的字节流抽象</text>
  <text x="196.25" y="304.85" font-size="11" fill="#1e40af" text-anchor="middle">不去想单个报文，也不去想丢包与乱序</text>
  <rect x="392.5" y="268" width="342.5" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.75" y="288.35" font-size="11" fill="#166534" text-anchor="middle">对上面：提供同样形状的字节流</text>
  <text x="563.75" y="304.85" font-size="11" fill="#166534" text-anchor="middle">只不过这条字节流能顶住网络攻击者</text>
  <rect x="25" y="345.5" width="710" height="30" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="364" font-size="10" fill="#6b21a8" text-anchor="middle">由此：HTTP 与 HTTPS 在语义上是同一个协议，区别只在跑在裸 TCP 上还是跑在 TLS 之上</text>
</svg>
