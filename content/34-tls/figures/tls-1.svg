<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318.5" width="760" height="318.5"
     role="img" aria-labelledby="fig-tls-1-title fig-tls-1-desc">
  <title id="fig-tls-1-title">TCP 自己的两处不设防：路上被看或被改，以及可能连到攻击者</title>
  <desc id="fig-tls-1-desc">上面一条是这一节的主题：TCP 本身对网络上的攻击者不设防，源文给了两类情形。第二排两格就是这两类：路上被看或被改（恶意路由器或嗅探者可以读也可以改），以及可能连到攻击者（对面根本不是你想连的那台服务器）。中间一条是源文给的例子：为 www.bank.com 做的 DNS 查询被改成映到 6.6.6.6，于是你可能把银行密码发给攻击者。最下面一条是补救方向：在 TCP 之上再加一个协议，给这条可靠的字节流加一层保护。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="318.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">TCP 自己的两处不设防：路上被看或被改，以及可能连到攻击者</text>
  <rect x="25" y="64" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">TCP 本身对网络上的攻击者不设防，源文给了两类情形</text>
  <rect x="25" y="125" width="342.5" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="196.25" y="145.35" font-size="11" fill="#b45309" text-anchor="middle">路上被看或被改</text>
  <text x="196.25" y="161.85" font-size="11" fill="#b45309" text-anchor="middle">恶意路由器或嗅探者可以读、也可以改</text>
  <rect x="392.5" y="125" width="342.5" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.75" y="145.35" font-size="11" fill="#b45309" text-anchor="middle">可能连到攻击者</text>
  <text x="563.75" y="161.85" font-size="11" fill="#b45309" text-anchor="middle">对面根本不是你想连的那台服务器</text>
  <rect x="25" y="202.5" width="710" height="30" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="221" font-size="10" fill="#1e293b" text-anchor="middle">源文的例子：为 www.bank.com 做的 DNS 查询被改成映到 6.6.6.6，于是你可能把银行密码发给攻击者</text>
  <rect x="25" y="260.5" width="710" height="33" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="280.85" font-size="11" fill="#6b21a8" text-anchor="middle">补救：在 TCP 之上再加一个协议（TLS），给这条可靠的字节流加一层保护</text>
</svg>
