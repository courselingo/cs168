<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 488" width="760" height="488"
     role="img" aria-labelledby="fig-dhcp-5-title fig-dhcp-5-desc">
  <title id="fig-dhcp-5-title">Discover 发出去时的头部字段</title>
  <desc id="fig-dhcp-5-desc">六行字段逐个说明：源 MAC 是本机 MAC，服务器可以照它把回答单播回来；目的 MAC 是全 1 的以太网广播地址，第二层不做 ARP 转换，直接把 IPv4 广播地址映射过去；源 IP 是 0.0.0.0，因为协议开始时客户端还没有地址；目的 IP 是 255.255.255.255，也就是 IPv4 广播地址；源端口由客户端随机挑一个；目的端口是 67，服务器在这个固定端口上听请求。最后一行是结论：源 IP 与目的 IP 都写死，客户端不需要知道本地网络的任何事就能开始这套协议。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="488" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">Discover 发出去时的头部字段</text>
  <rect x="25" y="64" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="39" y="84.35" font-size="11" fill="#1e293b" text-anchor="start">源 MAC</text>
  <text x="721" y="84.35" font-size="11" fill="#1e293b" text-anchor="end">本机 MAC，服务器可照它单播回答</text>
  <rect x="25" y="125" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="39" y="145.35" font-size="11" fill="#1e293b" text-anchor="start">目的 MAC</text>
  <text x="721" y="145.35" font-size="11" fill="#1e293b" text-anchor="end">FF:FF:FF:FF:FF:FF，以太网广播地址</text>
  <rect x="25" y="186" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="39" y="206.35" font-size="11" fill="#1e293b" text-anchor="start">源 IP</text>
  <text x="721" y="206.35" font-size="11" fill="#1e293b" text-anchor="end">0.0.0.0，协议开始时客户端还没有地址</text>
  <rect x="25" y="247" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="39" y="267.35" font-size="11" fill="#1e293b" text-anchor="start">目的 IP</text>
  <text x="721" y="267.35" font-size="11" fill="#1e293b" text-anchor="end">255.255.255.255，IPv4 广播地址</text>
  <rect x="25" y="308" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="39" y="328.35" font-size="11" fill="#1e293b" text-anchor="start">源端口</text>
  <text x="721" y="328.35" font-size="11" fill="#1e293b" text-anchor="end">客户端随机挑一个</text>
  <rect x="25" y="369" width="710" height="33" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="39" y="389.35" font-size="11" fill="#1e293b" text-anchor="start">目的端口</text>
  <text x="721" y="389.35" font-size="11" fill="#1e293b" text-anchor="end">67，服务器在这个固定端口上听请求</text>
  <rect x="25" y="430" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="450.35" font-size="11" fill="#1e40af" text-anchor="middle">源 IP 与目的 IP 都写死，客户端不需要知道本地网络的任何事</text>
</svg>
