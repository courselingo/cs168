<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322"
     role="img" aria-labelledby="fig-ttm-6-title fig-ttm-6-desc">
  <title id="fig-ttm-6-title">一个周期发出的分组数 = 曲线下的面积</title>
  <desc id="fig-ttm-6-desc">一条时间轴向右延伸，锯齿形的窗口曲线画在它上方，三个顶点都标着丢包，左侧标 W_max，说明这是窗口的上限、每个顶点都涨到这个高度。中间那一个周期被一块浅蓝色矩形罩住，矩形下方注明：宽等于 1/2 W_max，就是两次丢包之间的时间；高等于 3/4 W_max，就是这个周期的平均窗口；两者相乘，面积等于 3/8 × W_max²，也就是两次丢包之间发出的分组数。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="322" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一个周期发出的分组数 = 曲线下的面积</text>
  <path d="M25,246 L735,246" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="232" y="96" width="240" height="90" fill="#dbeafe" stroke="#3b82f6"/>
  <path d="M72,186 Q 152,141 232,96" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <path d="M232,96 L232,186" fill="none" stroke="#ef4444" stroke-width="2"/>
  <path d="M232,186 Q 352,141 472,96" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <path d="M472,96 L472,186" fill="none" stroke="#ef4444" stroke-width="2"/>
  <path d="M472,186 Q 592,141 712,96" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <path d="M712,96 L712,186" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="46" y="88" font-size="11" fill="#64748b" text-anchor="middle">W_max</text>
  <text x="232" y="74" font-size="11" fill="#64748b" text-anchor="middle">丢包</text>
  <text x="472" y="74" font-size="11" fill="#64748b" text-anchor="middle">丢包</text>
  <text x="712" y="74" font-size="11" fill="#64748b" text-anchor="middle">丢包</text>
  <text x="352" y="214" font-size="11" fill="#64748b" text-anchor="middle">宽 = 1/2 W_max，就是两次丢包之间的时间</text>
  <text x="380" y="272" font-size="11" fill="#64748b" text-anchor="middle">高 = 3/4 W_max（这个周期的平均窗口）</text>
  <text x="380" y="296" font-size="11" fill="#64748b" text-anchor="middle">两者相乘：面积 = 3/8 × W_max²</text>
</svg>
