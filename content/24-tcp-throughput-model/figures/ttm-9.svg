<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" width="760" height="334"
     role="img" aria-labelledby="fig-ttm-9-title fig-ttm-9-desc">
  <title id="fig-ttm-9-title">RTT 差一倍，抢到的带宽就差一倍</title>
  <desc id="fig-ttm-9-desc">三格从上到下：连接一从 A 到 B，RTT 是 100 ms；中间一层是两条连接共用的瓶颈链路，从 R1 到 R2；连接二从 X 到 Y，RTT 是 200 ms。向下的小箭头把它们按上下顺序串起来。第四格给出结果：RTT 小的那条拿到两倍带宽，也就是 3750 与 1875 字节每秒，两条连接的 MSS 都是 50 字节、丢包率相同。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="334" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">RTT 差一倍，抢到的带宽就差一倍</text>
  <rect x="22" y="70" width="715" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="379.5" y="92.2" font-size="12" fill="#1e40af" text-anchor="middle">连接一：A 到 B，RTT = 100 ms</text>
  <rect x="100" y="132" width="560" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="154.2" font-size="12" fill="#6b21a8" text-anchor="middle">瓶颈链路：R1 到 R2，两条连接共用</text>
  <rect x="22" y="194" width="715" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="379.5" y="216.2" font-size="12" fill="#b45309" text-anchor="middle">连接二：X 到 Y，RTT = 200 ms</text>
  <rect x="22" y="256" width="715" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="379.5" y="278.2" font-size="12" fill="#166534" text-anchor="middle">结果：RTT 小的那条拿到两倍带宽</text>
  <text x="379.5" y="296.2" font-size="12" fill="#166534" text-anchor="middle">3750 与 1875 字节每秒（MSS 50 字节、p 相同）</text>
  <path d="M380,111 Q 380,116 380,121" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M380,173 Q 380,178 380,183" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M380,235 Q 380,240 380,245" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
