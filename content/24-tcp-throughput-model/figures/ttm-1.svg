<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" width="760" height="252"
     role="img" aria-labelledby="fig-ttm-1-title fig-ttm-1-desc">
  <title id="fig-ttm-1-title">算法只管加减，公式才给出速率</title>
  <desc id="fig-ttm-1-desc">第一行三格：① 前三讲给的是动作，丢包就减、没丢包就加，没说这条连接跑多快；② 这一讲要补的是数值，一条简单公式，把吞吐量写成往返时间与丢包率的函数；③ 公式拿来做什么，运营商与用户都能估一条 TCP 连接的速率。三格之间各有一支向右的箭头。第二行一条横格是源文原话：这个算法只讲了怎么根据拥塞调整速率，没说那个速率究竟是多少。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="252" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">算法只管加减，公式才给出速率</text>
  <rect x="22" y="76" width="221" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="132.5" y="98.2" font-size="12" fill="#1e40af" text-anchor="middle">① 前三讲给的是动作</text>
  <text x="132.5" y="116.2" font-size="12" fill="#1e40af" text-anchor="middle">丢包就减、没丢包就加</text>
  <text x="132.5" y="134.2" font-size="12" fill="#1e40af" text-anchor="middle">没说这条连接跑多快</text>
  <rect x="268" y="76" width="221" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="378.5" y="98.2" font-size="12" fill="#b45309" text-anchor="middle">② 这一讲要补的是数值</text>
  <text x="378.5" y="116.2" font-size="12" fill="#b45309" text-anchor="middle">一条简单公式</text>
  <text x="378.5" y="134.2" font-size="12" fill="#b45309" text-anchor="middle">吞吐量 = f(RTT, 丢包率 p)</text>
  <rect x="514" y="76" width="221" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="624.5" y="98.2" font-size="12" fill="#166534" text-anchor="middle">③ 公式拿来做什么</text>
  <text x="624.5" y="116.2" font-size="12" fill="#166534" text-anchor="middle">运营商与用户都能估</text>
  <text x="624.5" y="134.2" font-size="12" fill="#166534" text-anchor="middle">一条 TCP 连接的速率</text>
  <path d="M248,112 Q 253,112 258,112" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M494,112 Q 499,112 504,112" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="22" y="174" width="715" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="379.5" y="196.2" font-size="12" fill="#6b21a8" text-anchor="middle">源文原话：这个算法只讲了怎么根据拥塞调整速率</text>
  <text x="379.5" y="214.2" font-size="12" fill="#6b21a8" text-anchor="middle">没说那个速率究竟是多少</text>
</svg>
