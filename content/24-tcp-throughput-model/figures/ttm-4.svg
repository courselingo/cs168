<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 216" width="760" height="216"
     role="img" aria-labelledby="fig-ttm-4-title fig-ttm-4-desc">
  <title id="fig-ttm-4-title">一个周期里窗口的平均值 = 3/4 W_max</title>
  <desc id="fig-ttm-4-desc">一条斜线从图左下爬到图右上，表示窗口在一个周期里线性上升。斜线起点在图左下，旁边标 0.5 W_max，说明这个周期的起点是上限的一半；斜线顶点在图右上，旁边标 W_max，说明上限就是这个峰值。一条灰色水平线横穿整张图，右端标着 平均 = 3/4 W_max，说明这个周期的平均窗口正好落在 0.5 W_max 与 W_max 的中点。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="216" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一个周期里窗口的平均值 = 3/4 W_max</text>
  <path d="M120,186 Q 300,141.0 480,96" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <path d="M25,141 L735,141" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="500" y="100" font-size="11" fill="#64748b" text-anchor="start">W_max</text>
  <text x="48" y="190" font-size="11" fill="#64748b" text-anchor="middle">0.5 W_max</text>
  <text x="735" y="124" font-size="11" fill="#64748b" text-anchor="end">平均 = 3/4 W_max</text>
</svg>
