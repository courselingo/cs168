<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230"
     role="img" aria-labelledby="fig-ttm-7-title fig-ttm-7-desc">
  <title id="fig-ttm-7-title">把 W_max 从式子里解出来</title>
  <desc id="fig-ttm-7-desc">一行三格，箭头把三步串起来：起点是丢包率 p = 8 / (3 × W_max²)；两边同乘 3 × W_max²、再同除 3p，得到中间那格 W_max² = 8 / (3p)；最后两边开平方，得到 W_max = 2√2 / √(3p)，因为 √8 正好等于 2√2。下方一条横格把这三次代数操作逐条写清楚。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="230" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">把 W_max 从式子里解出来</text>
  <rect x="22" y="90" width="221" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="132.5" y="112.2" font-size="12" fill="#1e40af" text-anchor="middle">p = 8 / (3 × W_max²)</text>
  <rect x="268" y="90" width="221" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="378.5" y="112.2" font-size="12" fill="#b45309" text-anchor="middle">W_max² = 8 / (3p)</text>
  <rect x="514" y="90" width="221" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="624.5" y="112.2" font-size="12" fill="#166534" text-anchor="middle">W_max = 2√2 / √(3p)</text>
  <path d="M248,108 Q 253,108 258,108" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M494,108 Q 499,108 504,108" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <rect x="22" y="152" width="715" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="379.5" y="174.2" font-size="12" fill="#6b21a8" text-anchor="middle">第一步两边乘 3 × W_max²，第二步两边除 3p</text>
  <text x="379.5" y="192.2" font-size="12" fill="#6b21a8" text-anchor="middle">第三步两边开平方，√8 正好等于 2√2</text>
</svg>
