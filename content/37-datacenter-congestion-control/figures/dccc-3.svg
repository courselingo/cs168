<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 339.5" width="760" height="339.5"
     role="img" aria-labelledby="fig-dccc-3-title fig-dccc-3-desc">
  <title id="fig-dccc-3-title">小鼠与大象，以及 TCP 在这里出事的机制</title>
  <desc id="fig-dccc-3-desc">上面一条是 TCP 的取向：故意把队列填满直到丢包，靠丢包发现拥塞，而设计者当年没有考虑数据中心。第二排两格是两类连接各自的例子与关注点：小鼠很短、对延迟敏感（例如一次搜索查询与结果页），大象很大、对吞吐敏感（例如服务器之间的数据备份）。第三排三格是出事的链条与结论：大象把速率加上去直到队列满；随后到来的小鼠卡在队列里被拖延；所以算法必须避免把队列填满。最下面一条是源文顺手举的例子：Google 在 2016 年发布的 BBR 用包延迟而不是丢包来判断拥塞，而第 25 讲讲的是同一件事。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="339.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">小鼠与大象，以及 TCP 在这里出事的机制</text>
  <rect x="25" y="64" width="710" height="30" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">TCP 的取向：故意把队列填满直到丢包（靠丢包发现拥塞）；设计者当年没有考虑数据中心</text>
  <rect x="25" y="122" width="342.5" height="60" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="196.25" y="140.5" font-size="10" fill="#166534" text-anchor="middle">小鼠</text>
  <text x="196.25" y="155.5" font-size="10" fill="#166534" text-anchor="middle">很短、对延迟敏感</text>
  <text x="196.25" y="170.5" font-size="10" fill="#166534" text-anchor="middle">例如一次搜索查询与结果页</text>
  <rect x="392.5" y="122" width="342.5" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.75" y="140.5" font-size="10" fill="#b45309" text-anchor="middle">大象</text>
  <text x="563.75" y="155.5" font-size="10" fill="#b45309" text-anchor="middle">很大、对吞吐敏感</text>
  <text x="563.75" y="170.5" font-size="10" fill="#b45309" text-anchor="middle">例如服务器之间的数据备份</text>
  <rect x="25" y="210" width="220" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="230.35" font-size="11" fill="#b45309" text-anchor="middle">于是出事</text>
  <text x="135" y="246.85" font-size="11" fill="#b45309" text-anchor="middle">大象把速率加上去直到队列满</text>
  <rect x="270" y="210" width="220" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="230.35" font-size="11" fill="#b45309" text-anchor="middle">随后到来的小鼠</text>
  <text x="380" y="246.85" font-size="11" fill="#b45309" text-anchor="middle">卡在队列里被拖延</text>
  <rect x="515" y="210" width="220" height="49.5" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="230.35" font-size="11" fill="#6b21a8" text-anchor="middle">结论</text>
  <text x="625" y="246.85" font-size="11" fill="#6b21a8" text-anchor="middle">算法必须避免把队列填满</text>
  <rect x="25" y="287.5" width="710" height="27" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="304.15" font-size="9" fill="#1e293b" text-anchor="middle">源文顺手举的例子：Google 在 2016 年发布的 BBR 用包延迟而不是丢包来判断拥塞（第 25 讲讲的是同一件事）</text>
</svg>
