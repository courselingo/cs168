<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 403" width="760" height="403"
     role="img" aria-labelledby="fig-tcpimpl-5-title fig-tcpimpl-5-desc">
  <title id="fig-tcpimpl-5-title">三次握手：交换两个方向的 ISN</title>
  <desc id="fig-tcpimpl-5-desc">三格自上而下，就是三个报文的先后顺序。第一格：A 发给 B 的 SYN，把 A 的 ISN 放进序列号字段，意思是 A 到 B 的数据从这里开始编号。第二格：B 发给 A 的 SYN-ACK，把 B 的 ISN 放进序列号字段，同时在确认号里确认收到了 A 的 ISN。第三格：A 又发给 B 的 ACK，在确认号里确认收到了 B 的 ISN，握手结束后 B 就可以开始发数据。下方注明握手交换的是两样东西：A 的 ISN 与 B 的 ISN，各管一个方向。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="403" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三次握手：交换两个方向的 ISN</text>

  <rect x="22" y="76" width="715" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="379" y="98" font-size="12" fill="#1e40af" text-anchor="middle">① A 到 B：SYN</text>
  <text x="379" y="116" font-size="12" fill="#1e40af" text-anchor="middle">把 A 的 ISN 放进序列号字段</text>
  <text x="379" y="134" font-size="12" fill="#1e40af" text-anchor="middle">意思是 A 到 B 的数据从这里开始编号</text>

  <rect x="22" y="174" width="715" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="379" y="196" font-size="12" fill="#b45309" text-anchor="middle">② B 到 A：SYN-ACK</text>
  <text x="379" y="214" font-size="12" fill="#b45309" text-anchor="middle">把 B 的 ISN 放进序列号字段</text>
  <text x="379" y="232" font-size="12" fill="#b45309" text-anchor="middle">同时在确认号里确认收到了 A 的 ISN</text>

  <rect x="22" y="272" width="715" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="379" y="294" font-size="12" fill="#166534" text-anchor="middle">③ A 到 B：ACK</text>
  <text x="379" y="312" font-size="12" fill="#166534" text-anchor="middle">在确认号里确认收到了 B 的 ISN</text>
  <text x="379" y="330" font-size="12" fill="#166534" text-anchor="middle">握手结束后 B 就可以开始发数据</text>

  <text x="380" y="378" font-size="10" fill="#64748b" text-anchor="middle">握手要交换两样东西：A 的 ISN 与 B 的 ISN，各管一个方向</text>
</svg>
