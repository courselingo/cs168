<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 205" width="760" height="205"
     role="img" aria-labelledby="fig-tcpimpl-3-title fig-tcpimpl-3-desc">
  <title id="fig-tcpimpl-3-title">状态放在两端</title>
  <desc id="fig-tcpimpl-3-desc">两格并排：发送方要记住哪些字节已经发出、还没被确认，还要维护不满段的计时器与重发用的计时器；接收方要记住那些乱序到达、还不能交给应用的字节。下方注明状态存在两端主机上、网络里不存，所以一条字节流就是一条连接。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="205" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">状态放在两端</text>

  <rect x="22" y="76" width="344" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="98" font-size="12" fill="#1e40af" text-anchor="middle">发送方要记住</text>
  <text x="194" y="116" font-size="12" fill="#1e40af" text-anchor="middle">哪些字节发了没被确认</text>
  <text x="194" y="134" font-size="12" fill="#1e40af" text-anchor="middle">还有不满段与重发的计时器</text>

  <rect x="393" y="76" width="344" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="565" y="98" font-size="12" fill="#166534" text-anchor="middle">接收方要记住</text>
  <text x="565" y="116" font-size="12" fill="#166534" text-anchor="middle">乱序到达的字节</text>
  <text x="565" y="134" font-size="12" fill="#166534" text-anchor="middle">它们还不能交给应用</text>

  <text x="380" y="180" font-size="10" fill="#64748b" text-anchor="middle">状态存在两端主机上，网络里不存：所以一条字节流就是一条连接</text>
</svg>
