<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 421" width="760" height="421"
     role="img" aria-labelledby="fig-tcpimpl-2-title fig-tcpimpl-2-desc">
  <title id="fig-tcpimpl-2-title">字节编号：ISN 是 50 的例子</title>
  <desc id="fig-tcpimpl-2-desc">三格自上而下。第一格：ISN 随机选成 50，第一个字节编号 51，接着 52、53 这样往下编。第二格：某个段装的是第 140 到第 219 号字节，一共 219 减 140 加 1 等于 80 个字节，这个段的序列号就是 140。第三格：确认号是下一个想收到的字节编号，接收方一个字节都没漏时就是 140 加 80 等于 220；推广到首字节编号 X、段里 B 个字节的情形，确认号就是 X 加 B。最下方注明源文在停等推演里把第一个分组的序列号写成 X，与「第一个字节编号 ISN 加 1」相差 1，详情见本页溯源。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="421" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">字节编号：ISN 是 50 的例子</text>

  <rect x="22" y="76" width="715" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="379" y="98" font-size="12" fill="#1e40af" text-anchor="middle">ISN 随机选成 50</text>
  <text x="379" y="116" font-size="12" fill="#1e40af" text-anchor="middle">第一个字节编号 51</text>
  <text x="379" y="134" font-size="12" fill="#1e40af" text-anchor="middle">接着 52、53 这样往下编</text>

  <rect x="22" y="174" width="715" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="379" y="196" font-size="12" fill="#b45309" text-anchor="middle">某个段装第 140 到第 219 号字节</text>
  <text x="379" y="214" font-size="12" fill="#b45309" text-anchor="middle">一共 219 - 140 + 1 = 80 个字节</text>
  <text x="379" y="232" font-size="12" fill="#b45309" text-anchor="middle">这个段的序列号就是 140</text>

  <rect x="22" y="272" width="715" height="90" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="379" y="294" font-size="12" fill="#166534" text-anchor="middle">确认号 = 下一个想收到的字节编号</text>
  <text x="379" y="312" font-size="12" fill="#166534" text-anchor="middle">接收方一个字节都没漏时，就是 140 + 80 = 220</text>
  <text x="379" y="330" font-size="12" fill="#166534" text-anchor="middle">推广：首字节编号 X、段里 B 个字节</text>
  <text x="379" y="348" font-size="12" fill="#166534" text-anchor="middle">确认号就是 X + B</text>

  <text x="380" y="396" font-size="10" fill="#64748b" text-anchor="middle">源文在停等推演里把第一个分组的序列号写成 X，与「第一个字节编号 ISN+1」相差 1，见溯源</text>
</svg>
