<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344"
     role="img" aria-labelledby="fig-solutions-2-title fig-solutions-2-desc">
  <title id="fig-solutions-2-title">转发表：一行一个目的地，同一个下一跳可以被复用</title>
  <desc id="fig-solutions-2-desc">这是路由器 R2 的转发表：目的地 B 的下一跳是 R3，目的地 C 的下一跳也是 R3，说明同一个下一跳可以被多个目的地复用；目的地 A 的下一跳是 R1。把每台中间路由器的转发表都写出来，整个网络就有了一份完整的路由状态。真实路由器里映射的往往是物理端口而不是邻居身份。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="344" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">转发表：一行一个目的地</text>

  <rect x="22" y="66" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="88" font-size="12" fill="#1e40af" text-anchor="middle">路由器 R2 的转发表</text>

  <rect x="22" y="127" width="716" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="149" font-size="12" fill="#1e293b" text-anchor="middle">目的地 B → 下一跳 R3</text>

  <rect x="22" y="188" width="716" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="210" font-size="12" fill="#1e293b" text-anchor="middle">目的地 C → 下一跳 R3（同一个下一跳可以复用）</text>

  <rect x="22" y="249" width="716" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="271" font-size="12" fill="#1e293b" text-anchor="middle">目的地 A → 下一跳 R1</text>

  <text x="380" y="319" font-size="10" fill="#64748b" text-anchor="middle">所有中间路由器的表合起来，就是整个网络的路由状态</text>
</svg>
