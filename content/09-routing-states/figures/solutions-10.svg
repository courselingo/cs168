<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 211" width="760" height="211"
     role="img" aria-labelledby="fig-solutions-10-title fig-solutions-10-desc">
  <title id="fig-solutions-10-title">静态路由：运营者手工填表，以及它仍然必要的地方</title>
  <desc id="fig-solutions-10-desc">左栏是静态路由本身：运营者手工往转发表里写条目，它并不实用，比如不扩展、容易出错。右栏是它仍然必要的地方：直连的机器可以手工配一条直接路由，比如家里那台路由器给你电脑留的条目；某些永远不变的目的地也可以硬编码进表里，无论协议在做什么都稳稳待着。手工的那部分相当于协议的基础项。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="211" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">静态路由：手工填表</text>

  <rect x="22" y="66" width="344" height="90" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="194" y="88" font-size="12" fill="#1e293b" text-anchor="middle">静态路由本身</text>
  <text x="194" y="106" font-size="12" fill="#1e293b" text-anchor="middle">运营者手工写条目</text>
  <text x="194" y="124" font-size="12" fill="#1e293b" text-anchor="middle">不实用：不扩展</text>
  <text x="194" y="142" font-size="12" fill="#1e293b" text-anchor="middle">而且容易出错</text>

  <rect x="394" y="66" width="344" height="90" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="88" font-size="12" fill="#166534" text-anchor="middle">但它仍然必要</text>
  <text x="566" y="106" font-size="12" fill="#166534" text-anchor="middle">直连的机器：直接路由</text>
  <text x="566" y="124" font-size="12" fill="#166534" text-anchor="middle">永不变的路由：硬编码</text>
  <text x="566" y="142" font-size="12" fill="#166534" text-anchor="middle">相当于协议的基础项</text>

  <text x="380" y="186" font-size="10" fill="#64748b" text-anchor="middle">即使实现了路由协议，仍有一些路由需要运营者手工创建</text>
</svg>
