<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 189" width="760" height="189"
     role="img" aria-labelledby="fig-solutions-7-title fig-solutions-7-desc">
  <title id="fig-solutions-7-title">有向投递树：每个节点一支出箭头，会合后不再分叉</title>
  <desc id="fig-solutions-7-desc">箭头依次向右：只看一个目的地时，每台路由器查表得到一支箭头，所以每个节点只有一支出箭头；多条路径一旦会合就再也不分开，因为节点只有一个出箭头；这些路径合起来就是有向投递树；所有箭头都指向目的地。用图论的话说，它必须是以目的地为根的有向生成树：是树所以无环，是生成所以触及每个节点，有向所以指明了转发方向。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="189" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">有向投递树</text>

  <rect x="22" y="76" width="160" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="102" y="98" font-size="12" fill="#1e40af" text-anchor="middle">每个节点</text>
  <text x="102" y="116" font-size="12" fill="#1e40af" text-anchor="middle">只有一支出箭头</text>

  <rect x="207" y="76" width="160" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="287" y="98" font-size="12" fill="#1e40af" text-anchor="middle">路径会合后</text>
  <text x="287" y="116" font-size="12" fill="#1e40af" text-anchor="middle">不再分叉</text>

  <rect x="392" y="76" width="160" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="472" y="98" font-size="12" fill="#b45309" text-anchor="middle">合起来就是</text>
  <text x="472" y="116" font-size="12" fill="#b45309" text-anchor="middle">投递树</text>

  <rect x="577" y="76" width="160" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="657" y="98" font-size="12" fill="#166534" text-anchor="middle">所有箭头</text>
  <text x="657" y="116" font-size="12" fill="#166534" text-anchor="middle">都指向目的地</text>

  <path d="M187,103 L 196,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M372,103 L 381,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M557,103 L 566,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <text x="380" y="164" font-size="10" fill="#64748b" text-anchor="middle">图论说法：以目的地为根的有向生成树；是树所以无环，是生成所以到处可达</text>
</svg>
