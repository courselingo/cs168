<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 205" width="760" height="205"
     role="img" aria-labelledby="fig-solutions-3-title fig-solutions-3-desc">
  <title id="fig-solutions-3-title">基于目的地的转发：同一个目的地永远走同一个下一跳</title>
  <desc id="fig-solutions-3-desc">转发表的用法决定了转发决策只看分组首部里的目的地字段：目的地相同的许多分组都会被送到同一个下一跳，因为一个目的地只映射到一个下一跳。这就是基于目的地的转发，也就是现代互联网在用的做法。理论上还可以靠更多元数据决定转发，但只用在很局限的场合。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="205" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">基于目的地的转发</text>

  <rect x="22" y="76" width="716" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="98" font-size="12" fill="#166534" text-anchor="middle">只看分组首部里的目的地字段</text>
  <text x="380" y="116" font-size="12" fill="#166534" text-anchor="middle">同目的地 → 同下一跳，不可能被送到不同的路由器</text>
  <text x="380" y="134" font-size="12" fill="#166534" text-anchor="middle">这是现代互联网在用的做法</text>

  <text x="380" y="180" font-size="10" fill="#64748b" text-anchor="middle">靠更多元数据决定转发的做法存在，但只用在很局限的场合；本单元假定一个目的地只对应一个下一跳</text>
</svg>
