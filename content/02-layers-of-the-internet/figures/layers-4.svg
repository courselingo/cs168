<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 211" width="760" height="211"
     role="img" aria-labelledby="fig-layers-4-title fig-layers-4-desc">
  <title id="fig-layers-4-title">每片网络放一台交换机，只把交换机连起来</title>
  <desc id="fig-layers-4-desc">网络 A 里的主机把数据交给本网络的交换机，交换机转寄给网络 B 的交换机，再由它送到网络 B 里的主机。这样接出来的结构不随机器数增长。下方标出教材在同一节点出的两个待解问题：怎么找路，以及链路容量够不够。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="211" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">每片网络放一台交换机，只把交换机连起来</text>

  <rect x="22" y="76" width="160" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="102" y="98" font-size="12" fill="#166534" text-anchor="middle">网络 A</text>
  <text x="102" y="116" font-size="12" fill="#166534" text-anchor="middle">里面的主机</text>

  <rect x="207" y="76" width="160" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="287" y="98" font-size="12" fill="#b45309" text-anchor="middle">交换机 A</text>
  <text x="287" y="116" font-size="12" fill="#b45309" text-anchor="middle">收到就转寄</text>

  <rect x="392" y="76" width="160" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="472" y="98" font-size="12" fill="#b45309" text-anchor="middle">交换机 B</text>
  <text x="472" y="116" font-size="12" fill="#b45309" text-anchor="middle">收到就转寄</text>

  <rect x="577" y="76" width="160" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="657" y="98" font-size="12" fill="#166534" text-anchor="middle">网络 B</text>
  <text x="657" y="116" font-size="12" fill="#166534" text-anchor="middle">里面的主机</text>

  <path d="M187,103 L 196,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M372,103 L 381,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M557,103 L 566,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <text x="380" y="164" font-size="11" fill="#1e293b" text-anchor="middle">还没回答两件事之一：交换机怎么知道该往哪转（路由那一章）</text>
  <text x="380" y="186" font-size="11" fill="#1e293b" text-anchor="middle">还没回答两件事之二：链路上有没有足够容量（拥塞控制那一章）</text>
</svg>
