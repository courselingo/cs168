<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 215" width="760" height="215"
     role="img" aria-labelledby="fig-layers-8-title fig-layers-8-desc">
  <title id="fig-layers-8-title">大块数据切成一个个分组，各自独立地上路</title>
  <desc id="fig-layers-8-desc">上面是一段要发的大视频，下面被切成三个分组。每个分组各自独立地在网络里走，因为服务模型是尽力而为，路上任何一台交换机都可能把它丢掉，谁也不能保证它真的到达。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="215" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">大块数据切成一个个分组，各自独立地上路</text>

  <rect x="22" y="66" width="716" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="88" font-size="12" fill="#6b21a8" text-anchor="middle">一段大视频：应用要发的大块数据</text>

  <path d="M132,107 L 132,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M380,107 L 380,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M628,107 L 628,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="127" width="220" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="132" y="149" font-size="12" fill="#1e40af" text-anchor="middle">分组 1</text>

  <rect x="270" y="127" width="220" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="149" font-size="12" fill="#1e40af" text-anchor="middle">分组 2</text>

  <rect x="518" y="127" width="220" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="628" y="149" font-size="12" fill="#1e40af" text-anchor="middle">分组 3</text>

  <text x="380" y="190" font-size="10" fill="#64748b" text-anchor="middle">每个分组单独走，路上任何一台交换机都可能把它丢掉</text>
</svg>
