<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 415" width="760" height="415"
     role="img" aria-labelledby="fig-layers-6-title fig-layers-6-desc">
  <title id="fig-layers-6-title">五层，每层只跟相邻两层打交道</title>
  <desc id="fig-layers-6-desc">从上到下五层，每一层后面跟着它负责的事：应用层用网络的应用，传输层把分组变成可靠的流，网际层把分组送到任意地方，链路层管好一段链路上的共用，物理层把比特送过空间。跳层没有实用的办法，比如在第三层之上直接搭第七层。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="415" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">五层，每层只跟相邻两层打交道</text>

  <rect x="22" y="76" width="716" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="98" font-size="12" fill="#6b21a8" text-anchor="middle">第七层：应用层，用网络的应用</text>

  <rect x="22" y="137" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="159" font-size="12" fill="#1e40af" text-anchor="middle">第四层：传输层，把分组变成可靠的流</text>

  <rect x="22" y="198" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="220" font-size="12" fill="#1e40af" text-anchor="middle">第三层：网际层，把分组送到任意地方</text>

  <rect x="22" y="259" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="281" font-size="12" fill="#166534" text-anchor="middle">第二层：链路层，管好一段链路上的共用</text>

  <rect x="22" y="320" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="342" font-size="12" fill="#b45309" text-anchor="middle">第一层：物理层，把比特送过空间</text>

  <text x="380" y="390" font-size="10" fill="#64748b" text-anchor="middle">上层用下层的服务，下层不关心上层要什么</text>
</svg>
