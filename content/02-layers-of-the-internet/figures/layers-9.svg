<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 265" width="760" height="265"
     role="img" aria-labelledby="fig-layers-9-title fig-layers-9-desc">
  <title id="fig-layers-9-title">第三层送的是一个个分组；第四层给你一条流</title>
  <desc id="fig-layers-9-desc">上面是第三层的视角：分组各自走，可能丢、可能乱序，上层看到的是一份份独立的包。下面是第四层：它重发丢掉的分组、排好乱序的分组，于是上层看到的是两个端点之间的一条流。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="265" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">第三层送的是一个个分组；第四层给你一条流</text>

  <rect x="22" y="76" width="716" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="98" font-size="12" fill="#1e40af" text-anchor="middle">第三层：分组各自走</text>
  <text x="380" y="116" font-size="12" fill="#1e40af" text-anchor="middle">可能丢、可能乱序，上层看到的是一份份独立的包</text>

  <rect x="22" y="160" width="716" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="182" font-size="12" fill="#6b21a8" text-anchor="middle">第四层：重发丢的、排好乱序</text>
  <text x="380" y="200" font-size="12" fill="#6b21a8" text-anchor="middle">上层看到的，是两个端点之间的一串数据</text>

  <text x="380" y="240" font-size="10" fill="#64748b" text-anchor="middle">这就是分层的收益：上面写程序的人不用管分组会不会丢</text>
</svg>
