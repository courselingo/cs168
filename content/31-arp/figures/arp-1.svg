<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 391.5" width="760" height="391.5"
     role="img" aria-labelledby="fig-arp-1-title fig-arp-1-desc">
  <title id="fig-arp-1-title">两层之间的那个空位：目的 IP 已经填好，目的 MAC 还不知道</title>
  <desc id="fig-arp-1-desc">上面一条说明包往下走一层就多包一层头部：第一层先填好目的 IP，第二层还要一个 MAC 地址。第二排四格是帧里几个字段的样子：源 MAC 是 My MAC，目的 MAC 是三个问号，源 IP 是 My IP，目的 IP 是 Server 的 IP。中间一条说明源文配图上的批注就是 What goes here，难处不在填什么值，而在两套地址空间互不相干。第四排两格把两套地址的来路对起来：第三层给的是 IP 地址，按地理分配、入网时拿到；第二层要的是 MAC 地址，按厂家分配、出厂烧进网卡。最下面一条说明两者之间没有可以算出来的关系，所以需要一个问出来的动作。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="391.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两层之间的那个空位：目的 IP 已经填好，目的 MAC 还不知道</text>
  <rect x="25" y="64" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">包往下走一层就多包一层头部：第一层先填好目的 IP，第二层还要一个 MAC 地址</text>
  <rect x="25" y="125" width="158.75" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="104.375" y="143.5" font-size="10" fill="#1e40af" text-anchor="middle">源 MAC</text>
  <text x="104.375" y="158.5" font-size="10" fill="#1e40af" text-anchor="middle">My MAC</text>
  <rect x="208.75" y="125" width="158.75" height="45" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="288.125" y="143.5" font-size="10" fill="#b45309" text-anchor="middle">目的 MAC</text>
  <text x="288.125" y="158.5" font-size="10" fill="#b45309" text-anchor="middle">三个问号</text>
  <rect x="392.5" y="125" width="158.75" height="45" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="471.875" y="143.5" font-size="10" fill="#166534" text-anchor="middle">源 IP</text>
  <text x="471.875" y="158.5" font-size="10" fill="#166534" text-anchor="middle">My IP</text>
  <rect x="576.25" y="125" width="158.75" height="45" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="655.625" y="143.5" font-size="10" fill="#166534" text-anchor="middle">目的 IP</text>
  <text x="655.625" y="158.5" font-size="10" fill="#166534" text-anchor="middle">Server 的 IP</text>
  <rect x="25" y="198" width="710" height="30" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="216.5" font-size="10" fill="#1e293b" text-anchor="middle">源文配图上的批注就是 What goes here：难处不在填什么值，而在两套地址空间互不相干</text>
  <rect x="25" y="256" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="276.35" font-size="11" fill="#1e40af" text-anchor="middle">第三层给的是 IP 地址</text>
  <text x="196.25" y="292.85" font-size="11" fill="#1e40af" text-anchor="middle">按地理分配，入网时拿到</text>
  <rect x="392.5" y="256" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="563.75" y="276.35" font-size="11" fill="#1e40af" text-anchor="middle">第二层要的是 MAC 地址</text>
  <text x="563.75" y="292.85" font-size="11" fill="#1e40af" text-anchor="middle">按厂家分配，出厂烧进网卡</text>
  <rect x="25" y="333.5" width="710" height="33" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="353.85" font-size="11" fill="#6b21a8" text-anchor="middle">两者之间没有任何可以算出来的关系，所以需要一个问出来的动作</text>
</svg>
