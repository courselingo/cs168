<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 247" width="760" height="247"
     role="img" aria-labelledby="fig-tlp-6-title fig-tlp-6-desc">
  <title id="fig-tlp-6-title">靠目的端口号，把同一台服务器回来的分组分开</title>
  <desc id="fig-tlp-6-desc">左边一格写清来源：两个分组都从同一台服务器来，源与目的 IP 地址都一样。中间一格是传输层读首部里的目的端口号，再决定交给哪个应用。右边一格是浏览器与邮件客户端，分别用目的端口 51000 与 51001，同一个 IP 地址下也分得开。下方一格给出两段区间：端口号是 16 位，0-1023 留给服务，1024-65535 临时分给客户，HTTP 用 80、SSH 用 22、DNS 用 53，客户端都提前知道。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="247" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">靠目的端口号，把同一台服务器回来的分组分开</text>

  <rect x="22" y="70" width="200" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="122" y="92" font-size="12" fill="#1e40af" text-anchor="middle">两个分组都从</text>
  <text x="122" y="110" font-size="12" fill="#1e40af" text-anchor="middle">同一台服务器来</text>
  <text x="122" y="128" font-size="12" fill="#1e40af" text-anchor="middle">源与目的 IP 地址都一样</text>

  <rect x="252" y="70" width="256" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="92" font-size="12" fill="#b45309" text-anchor="middle">传输层读首部里的</text>
  <text x="380" y="110" font-size="12" fill="#b45309" text-anchor="middle">目的端口号</text>
  <text x="380" y="128" font-size="12" fill="#b45309" text-anchor="middle">再决定交给哪个应用</text>

  <rect x="538" y="70" width="200" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="638" y="92" font-size="12" fill="#166534" text-anchor="middle">浏览器与邮件客户端</text>
  <text x="638" y="110" font-size="12" fill="#166534" text-anchor="middle">目的端口 51000 与 51001</text>
  <text x="638" y="128" font-size="12" fill="#166534" text-anchor="middle">同一个 IP 地址下分得开</text>

  <path d="M227,106 L241,106" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M513,106 L527,106" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="22" y="172" width="716" height="54" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="194" font-size="12" fill="#1e293b" text-anchor="middle">端口号是 16 位：0-1023 留给服务，1024-65535 临时分给客户</text>
  <text x="380" y="212" font-size="12" fill="#1e293b" text-anchor="middle">HTTP 用 80、SSH 用 22、DNS 用 53，客户端都提前知道</text>
</svg>
