<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 307" width="760" height="307"
     role="img" aria-labelledby="fig-tlp-3-title fig-tlp-3-desc">
  <title id="fig-tlp-3-title">三层承诺：底子只给尽力而为，往上两级由传输层补</title>
  <desc id="fig-tlp-3-desc">最下面一格是网络给的底子：尽力而为，可能丢、可能损坏、可能乱序、可能迟到，极少数还会重复。中间一格是传输层补上的第一级：至少一次，每个分组都要到且不能被损坏，但不保证只到一次。最上面一格是应用看到的：一条长度不限、顺序不变、不丢字节的流，也就是恰好一次。两枚向上的箭头标出这两级是怎么补上的：左边一个写重发补上丢的，右边一个写去掉重复。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="307" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三层承诺：底子只给尽力而为，往上两级由传输层补</text>

  <rect x="22" y="64" width="716" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="86" font-size="12" fill="#166534" text-anchor="middle">应用看到的</text>
  <text x="380" y="104" font-size="12" fill="#166534" text-anchor="middle">一条长度不限、顺序不变、不丢字节的流，也就是恰好一次</text>

  <path d="M360,143 L360,129" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="139" font-size="10" fill="#64748b" text-anchor="middle">去掉重复</text>

  <rect x="22" y="148" width="716" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="170" font-size="12" fill="#b45309" text-anchor="middle">传输层补上的第一级</text>
  <text x="380" y="188" font-size="12" fill="#b45309" text-anchor="middle">至少一次：每个分组都要到、不能被损坏，但不保证只到一次</text>

  <path d="M360,227 L360,213" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="426" y="223" font-size="10" fill="#64748b" text-anchor="middle">重发补上丢的</text>

  <rect x="22" y="232" width="716" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="254" font-size="12" fill="#9d174d" text-anchor="middle">网络给的底子</text>
  <text x="380" y="272" font-size="12" fill="#9d174d" text-anchor="middle">尽力而为：可能丢、可能损坏、可能乱序、可能迟到，极少数还会重复</text>
</svg>
