<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" width="760" height="252"
     role="img" aria-labelledby="fig-tlp-7-title fig-tlp-7-desc">
  <title id="fig-tlp-7-title">字节流像一根管子：从这头塞进去，从那头原样出来</title>
  <desc id="fig-tlp-7-desc">左边是发送方应用，手里是一串长度不限的字节，它不知道下面被切成了几段。中间那根管子写着传输层补上丢的、修好顺序。右边是接收方应用，收到的字节序列与左边一模一样，顺序不变，一个字节都不少。下方一格点明管子里面其实是分组，会丢、会乱、会迟到，是管子这个界面把里面这些事全挡住了。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="252" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">字节流像一根管子：从这头塞进去，从那头原样出来</text>

  <rect x="22" y="76" width="238" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="141" y="98" font-size="12" fill="#1e40af" text-anchor="middle">发送方应用</text>
  <text x="141" y="116" font-size="12" fill="#1e40af" text-anchor="middle">一串字节，长度不限</text>
  <text x="141" y="134" font-size="12" fill="#1e40af" text-anchor="middle">它不知道被切成几段</text>

  <rect x="290" y="76" width="180" height="72" rx="20" fill="#eff6ff" stroke="#2563eb"/>
  <text x="380" y="98" font-size="12" fill="#1d4ed8" text-anchor="middle">传输层</text>
  <text x="380" y="116" font-size="12" fill="#1d4ed8" text-anchor="middle">补上丢的</text>
  <text x="380" y="134" font-size="12" fill="#1d4ed8" text-anchor="middle">修好顺序</text>

  <rect x="500" y="76" width="238" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="619" y="98" font-size="12" fill="#166534" text-anchor="middle">接收方应用</text>
  <text x="619" y="116" font-size="12" fill="#166534" text-anchor="middle">收到一模一样的字节序列</text>
  <text x="619" y="134" font-size="12" fill="#166534" text-anchor="middle">顺序不变，一个都不少</text>

  <rect x="22" y="176" width="716" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="198" font-size="12" fill="#9d174d" text-anchor="middle">管子里面其实是分组：会丢、会乱、会迟到</text>
  <text x="380" y="216" font-size="12" fill="#9d174d" text-anchor="middle">管子这个界面把里面这些事全挡住了</text>
</svg>
