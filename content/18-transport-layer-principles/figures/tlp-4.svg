<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 289" width="760" height="289"
     role="img" aria-labelledby="fig-tlp-4-title fig-tlp-4-desc">
  <title id="fig-tlp-4-title">同一个承诺，两种拿法：蛮力换可靠，与又快又省</title>
  <desc id="fig-tlp-4-desc">两列对照。左列是坏办法：每个分组重发几百次，到达确实有保证，但每个分组都发几百遍，带宽几乎全花在重发上。右列是教材要的办法：尽量快送到、尽量少占带宽、不发送没必要发的分组。下方一行写清教材的判断：可靠性要快要省，不能靠蛮力凑。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="289" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同一个承诺，两种拿法：蛮力换可靠，与又快又省</text>

  <rect x="22" y="64" width="344" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194" y="86" font-size="12" fill="#9d174d" text-anchor="middle">坏办法：每个分组重发几百次</text>

  <rect x="394" y="64" width="344" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="86" font-size="12" fill="#166534" text-anchor="middle">教材要的办法：只在必要时重发</text>

  <rect x="22" y="130" width="344" height="72" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="194" y="152" font-size="12" fill="#1e293b" text-anchor="middle">到达确实有保证</text>
  <text x="194" y="170" font-size="12" fill="#1e293b" text-anchor="middle">但每个分组都发几百遍</text>
  <text x="194" y="188" font-size="12" fill="#1e293b" text-anchor="middle">带宽几乎全花在重发上</text>

  <rect x="394" y="130" width="344" height="72" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="566" y="152" font-size="12" fill="#1e293b" text-anchor="middle">尽量快送到</text>
  <text x="566" y="170" font-size="12" fill="#1e293b" text-anchor="middle">尽量少占带宽</text>
  <text x="566" y="188" font-size="12" fill="#1e293b" text-anchor="middle">不发送没必要发的分组</text>

  <rect x="22" y="232" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="254" font-size="12" fill="#b45309" text-anchor="middle">教材的判断：可靠性要快要省，不能靠蛮力凑</text>
</svg>
