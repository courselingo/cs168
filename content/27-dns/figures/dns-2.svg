<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" width="760" height="402"
     role="img" aria-labelledby="fig-dns-2-title fig-dns-2-desc">
  <title id="fig-dns-2-title">hosts 文件的时代：三个原始应用、一份纸面文件，以及三个撑不住的地方</title>
  <desc id="fig-dns-2-desc">上排三格是 ARPANET 时期的三个应用：远程终端（今天的 SSH）、文件传输（今天的 FTP）与电子邮件（当年要敲 mail alice@46.0.1.2，地址里是 IP）。下面一条是第一次尝试：给每个地址配一个主机名，每台电脑各存一份 hosts.txt，今天还在用（127.0.0.1 与 localhost）。再下面一条是麻烦：这份文件必须处处一致、最初由一个人维护、靠物理复印纸面文件传递。第三排三格是三个撑不住的地方：一个人维护、文件变大、网络中断导致不完整。最后一条是三个时间点：1973 年 RFC606 称之为荒谬、1983 年 RFC882 提出 DNS、1984 年 BIND 出现。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="402" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">hosts 文件的时代：三个原始应用、一份纸面文件，以及三个撑不住的地方</text>
  <rect x="25" y="64" width="220" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="90" font-size="10" fill="#1e40af" text-anchor="middle">远程终端</text>
  <text x="135" y="105" font-size="10" fill="#1e40af" text-anchor="middle">登录到另一台机器执行命令，今天是 SSH</text>
  <rect x="270" y="64" width="220" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="90" font-size="10" fill="#1e40af" text-anchor="middle">文件传输</text>
  <text x="380" y="105" font-size="10" fill="#1e40af" text-anchor="middle">在本地与远端之间传文件，今天的 FTP</text>
  <rect x="515" y="64" width="220" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="625" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">电子邮件</text>
  <text x="625" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">当年要敲 mail alice@46.0.1.2</text>
  <text x="625" y="112.5" font-size="10" fill="#1e40af" text-anchor="middle">地址里写的是 IP</text>
  <rect x="25" y="152" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="172.35" font-size="11" fill="#1e40af" text-anchor="middle">第一次尝试：给每个地址配一个主机名，每台电脑各存一份 hosts.txt；今天还在用，例如 127.0.0.1 与 localhost</text>
  <rect x="25" y="213" width="710" height="33" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="233.35" font-size="11" fill="#b45309" text-anchor="middle">麻烦：这份文件必须处处一致；最初由一个人维护；靠物理复印纸面文件在用户之间传递（1974 年那份还记着负责人、协议与电话）</text>
  <rect x="25" y="274" width="220" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="135" y="292.5" font-size="10" fill="#1e293b" text-anchor="middle">一个人维护</text>
  <text x="135" y="307.5" font-size="10" fill="#1e293b" text-anchor="middle">不能让一个人永远做下去</text>
  <rect x="270" y="274" width="220" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="292.5" font-size="10" fill="#1e293b" text-anchor="middle">文件变大</text>
  <text x="380" y="307.5" font-size="10" fill="#1e293b" text-anchor="middle">分发与下载都很慢</text>
  <rect x="515" y="274" width="220" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="625" y="292.5" font-size="10" fill="#1e293b" text-anchor="middle">网络中断</text>
  <text x="625" y="307.5" font-size="10" fill="#1e293b" text-anchor="middle">手里那份会不完整</text>
  <rect x="25" y="347" width="710" height="30" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="365.5" font-size="10" fill="#6b21a8" text-anchor="middle">1973 年 RFC606 称这种状况为荒谬；1983 年 RFC882 提出 DNS；1984 年 UC Berkeley 的 BIND 是第一份 Unix 上的 DNS 服务器软件</text>
</svg>
