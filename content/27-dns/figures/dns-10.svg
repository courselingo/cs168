<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 293.5" width="760" height="293.5"
     role="img" aria-labelledby="fig-dns-10-title fig-dns-10-desc">
  <title id="fig-dns-10-title">三层意义，以及真实世界的四件事</title>
  <desc id="fig-dns-10-desc">上排三格是同一个区域的三个视角：从命名看，区域里的名字是它的子域（可以有 iris.eecs.berkeley.edu，不能有 math.berkeley.edu）；从基础设施看，这个区域由一台或多台名字服务器支撑；从权威看，这个区域由某个组织控制，权力来自父级下放。第二排两格是真实世界的两件事：ICANN 管根区域、顶级域以 150,000 美元注册价出售，到 2024 年超过 1,500 个；13 个根地址靠任播铺开，f 根有 3,000 多个镜像，根提示里的生存时间是 42 天。第三排两格是另外两件事：MX 记录把域名指向邮件服务器，值里带优先级；多条 A 记录与按来源区分的回答被用来做负载均衡，源文那次实验里旧金山是 20 毫秒，俄勒冈那个地址在源文里写作 35 秒。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="293.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三层意义，以及真实世界的四件事</text>
  <rect x="25" y="64" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">同一个区域的三个视角；源文第 4-09 张配图就是按这三个视角并排画出三个区域</text>
  <rect x="25" y="125" width="220" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="145.35" font-size="11" fill="#1e40af" text-anchor="middle">命名</text>
  <text x="135" y="161.85" font-size="11" fill="#1e40af" text-anchor="middle">区域里的名字是它的子域</text>
  <rect x="270" y="125" width="220" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="145.35" font-size="11" fill="#1e40af" text-anchor="middle">基础设施</text>
  <text x="380" y="161.85" font-size="11" fill="#1e40af" text-anchor="middle">这个区域由一台或多台名字服务器支撑</text>
  <rect x="515" y="125" width="220" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="625" y="145.35" font-size="11" fill="#1e40af" text-anchor="middle">权威</text>
  <text x="625" y="161.85" font-size="11" fill="#1e40af" text-anchor="middle">由某个组织控制，权力来自父级下放</text>
  <rect x="25" y="202.5" width="342.5" height="66" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="196.25" y="222.85" font-size="11" fill="#1e293b" text-anchor="middle">命名视角的例子</text>
  <text x="196.25" y="239.35" font-size="11" fill="#1e293b" text-anchor="middle">区域里可以有 iris.eecs.berkeley.edu</text>
  <text x="196.25" y="255.85" font-size="11" fill="#1e293b" text-anchor="middle">但不能有 math.berkeley.edu</text>
  <rect x="392.5" y="202.5" width="342.5" height="66" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="563.75" y="222.85" font-size="11" fill="#1e293b" text-anchor="middle">权威视角的例子</text>
  <text x="563.75" y="239.35" font-size="11" fill="#1e293b" text-anchor="middle">berkeley.edu 归 UC Berkeley 控制</text>
  <text x="563.75" y="255.85" font-size="11" fill="#1e293b" text-anchor="middle">eecs.berkeley.edu 被下放给 EECS 系</text>
</svg>
