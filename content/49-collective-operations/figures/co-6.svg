<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 207" width="760" height="207"
     role="img" aria-labelledby="fig-co-6-title fig-co-6-desc">
  <title id="fig-co-6-title">三个关于归并的原语：归约、全归约、分散归约</title>
  <desc id="fig-co-6-desc">上排三格是三个归并操作：归约算所有向量的逐元素和并把和向量发给指定的根节点；全归约算逐元素和并把和向量的拷贝发给所有节点；分散归约算逐元素和并把和向量的第 i 个元素发给第 i 个节点。最下面一条说明这里用求和作为归约操作、也可以换成乘法，并说明归约操作通常是可结合、可交换的，也就是可以按任意顺序做而得到同样的结果。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="207" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三个关于归并的原语：归约、全归约、分散归约</text>
  <rect x="25" y="64" width="220" height="60" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="135" y="82.5" font-size="10" fill="#6b21a8" text-anchor="middle">归约</text>
  <text x="135" y="97.5" font-size="10" fill="#6b21a8" text-anchor="middle">算所有向量的逐元素和</text>
  <text x="135" y="112.5" font-size="10" fill="#6b21a8" text-anchor="middle">把和向量发给指定的根节点</text>
  <rect x="270" y="64" width="220" height="60" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="82.5" font-size="10" fill="#6b21a8" text-anchor="middle">全归约</text>
  <text x="380" y="97.5" font-size="10" fill="#6b21a8" text-anchor="middle">算逐元素和</text>
  <text x="380" y="112.5" font-size="10" fill="#6b21a8" text-anchor="middle">把和向量的拷贝发给所有节点</text>
  <rect x="515" y="64" width="220" height="60" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="82.5" font-size="10" fill="#6b21a8" text-anchor="middle">分散归约</text>
  <text x="625" y="97.5" font-size="10" fill="#6b21a8" text-anchor="middle">算逐元素和</text>
  <text x="625" y="112.5" font-size="10" fill="#6b21a8" text-anchor="middle">把和向量的第 i 个元素发给第 i 个节点</text>
  <rect x="25" y="152" width="710" height="30" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="170.5" font-size="10" fill="#1e293b" text-anchor="middle">这里用求和作为归约操作，也可以换成乘法；归约操作通常是可结合、可交换的，也就是可以按任意顺序做而得到同样的结果</text>
</svg>
