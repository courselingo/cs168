<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350"
     role="img" aria-labelledby="fig-co-5-title fig-co-5-desc">
  <title id="fig-co-5-title">四个关于重新分配的原语：广播、分散、收集、全收集</title>
  <desc id="fig-co-5-desc">上排两格是广播与分散：广播取根节点的整个向量、把完整拷贝发给每一个节点；分散取根节点的整个向量、把第 i 个元素发给第 i 个节点。下排两格是收集与全收集：两者都构造「第 i 个元素来自第 i 个节点」的新向量，区别是收集只把它发给指定的根节点，而全收集给每一个节点各发一份拷贝。第四格是广播那三条注记：根节点是参数、可以任选；非根节点的输入不参与生成输出；输入与输出向量不必存在同一位置、共用内存时会被覆盖。最下面一条是收集那处注记：这个操作不会在非根节点的接收缓冲区里留下任何东西。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="350" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">四个关于重新分配的原语：广播、分散、收集、全收集</text>
  <rect x="25" y="64" width="342.5" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">广播</text>
  <text x="196.25" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">取根节点的整个向量</text>
  <text x="196.25" y="112.5" font-size="10" fill="#1e40af" text-anchor="middle">把完整拷贝发给每一个节点</text>
  <rect x="392.5" y="64" width="342.5" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="563.75" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">分散</text>
  <text x="563.75" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">取根节点的整个向量</text>
  <text x="563.75" y="112.5" font-size="10" fill="#1e40af" text-anchor="middle">把第 i 个元素发给第 i 个节点</text>
  <rect x="25" y="152" width="342.5" height="60" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="196.25" y="170.5" font-size="10" fill="#166534" text-anchor="middle">收集</text>
  <text x="196.25" y="185.5" font-size="10" fill="#166534" text-anchor="middle">构造第 i 个元素来自第 i 个节点的新向量</text>
  <text x="196.25" y="200.5" font-size="10" fill="#166534" text-anchor="middle">只把它发给指定的根节点</text>
  <rect x="392.5" y="152" width="342.5" height="60" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="563.75" y="170.5" font-size="10" fill="#166534" text-anchor="middle">全收集</text>
  <text x="563.75" y="185.5" font-size="10" fill="#166534" text-anchor="middle">构造同一个新向量</text>
  <text x="563.75" y="200.5" font-size="10" fill="#166534" text-anchor="middle">给每一个节点各发一份拷贝</text>
  <rect x="25" y="240" width="710" height="27" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="256.65" font-size="9" fill="#b45309" text-anchor="middle">广播那三条注记：根节点是参数，可以任选；非根节点的输入不参与生成输出（像用不到的实参）；输入与输出向量不必存在同一位置，共用内存时会被覆盖</text>
  <rect x="25" y="295" width="710" height="30" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="313.5" font-size="10" fill="#1e293b" text-anchor="middle">收集那处注记：这个操作不会在非根节点的接收缓冲区里留下任何东西</text>
</svg>
