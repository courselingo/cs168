<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 377" width="760" height="377"
     role="img" aria-labelledby="fig-co-2-title fig-co-2-desc">
  <title id="fig-co-2-title">跑在什么上面：一台服务器里的多个 GPU、共用的网卡，以及两种拓扑</title>
  <desc id="fig-co-2-desc">第一排三格是节点的样子与规模，以及又见到的数据中心好处：节点是专门的 GPU（为高效跑矩阵乘法而设计），也可能是 Google 的 TPU；规模可以是几百个到上万个节点；数据中心的好处是物理上靠近、结构化拓扑、同构、高带宽。第二排三格是机房里看到的：服务器照样进机架、每台服务器有一个或多个 GPU、还可能有一颗通常不强的通用 CPU，而同一台服务器上所有 GPU 共用同一张网卡去与其他服务器交换数据。第三排三格是拓扑抽象上的要点：服务器内通信极其高效，可以建模成带宽无限、时延为零的链路；RDMA 可以加速 GPU 内存之间的搬运；两种拓扑是胖树 Clos 与 TPU 的三维环面（边会绕回来）。最下面一条是共同的结论：随便挑一对节点，总有一些对比另一些连得更好。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="377" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">跑在什么上面：一台服务器里的多个 GPU、共用的网卡，以及两种拓扑</text>
  <rect x="25" y="64" width="220" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="135" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">节点是什么</text>
  <text x="135" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">专门的 GPU，为高效跑矩阵乘法而设计</text>
  <text x="135" y="112.5" font-size="10" fill="#1e40af" text-anchor="middle">也可能是 Google 的 TPU</text>
  <rect x="270" y="64" width="220" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">规模</text>
  <text x="380" y="97.5" font-size="10" fill="#1e40af" text-anchor="middle">几百个到上万个节点</text>
  <text x="380" y="112.5" font-size="10" fill="#1e40af" text-anchor="middle">取决于任务与每个节点有多强</text>
  <rect x="515" y="64" width="220" height="60" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="90" font-size="10" fill="#166534" text-anchor="middle">又见到了数据中心的好处</text>
  <text x="625" y="105" font-size="10" fill="#166534" text-anchor="middle">物理上靠近、结构化拓扑、同构、高带宽</text>
  <rect x="25" y="152" width="220" height="60" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="135" y="170.5" font-size="10" fill="#6b21a8" text-anchor="middle">机房里看到什么</text>
  <text x="135" y="185.5" font-size="10" fill="#6b21a8" text-anchor="middle">服务器照样进机架</text>
  <text x="135" y="200.5" font-size="10" fill="#6b21a8" text-anchor="middle">每台服务器有一个或多个 GPU</text>
  <rect x="270" y="152" width="220" height="60" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="178" font-size="10" fill="#6b21a8" text-anchor="middle">还有一颗通用 CPU</text>
  <text x="380" y="193" font-size="10" fill="#6b21a8" text-anchor="middle">通常不强，不承担主要计算</text>
  <rect x="515" y="152" width="220" height="60" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="625" y="170.5" font-size="10" fill="#6b21a8" text-anchor="middle">同一台服务器上所有 GPU</text>
  <text x="625" y="185.5" font-size="10" fill="#6b21a8" text-anchor="middle">共用同一张网卡</text>
  <text x="625" y="200.5" font-size="10" fill="#6b21a8" text-anchor="middle">去与其他服务器交换数据</text>
  <rect x="25" y="240" width="220" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="256.65" font-size="9" fill="#b45309" text-anchor="middle">拓扑抽象的小改</text>
  <text x="135" y="270.15" font-size="9" fill="#b45309" text-anchor="middle">服务器内通信极其高效</text>
  <text x="135" y="283.65" font-size="9" fill="#b45309" text-anchor="middle">可建模成带宽无限、时延为零的链路</text>
  <rect x="270" y="240" width="220" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="263.4" font-size="9" fill="#b45309" text-anchor="middle">RDMA</text>
  <text x="380" y="276.9" font-size="9" fill="#b45309" text-anchor="middle">加速 GPU 内存之间的数据搬运</text>
  <rect x="515" y="240" width="220" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="625" y="263.4" font-size="9" fill="#b45309" text-anchor="middle">两种拓扑</text>
  <text x="625" y="276.9" font-size="9" fill="#b45309" text-anchor="middle">胖树 Clos；TPU 的三维环面（边会绕回来）</text>
  <rect x="25" y="322" width="710" height="30" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="340.5" font-size="10" fill="#1e293b" text-anchor="middle">共同的结论：随便挑一对节点，总有一些对比另一些连得更好</text>
</svg>
