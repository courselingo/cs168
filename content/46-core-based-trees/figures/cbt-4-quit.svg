<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-cbt-4-quit-title fig-cbt-4-quit-desc">
  <title id="fig-cbt-4-quit-title">离开：quit 只发给直接父节点，孩子全退光之后才轮到自己退</title>
  <desc id="fig-cbt-4-quit-desc">成员离开时单播一条 quit 给自己的直接父节点；一台路由器只有在所有孩子都退掉之后才能退，退时也给自己的父发一条 quit。而 quit 只发给直接父节点、不再往下转发。每台路由器还要按树分别记父与子，消息必须指明是哪个组。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">离开：quit 只发给直接父节点，孩子全退光之后才轮到自己退</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">成员想离开：单播一条 quit 给自己的直接父节点</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="147" font-size="12" fill="#b45309" text-anchor="middle">一台路由器只有在它的所有孩子都退掉之后，才能退</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="208" font-size="12" fill="#b45309" text-anchor="middle">退的时候也给自己的父发一条 quit</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="269" font-size="12" fill="#9d174d" text-anchor="middle">关键限制：quit 只发给直接父节点，不再往下转发（与 join 不同）</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="330" font-size="12" fill="#6b21a8" text-anchor="middle">每台路由器要按树分别记父与子，join 与 quit 都必须指明是哪个组</text>
  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">加入是朝根的方向长，离开是从叶子往根的方向拆</text>
</svg>
