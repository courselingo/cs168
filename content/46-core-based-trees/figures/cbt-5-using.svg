<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-cbt-5-using-title fig-cbt-5-using-desc">
  <title id="fig-cbt-5-using-title">两种用法：成员发给父再泛洪到所有树链路；非成员封装后单播给 core，由 core 沿树广播</title>
  <desc id="fig-cbt-5-using-desc">成员发数据时先发给自己的父，再由树上的路由器泛洪到所有树链路；非成员不在树上，于是先封装（外层首部负责到达 core、内层首部是组信息）并单播给 core，core 拆掉外层后沿树广播。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两种用法：成员发给父再泛洪到所有树链路；非成员封装后单播给 core，由 core 沿树广播</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">情况一（自己是成员）：你已经在树上</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="147" font-size="12" fill="#b45309" text-anchor="middle">先把分组发给自己的父，然后树上的路由器把它泛洪到所有树链路（父链路与子链路）</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="208" font-size="12" fill="#9d174d" text-anchor="middle">情况二（自己不是成员）：你不在树上，情况一那招不管用</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="269" font-size="12" fill="#166534" text-anchor="middle">于是先封装再单播给 core：外层首部是到达 core 的单播信息，内层是组信息</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="330" font-size="12" fill="#166534" text-anchor="middle">core 拆掉外层、看到内层，就能沿树把数据广播出去</text>
  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">在树上与不在树上分成两条路，最后都变成沿树泛洪</text>
</svg>
