<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-virt-6-tables-title fig-virt-6-tables-desc">
  <title id="fig-virt-6-tables-title">转发表：虚拟机只装默认路由；虚拟交换机多出封装与解封装两条规则；数据中心交换机一如从前</title>
  <desc id="fig-virt-6-tables-desc">加了封装之后：虚拟机只需一条默认路由指向本机虚拟交换机；虚拟交换机多出两条规则（见虚拟地址就封装、外层目的是自己就解封装）；表只需覆盖本机虚拟机会对话的对象，不需要任意到任意的路由；而数据中心里的交换机与从前完全一样，表里只有物理地址。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">转发表：虚拟机只装默认路由；虚拟交换机多出封装与解封装两条规则；数据中心交换机一如从前</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">虚拟机：只装一条默认路由，把所有分组交给本机虚拟交换机</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="147" font-size="12" fill="#b45309" text-anchor="middle">虚拟交换机规则一：看到虚拟地址就按对应物理地址封装</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="208" font-size="12" fill="#b45309" text-anchor="middle">虚拟交换机规则二：若外层目的地址是自己，就解封装并交给内层地址对应的虚拟机</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="269" font-size="12" fill="#166534" text-anchor="middle">表的规模可控：只需覆盖本机各虚拟机会对话的对象，不需要「任意到任意」的路由</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="330" font-size="12" fill="#166534" text-anchor="middle">数据中心里的交换机与引入虚拟化之前完全一样：表里只有物理地址，仍可聚合</text>
  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">新机制全部压在最边缘的软件里，中间那层网络一点没变</text>
</svg>
