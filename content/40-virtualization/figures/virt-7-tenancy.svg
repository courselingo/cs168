<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450"
     role="img" aria-labelledby="fig-virt-7-tenancy-title fig-virt-7-tenancy-desc">
  <title id="fig-virt-7-tenancy-title">多租户：两家租户都能用 192.0.2.2，靠一个虚拟网络 ID 的首部把上下文带上</title>
  <desc id="fig-virt-7-tenancy-desc">多租户是一个数据中心里跑多个组织的应用；租户之间不该互相通信，也不协调地址，各自使用 RFC 1918 私有网段，于是两家租户可能都有一台 192.0.2.2，数据中心按目的地址转发就无法判断。解法是加一个装虚拟网络 ID 的首部，它不参与转发与路由，只提供上下文。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="450" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">多租户：两家租户都能用 192.0.2.2，靠一个虚拟网络 ID 的首部把上下文带上</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">多租户：一个数据中心里跑多个组织的应用（例如同属 Google 的 Gmail 与 Maps）</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="147" font-size="12" fill="#1e40af" text-anchor="middle">问题一：租户之间通常不该互相通信</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="208" font-size="12" fill="#9d174d" text-anchor="middle">问题二：租户之间不协调地址，各自用私有网段（RFC 1918）</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="269" font-size="12" fill="#9d174d" text-anchor="middle">于是 Pepsi 的一台虚拟机是 192.0.2.2，Coke 的另一台也可能是 192.0.2.2</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="330" font-size="12" fill="#9d174d" text-anchor="middle">对数据中心来说按目的地址转发就无法判断指哪一台 —— 地址重复在实践中必然出现</text>
  <rect x="22" y="369" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="391" font-size="12" fill="#166534" text-anchor="middle">解法：再加一个首部装虚拟网络 ID（租户标识），它不参与转发，只提供上下文</text>
  <text x="380" y="427" font-size="10" fill="#64748b" text-anchor="middle">地址重复是「分不清」，而虚拟网络 ID 负责把「分得清」的上下文带上</text>
</svg>
