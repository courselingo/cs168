<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 389" width="760" height="389"
     role="img" aria-labelledby="fig-virt-4-two-addresses-title fig-virt-4-two-addresses-desc">
  <title id="fig-virt-4-two-addresses-title">两套地址：物理地址由拓扑决定、虚拟地址由现实层级决定，于是聚合失效、转发条目要一台一台地加</title>
  <desc id="fig-virt-4-two-addresses-desc">物理服务器的地址由物理拓扑决定因而可以聚合，而虚拟机的地址常按现实层级分配，同一台物理机上的虚拟机可能没有公共前缀；于是聚合失效、每台虚拟机都要单列一条转发表项，搬家时路由还要重新发现路径。解决办法是分成 underlay 与 overlay 两个子层。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="389" fill="#ffffff"/>
  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两套地址：物理地址由拓扑决定、虚拟地址由现实层级决定，于是聚合失效、转发条目要一台一台地加</text>
  <rect x="22" y="64" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="86" font-size="12" fill="#1e40af" text-anchor="middle">物理服务器 IP：由物理拓扑决定（pod、机柜），可以聚合</text>
  <rect x="22" y="125" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="147" font-size="12" fill="#9d174d" text-anchor="middle">虚拟机 IP：通常按现实层级决定（国家、组织），同一台物理机上可能没有公共前缀</text>
  <rect x="22" y="186" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="208" font-size="12" fill="#9d174d" text-anchor="middle">后果：聚合失效，每台虚拟机都要占一条转发表项</text>
  <rect x="22" y="247" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="269" font-size="12" fill="#9d174d" text-anchor="middle">另一后果：虚拟机搬到别的物理机（地址不变）时，路由协议还要重新发现路径</text>
  <rect x="22" y="308" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="330" font-size="12" fill="#166534" text-anchor="middle">于是同一层里出现两个子层：underlay 管物理机之间，overlay 只管虚拟机之间</text>
  <text x="380" y="366" font-size="10" fill="#64748b" text-anchor="middle">同一层里塞进两套地址，聚合这个省表的办法就不灵了</text>
</svg>
