<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 215" width="760" height="215"
     role="img" aria-labelledby="fig-tcpd-3-title fig-tcpd-3-desc">
  <title id="fig-tcpd-3-title">停等与并行：差别在允许多少个分组同时在途</title>
  <desc id="fig-tcpd-3-desc">左栏是停等协议：分组 1 的 ack 到了才发分组 2，可靠但每个分组至少要花一个往返时间，慢。右栏是并行发送：发出去了、ack 还没回来的分组叫在途，不等 ack 就接着发，快，但一次把要发的全发出去会压垮网络，所以要给在途数量设一个上限。两者的差别只有一个问题：允许多少个分组同时在途。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="215" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">停等与并行</text>

  <rect x="22" y="76" width="344" height="90" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="98" font-size="12" fill="#1e40af" text-anchor="middle">停等：发一个等一个</text>
  <text x="194" y="116" font-size="12" fill="#1e40af" text-anchor="middle">分组 1 的 ack 到了才发 2</text>
  <text x="194" y="134" font-size="12" fill="#1e40af" text-anchor="middle">可靠，但每个分组至少花一个 RTT</text>
  <text x="194" y="152" font-size="12" fill="#1e40af" text-anchor="middle">慢</text>

  <rect x="394" y="76" width="344" height="90" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="98" font-size="12" fill="#166534" text-anchor="middle">并行：不等 ack 接着发</text>
  <text x="566" y="116" font-size="12" fill="#166534" text-anchor="middle">发了、ack 还没回来的叫在途</text>
  <text x="566" y="134" font-size="12" fill="#166534" text-anchor="middle">快，但一次全发会压垮网络</text>
  <text x="566" y="152" font-size="12" fill="#166534" text-anchor="middle">所以要给在途数设上限</text>

  <text x="380" y="190" font-size="10" fill="#64748b" text-anchor="middle">两者的差别只有一个问题：允许多少个分组同时在途</text>
</svg>
