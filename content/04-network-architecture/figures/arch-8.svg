<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221"
     role="img" aria-labelledby="fig-arch-8-title fig-arch-8-desc">
  <title id="fig-arch-8-title">端到端原则不是定理：链路极不可靠时可以往网内加冗余</title>
  <desc id="fig-arch-8-desc">第一种情况：十条链路每条失败 10%，一次发送有 65% 的几率被丢掉。第二种情况：每台路由器改成发两份，每条链路的失败几率降到 0.1%，丢包几率降到 1%。所以无线链路有时会在网内实现可靠性，用来降低错误率、改善端主机的体验。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">端到端原则不是定理：链路极不可靠时可以往网内加冗余</text>

  <rect x="22" y="66" width="716" height="36" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="88" font-size="12" fill="#9d174d" text-anchor="middle">十条链路，每条失败 10%：一次发送有 65% 的几率被丢掉</text>

  <path d="M380,107 L 380,116" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="127" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="149" font-size="12" fill="#166534" text-anchor="middle">每台路由器改成发两份：每条链路失败 0.1%，丢包几率降到 1%</text>

  <text x="380" y="196" font-size="10" fill="#64748b" text-anchor="middle">无线链路有时会在网内实现可靠性，用来降低错误率、改善端主机的体验</text>
</svg>
