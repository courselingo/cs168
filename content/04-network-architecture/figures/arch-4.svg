<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 189" width="760" height="189"
     role="img" aria-labelledby="fig-arch-4-title fig-arch-4-desc">
  <title id="fig-arch-4-title">解复用的链条：一层一层向上交出处理权</title>
  <desc id="fig-arch-4-desc">箭头一路向右：第二层首部说明该由哪个第三层协议处理；第三层首部说明该由哪个第四层协议处理；第四层的端口号说明该交给哪个应用；最后应用拿到数据。每一层都是向上交出处理权，而路由器只解复用到第三层。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="189" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">解复用的链条：一层一层向上交出处理权</text>

  <rect x="22" y="76" width="160" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="102" y="98" font-size="12" fill="#b45309" text-anchor="middle">第二层首部</text>
  <text x="102" y="116" font-size="12" fill="#b45309" text-anchor="middle">交给哪个第三层</text>

  <rect x="207" y="76" width="160" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="287" y="98" font-size="12" fill="#b45309" text-anchor="middle">第三层首部</text>
  <text x="287" y="116" font-size="12" fill="#b45309" text-anchor="middle">交给哪个第四层</text>

  <rect x="392" y="76" width="160" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="472" y="98" font-size="12" fill="#b45309" text-anchor="middle">第四层端口号</text>
  <text x="472" y="116" font-size="12" fill="#b45309" text-anchor="middle">交给哪个应用</text>

  <rect x="577" y="76" width="160" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="657" y="98" font-size="12" fill="#166534" text-anchor="middle">应用</text>
  <text x="657" y="116" font-size="12" fill="#166534" text-anchor="middle">拿到数据</text>

  <path d="M187,103 L 196,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M372,103 L 381,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M557,103 L 566,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <text x="380" y="164" font-size="10" fill="#64748b" text-anchor="middle">每一层都向上交出处理权；路由器只解复用到第三层，不再往上交</text>
</svg>
