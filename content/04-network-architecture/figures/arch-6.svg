<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221"
     role="img" aria-labelledby="fig-arch-6-title fig-arch-6-desc">
  <title id="fig-arch-6-title">两种做法：把可靠性做进网络，还是只做在端主机</title>
  <desc id="fig-arch-6-desc">左边是做法一：在网络里做可靠性，每台路由器都要懂第四层，分组丢了由路由器重发，主机因此要信任网络。右边是做法二：端到端，网络只做尽力而为，丢了由两台主机自己补，正确性握在自己手里。教材的结论是端到端实现已经足够，网络里再加一份只会增加复杂度。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两种做法：把可靠性做进网络，还是只做在端主机</text>

  <rect x="22" y="76" width="344" height="90" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194" y="98" font-size="12" fill="#9d174d" text-anchor="middle">做法一：网络里做可靠性</text>
  <text x="194" y="116" font-size="12" fill="#9d174d" text-anchor="middle">每台路由器都要懂第四层</text>
  <text x="194" y="134" font-size="12" fill="#9d174d" text-anchor="middle">丢了由路由器重发</text>
  <text x="194" y="152" font-size="12" fill="#9d174d" text-anchor="middle">主机只能信任网络</text>

  <rect x="394" y="76" width="344" height="90" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="98" font-size="12" fill="#166534" text-anchor="middle">做法二：端到端</text>
  <text x="566" y="116" font-size="12" fill="#166534" text-anchor="middle">网络只做尽力而为</text>
  <text x="566" y="134" font-size="12" fill="#166534" text-anchor="middle">丢了由两台主机自己补</text>
  <text x="566" y="152" font-size="12" fill="#166534" text-anchor="middle">正确性握在自己手里</text>

  <text x="380" y="196" font-size="10" fill="#64748b" text-anchor="middle">教材的结论：端到端实现已经足够，网络里再加一份只增加复杂度与成本</text>
</svg>
