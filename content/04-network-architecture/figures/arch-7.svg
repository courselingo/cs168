<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 189" width="760" height="189"
     role="img" aria-labelledby="fig-arch-7-title fig-arch-7-desc">
  <title id="fig-arch-7-title">端到端为什么能赢：出了错，谁能修</title>
  <desc id="fig-arch-7-desc">箭头一路向右：代码的正确性握在自己手里，所以出了错能自己修，不必指望别人。反过来，把可靠性交给网络，就等于把正确性交给一台你修不了的机器，而且主机最终还是会自己做一遍端到端检查。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="189" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">端到端为什么能赢：出了错，谁能修</text>

  <rect x="22" y="76" width="222" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="133" y="98" font-size="12" fill="#1e40af" text-anchor="middle">正确性握在自己手里</text>
  <text x="133" y="116" font-size="12" fill="#1e40af" text-anchor="middle">代码是你的</text>

  <rect x="269" y="76" width="222" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="98" font-size="12" fill="#1e40af" text-anchor="middle">出了 bug 能自己修</text>
  <text x="380" y="116" font-size="12" fill="#1e40af" text-anchor="middle">不必等别人</text>

  <rect x="516" y="76" width="222" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="627" y="98" font-size="12" fill="#166534" text-anchor="middle">于是可靠性做对了</text>
  <text x="627" y="116" font-size="12" fill="#166534" text-anchor="middle">不依赖中间设备</text>

  <path d="M249,103 L 258,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M496,103 L 505,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <text x="380" y="164" font-size="10" fill="#64748b" text-anchor="middle">反过来，把可靠性交给网络，等于把正确性交给一台你修不了的机器</text>
</svg>
