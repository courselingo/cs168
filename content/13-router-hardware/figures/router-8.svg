<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 189" width="760" height="189"
     role="img" aria-labelledby="fig-router-8-title fig-router-8-desc">
  <title id="fig-router-8-title">线卡的四件事：PHY、MAC、解析查表、改首部</title>
  <desc id="fig-router-8-desc">箭头依次向右四步：先把光或电的信号解码成 0 和 1，这是 PHY，对应第一层；再读出比特并解析、必要时做链路层操作，这是 MAC，对应第二层；然后解析 IP 分组，判断 IPv4 还是 IPv6、读目的地址并查表，或者发现需要 punt；最后更新首部字段，把 TTL 减一并更新校验和，可能还要处理选项与分片。这四件事都得在几纳秒内完成，而一块转发芯片要同时服务这张线卡上的所有端口。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="189" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">线卡要做的四件事</text>

  <rect x="22" y="76" width="160" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="102" y="98" font-size="12" fill="#1e40af" text-anchor="middle">PHY</text>
  <text x="102" y="116" font-size="12" fill="#1e40af" text-anchor="middle">信号变成比特</text>

  <rect x="207" y="76" width="160" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="287" y="98" font-size="12" fill="#1e40af" text-anchor="middle">MAC</text>
  <text x="287" y="116" font-size="12" fill="#1e40af" text-anchor="middle">解析链路层</text>

  <rect x="392" y="76" width="160" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="472" y="98" font-size="12" fill="#b45309" text-anchor="middle">解析并查表</text>
  <text x="472" y="116" font-size="12" fill="#b45309" text-anchor="middle">或判定要 punt</text>

  <rect x="577" y="76" width="160" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="657" y="98" font-size="12" fill="#166534" text-anchor="middle">改首部</text>
  <text x="657" y="116" font-size="12" fill="#166534" text-anchor="middle">TTL 减一、更新校验和</text>

  <path d="M187,103 L 196,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M372,103 L 381,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M557,103 L 566,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <text x="380" y="164" font-size="10" fill="#64748b" text-anchor="middle">复杂操作（如特殊选项）通常要 punt，所以现代互联网尽量避免选项</text>
</svg>
