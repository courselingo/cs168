<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 205" width="760" height="205"
     role="img" aria-labelledby="fig-router-5-title fig-router-5-desc">
  <title id="fig-router-5-title">机箱内部：线卡之间靠交换网互联，控制卡负责跑协议并写表</title>
  <desc id="fig-router-5-desc">四个格子：左边两张线卡各自带转发芯片与本地 CPU，中间是交换网，箭头表示分组从一张线卡经交换网送到另一张线卡，因为收进来的端口与要发出去的端口往往不在同一张卡上；最右边是控制卡，带自己的 CPU 与其他路由器通信、跑路由协议，算出路径后把转发表项写进各张线卡的转发芯片。教材给的机型有 6 个插槽：4 张线卡、2 张控制卡，另有风扇托盘，交换网在后面。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="205" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">机箱里面</text>

  <rect x="22" y="76" width="160" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="102" y="98" font-size="12" fill="#1e40af" text-anchor="middle">线卡 1</text>
  <text x="102" y="116" font-size="12" fill="#1e40af" text-anchor="middle">转发芯片</text>
  <text x="102" y="134" font-size="12" fill="#1e40af" text-anchor="middle">本地 CPU</text>

  <rect x="207" y="76" width="160" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="287" y="98" font-size="12" fill="#b45309" text-anchor="middle">交换网</text>
  <text x="287" y="116" font-size="12" fill="#b45309" text-anchor="middle">把线卡连起来</text>
  <text x="287" y="134" font-size="12" fill="#b45309" text-anchor="middle">接口芯片最专用</text>

  <rect x="392" y="76" width="160" height="72" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="472" y="98" font-size="12" fill="#1e40af" text-anchor="middle">线卡 2</text>
  <text x="472" y="116" font-size="12" fill="#1e40af" text-anchor="middle">转发芯片</text>
  <text x="472" y="134" font-size="12" fill="#1e40af" text-anchor="middle">本地 CPU</text>

  <rect x="577" y="76" width="160" height="72" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="657" y="98" font-size="12" fill="#166534" text-anchor="middle">控制卡</text>
  <text x="657" y="116" font-size="12" fill="#166534" text-anchor="middle">CPU 跑协议</text>
  <text x="657" y="134" font-size="12" fill="#166534" text-anchor="middle">给转发芯片写表</text>

  <path d="M187,112 L 196,112" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M372,112 L 381,112" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <text x="380" y="180" font-size="10" fill="#64748b" text-anchor="middle">收进来的端口与要发出去的端口常常不在同一张线卡上，所以要交换网</text>
</svg>
