<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 221" width="760" height="221"
     role="img" aria-labelledby="fig-router-6-title fig-router-6-desc">
  <title id="fig-router-6-title">三类分组走三条路径</title>
  <desc id="fig-router-6-desc">三格并排：用户分组最常见，转发芯片读目的地址、查出端口，若端口在别的线卡上就经交换网送过去；控制平面流量的目的地就是路由器自己（例如路由协议的宣告），会被往上送给控制卡由 CPU 处理；punt 流量本身是用户分组，但需要额外处理，例如 TTL 已经到 1、分组过期而可能还要回一条错误消息，于是被踢给控制卡。绝大多数分组走同一条又快又简单的路，需要思考的被集中送到控制卡，代价是慢。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="221" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三类分组</text>

  <rect x="22" y="66" width="222" height="90" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="133" y="88" font-size="12" fill="#166534" text-anchor="middle">用户分组</text>
  <text x="133" y="106" font-size="12" fill="#166534" text-anchor="middle">最常见</text>
  <text x="133" y="124" font-size="12" fill="#166534" text-anchor="middle">查端口后直接发出</text>
  <text x="133" y="142" font-size="12" fill="#166534" text-anchor="middle">跨线卡就走交换网</text>

  <rect x="269" y="66" width="222" height="90" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="88" font-size="12" fill="#b45309" text-anchor="middle">控制平面流量</text>
  <text x="380" y="106" font-size="12" fill="#b45309" text-anchor="middle">目的地是路由器自己</text>
  <text x="380" y="124" font-size="12" fill="#b45309" text-anchor="middle">比如路由协议的宣告</text>
  <text x="380" y="142" font-size="12" fill="#b45309" text-anchor="middle">上送控制卡处理</text>

  <rect x="516" y="66" width="222" height="90" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="627" y="88" font-size="12" fill="#9d174d" text-anchor="middle">punt 流量</text>
  <text x="627" y="106" font-size="12" fill="#9d174d" text-anchor="middle">用户分组但需特殊处理</text>
  <text x="627" y="124" font-size="12" fill="#9d174d" text-anchor="middle">例如 TTL 已到 1</text>
  <text x="627" y="142" font-size="12" fill="#9d174d" text-anchor="middle">踢给控制卡</text>

  <text x="380" y="196" font-size="10" fill="#64748b" text-anchor="middle">需要「想一想」的分组被集中送到控制卡，绝大多数走快路径</text>
</svg>
