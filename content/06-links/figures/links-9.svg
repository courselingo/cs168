<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 189" width="760" height="189"
     role="img" aria-labelledby="fig-links-9-title fig-links-9-desc">
  <title id="fig-links-9-title">瞬时过载：一个分组先进队列，另一个直接发出去</title>
  <desc id="fig-links-9-desc">三列并排：瞬时过载指同一瞬间来了两个分组，而出口一次只能发一个，这在互联网的交换机上极其常见；队列用来存下一个、先发另一个，于是能吸收瞬时突发；由分组调度算法决定任何时刻是先发刚到的分组还是先发队列里的。没有新分组进来时，交换机把队列排空。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="189" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">瞬时过载：一个进队列，一个发出去</text>

  <rect x="22" y="76" width="222" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="133" y="98" font-size="12" fill="#9d174d" text-anchor="middle">瞬时过载</text>
  <text x="133" y="116" font-size="12" fill="#9d174d" text-anchor="middle">同一瞬间来了两个</text>

  <rect x="269" y="76" width="222" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="98" font-size="12" fill="#166534" text-anchor="middle">队列</text>
  <text x="380" y="116" font-size="12" fill="#166534" text-anchor="middle">存一个，发另一个</text>

  <rect x="516" y="76" width="222" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="627" y="98" font-size="12" fill="#1e40af" text-anchor="middle">调度算法</text>
  <text x="627" y="116" font-size="12" fill="#1e40af" text-anchor="middle">决定先发哪个</text>

  <text x="380" y="164" font-size="10" fill="#64748b" text-anchor="middle">没有新分组进来时交换机把队列排空；队列的作用是吸收瞬时突发</text>
</svg>
