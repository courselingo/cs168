<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 189" width="760" height="189"
     role="img" aria-labelledby="fig-links-9-title fig-links-9-desc">
  <title id="fig-links-9-title">瞬时过载：一个分组进队列，另一个先发出去</title>
  <desc id="fig-links-9-desc">箭头依次向右：两个分组同时到达，而出口一次只能发一个；于是其中一个进入队列等着，另一个先被发出去；没有新分组进来时，交换机再把队列排空。至于任何时刻是先发刚到的还是先发队列里的，由分组调度算法决定。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="189" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">瞬时过载：一个进队列，一个先发出去</text>

  <rect x="22" y="76" width="160" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="102" y="98" font-size="12" fill="#9d174d" text-anchor="middle">两个分组同时到</text>
  <text x="102" y="116" font-size="12" fill="#9d174d" text-anchor="middle">出口一次只能发一个</text>

  <rect x="207" y="76" width="160" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="287" y="98" font-size="12" fill="#b45309" text-anchor="middle">队列</text>
  <text x="287" y="116" font-size="12" fill="#b45309" text-anchor="middle">存下一个等着</text>

  <rect x="392" y="76" width="160" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="472" y="98" font-size="12" fill="#1e40af" text-anchor="middle">出口</text>
  <text x="472" y="116" font-size="12" fill="#1e40af" text-anchor="middle">先发另一个</text>

  <rect x="577" y="76" width="160" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="657" y="98" font-size="12" fill="#166534" text-anchor="middle">队列排空</text>
  <text x="657" y="116" font-size="12" fill="#166534" text-anchor="middle">没有新分组进来时</text>

  <path d="M187,103 L 196,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M372,103 L 381,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M557,103 L 566,103" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <text x="380" y="164" font-size="10" fill="#64748b" text-anchor="middle">任何时刻先发刚到的还是先发队列里的，由分组调度算法决定</text>
</svg>
