<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 233" width="760" height="233"
     role="img" aria-labelledby="fig-links-4-title fig-links-4-desc">
  <title id="fig-links-4-title">同一对链路，发小分组时链路 2 更好，发大分组时链路 1 更好</title>
  <desc id="fig-links-4-desc">上排是两条链路的参数：链路 1 带宽 10 Mbps、传播时延 10 毫秒，带宽高但传播时延长；链路 2 带宽 1 Mbps、传播时延 1 毫秒，带宽低但传播时延短。下排是两种分组大小下的结论：发 10 字节时链路 2 更好，因为传播时延主导；发 10,000 字节时链路 1 更好，18 毫秒对 81 毫秒，因为发送时延主导。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="233" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">同一对链路，换个分组大小，答案就反过来</text>

  <rect x="22" y="66" width="344" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="194" y="88" font-size="12" fill="#1e40af" text-anchor="middle">链路 1：10 Mbps / 10 毫秒</text>
  <text x="194" y="106" font-size="12" fill="#1e40af" text-anchor="middle">带宽高，传播时延长</text>

  <rect x="394" y="66" width="344" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="566" y="88" font-size="12" fill="#1e40af" text-anchor="middle">链路 2：1 Mbps / 1 毫秒</text>
  <text x="566" y="106" font-size="12" fill="#1e40af" text-anchor="middle">带宽低，传播时延短</text>

  <rect x="22" y="145" width="344" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194" y="167" font-size="12" fill="#166534" text-anchor="middle">发 10 字节：链路 2 更好</text>

  <rect x="394" y="145" width="344" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="566" y="167" font-size="12" fill="#b45309" text-anchor="middle">发 10,000 字节：链路 1 更好（18 对 81 毫秒）</text>

  <text x="380" y="208" font-size="10" fill="#64748b" text-anchor="middle">小分组看传播时延，大分组看发送时延</text>
</svg>
