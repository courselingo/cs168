<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 293" width="760" height="293"
     role="img" aria-labelledby="fig-links-2-title fig-links-2-desc">
  <title id="fig-links-2-title">时序图上的三个时刻</title>
  <desc id="fig-links-2-desc">自上而下是时间推进：第一位上线在第 1 微秒；第一位到达是 1 微秒加 1 毫秒；最后一位到达是 0.8 毫秒加 1 毫秒，等于 1.8 毫秒，这时整个分组才算到达。例子取自教材：带宽 1 Mbps、传播时延 1 毫秒、分组 100 字节也就是 800 位。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="293" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">时序图上的三个时刻</text>

  <rect x="22" y="76" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="98" font-size="12" fill="#1e40af" text-anchor="middle">① 第一位上线：第 1 微秒</text>

  <rect x="22" y="137" width="716" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="380" y="159" font-size="12" fill="#1e40af" text-anchor="middle">② 第一位到达：1 微秒加 1 毫秒</text>

  <rect x="22" y="198" width="716" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="220" font-size="12" fill="#166534" text-anchor="middle">③ 最后一位到达：0.8 毫秒加 1 毫秒，等于 1.8 毫秒</text>

  <text x="380" y="268" font-size="10" fill="#64748b" text-anchor="middle">例子：带宽 1 Mbps、传播时延 1 毫秒、分组 100 字节（800 位）</text>
</svg>
