<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 205" width="760" height="205"
     role="img" aria-labelledby="fig-links-5-title fig-links-5-desc">
  <title id="fig-links-5-title">两个症状，两个病因，以及各自无效的那种补救</title>
  <desc id="fig-links-5-desc">左边是画质差，病因是带宽不够，此时缩短传播时延没有用；右边是回话慢，病因是传播时延太长，此时加大带宽没有用。两个补救办法各自治不了对方的病，这就是教材用视频通话举的例子。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="205" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">两个症状，两个病因</text>

  <rect x="22" y="76" width="344" height="72" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="194" y="98" font-size="12" fill="#9d174d" text-anchor="middle">症状：画质差</text>
  <text x="194" y="116" font-size="12" fill="#9d174d" text-anchor="middle">病因：带宽不够</text>
  <text x="194" y="134" font-size="12" fill="#9d174d" text-anchor="middle">缩短传播时延没用</text>

  <rect x="394" y="76" width="344" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="566" y="98" font-size="12" fill="#b45309" text-anchor="middle">症状：回话慢</text>
  <text x="566" y="116" font-size="12" fill="#b45309" text-anchor="middle">病因：传播时延太长</text>
  <text x="566" y="134" font-size="12" fill="#b45309" text-anchor="middle">加大带宽没用</text>

  <text x="380" y="180" font-size="10" fill="#64748b" text-anchor="middle">先分清是带宽不够还是传播太慢，再决定往哪使劲</text>
</svg>
