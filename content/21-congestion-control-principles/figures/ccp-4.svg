<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" width="760" height="252"
     role="img" aria-labelledby="fig-ccp-4-title fig-ccp-4-desc">
  <title id="fig-ccp-4-title">修法落在主机的操作系统里</title>
  <desc id="fig-ccp-4-desc">上方一个通栏框：修复落在主机的操作系统里，改的是 TCP 自己的逻辑，窗口跟着丢包动态调整，路由器与应用都没有参与。框下方两条向下的箭头分别指向两个并排的框：左边是路由器，不用升级；右边是应用，不用改。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="252" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">修法落在主机的操作系统里</text>

  <rect x="22" y="76" width="716" height="72" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="98" font-size="12" fill="#6b21a8" text-anchor="middle">修复落在主机的操作系统里</text>
  <text x="380" y="116" font-size="12" fill="#6b21a8" text-anchor="middle">改的是 TCP 自己的逻辑：窗口跟着丢包动态调整</text>
  <text x="380" y="134" font-size="12" fill="#6b21a8" text-anchor="middle">路由器与应用都没有参与</text>
  <path d="M194,153 L194,165" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M566,153 L566,165" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="22" y="176" width="344" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="194" y="198" font-size="12" fill="#b45309" text-anchor="middle">路由器</text>
  <text x="194" y="216" font-size="12" fill="#b45309" text-anchor="middle">不用升级</text>
  <rect x="394" y="176" width="344" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="566" y="198" font-size="12" fill="#166534" text-anchor="middle">应用</text>
  <text x="566" y="216" font-size="12" fill="#166534" text-anchor="middle">不用改</text>
</svg>
