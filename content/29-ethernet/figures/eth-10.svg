<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448.5" width="760" height="448.5"
     role="img" aria-labelledby="fig-eth-10-title fig-eth-10-desc">
  <title id="fig-eth-10-title">只用第二层的两个后果：地址没法聚合，以及交换机与路由器的分工</title>
  <desc id="fig-eth-10-desc">上排两格是只建第二层网络的正反两面：第二层自己也能转发，机器之间甚至能跑二层自己的路由协议；但 MAC 地址按厂家分配，没有清晰的办法聚合成大块，而 IP 按地理分配才好聚合。中间一条给出结论：不能只用第二层建出全球互联网，源文给的理由就是地址没法聚合这一条。第三排三格是多链路带来的工程问题与一个真实例子：广播要保证被交换机从所有出端口转发出去；组播在多链路下更麻烦，需要额外协议；例子是 Apple 的 Bonjour 与 mDNS，设备硬编码加入一个组，用组播询问与回应，还用 DNS 的 SRV 记录把机器映射到能力。第四排三格是交换机、路由器与今天的实情：交换机只处理第一层与第二层，路由器要处理到第三层，而今天几乎所有交换机也实现了第三层，于是两个词混着用。最下面一条是历史注脚：以太网比互联网还早，那才是这两个词当初有区别的原因。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="448.5" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">只用第二层的两个后果：地址没法聚合，以及交换机与路由器的分工</text>
  <rect x="25" y="64" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="84.35" font-size="11" fill="#1e40af" text-anchor="middle">第二层自己也能转发</text>
  <text x="196.25" y="100.85" font-size="11" fill="#1e40af" text-anchor="middle">机器之间甚至能跑二层自己的路由协议</text>
  <rect x="392.5" y="64" width="342.5" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.75" y="84.35" font-size="11" fill="#b45309" text-anchor="middle">但 MAC 地址没法聚合</text>
  <text x="563.75" y="100.85" font-size="11" fill="#b45309" text-anchor="middle">IP 按地理分配才好聚成大块；MAC 按厂家分配</text>
  <rect x="25" y="141.5" width="710" height="33" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="161.85" font-size="11" fill="#1e40af" text-anchor="middle">所以不能只用第二层建出全球互联网，源文给的理由就是这一条</text>
  <rect x="25" y="202.5" width="220" height="75" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="135" y="236" font-size="10" fill="#1e293b" text-anchor="middle">多链路时</text>
  <text x="135" y="251" font-size="10" fill="#1e293b" text-anchor="middle">广播要保证被交换机从所有出端口转发出去</text>
  <rect x="270" y="202.5" width="220" height="75" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="380" y="236" font-size="10" fill="#1e293b" text-anchor="middle">组播在多链路下</text>
  <text x="380" y="251" font-size="10" fill="#1e293b" text-anchor="middle">更麻烦，需要额外协议</text>
  <rect x="515" y="202.5" width="220" height="75" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="625" y="221" font-size="10" fill="#1e293b" text-anchor="middle">Bonjour 与 mDNS</text>
  <text x="625" y="236" font-size="10" fill="#1e293b" text-anchor="middle">Apple 设备硬编码加入一个组</text>
  <text x="625" y="251" font-size="10" fill="#1e293b" text-anchor="middle">用组播询问与回应</text>
  <text x="625" y="266" font-size="10" fill="#1e293b" text-anchor="middle">还用到 DNS 的 SRV 记录</text>
  <rect x="25" y="305.5" width="220" height="60" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="135" y="331.1" font-size="11" fill="#166534" text-anchor="middle">交换机</text>
  <text x="135" y="347.6" font-size="11" fill="#166534" text-anchor="middle">只处理第一层与第二层</text>
  <rect x="270" y="305.5" width="220" height="60" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="331.1" font-size="11" fill="#166534" text-anchor="middle">路由器</text>
  <text x="380" y="347.6" font-size="11" fill="#166534" text-anchor="middle">要处理到第三层</text>
  <rect x="515" y="305.5" width="220" height="60" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="625" y="324" font-size="10" fill="#166534" text-anchor="middle">今天的实情</text>
  <text x="625" y="339" font-size="10" fill="#166534" text-anchor="middle">几乎所有交换机也实现了第三层</text>
  <text x="625" y="354" font-size="10" fill="#166534" text-anchor="middle">于是两个词混着用</text>
  <rect x="25" y="393.5" width="710" height="30" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="412" font-size="10" fill="#6b21a8" text-anchor="middle">历史：以太网比互联网还早，那才是这两个词当初有区别的原因</text>
</svg>
