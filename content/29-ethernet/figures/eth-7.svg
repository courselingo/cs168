<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" width="760" height="332"
     role="img" aria-labelledby="fig-eth-7-title fig-eth-7-desc">
  <title id="fig-eth-7-title">ALOHANet 的不对称设计：中心一条专用频率，远端共享另一条</title>
  <desc id="fig-eth-7-desc">上面一条是背景：1968 年 Norman Abramson 在夏威夷大学，中心计算机在一个岛上，其他岛上的机器要访问它。第二排两格是不对称的两半：中心节点用自己专用的频率发，只有一个发送方所以不会冲突；远端节点在另一条共享频率上发，彼此之间会撞车。第三排两格补上收听关系与这个设计成立的理由：中心节点听远端那条频率，所以中心不会与远端撞车；而中心要发的东西比远端多，所以给它一条专用频率是划算的。最下面一条说明它的历史位置：它是最早用随机访问处理冲突的系统之一，用不礼貌的裸版本，而以太网用的是 CSMA/CD。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="332" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">ALOHANet 的不对称设计：中心一条专用频率，远端共享另一条</text>
  <rect x="25" y="64" width="710" height="30" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="380" y="82.5" font-size="10" fill="#1e40af" text-anchor="middle">1968 年 Norman Abramson 在夏威夷大学：中心计算机在一个岛上，其他岛上的机器要访问它</text>
  <rect x="25" y="122" width="342.5" height="49.5" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="196.25" y="142.35" font-size="11" fill="#166534" text-anchor="middle">中心节点</text>
  <text x="196.25" y="158.85" font-size="11" fill="#166534" text-anchor="middle">用自己专用的频率发，只有一个发送方，所以不会冲突</text>
  <rect x="392.5" y="122" width="342.5" height="49.5" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="563.75" y="142.35" font-size="11" fill="#b45309" text-anchor="middle">远端节点</text>
  <text x="563.75" y="158.85" font-size="11" fill="#b45309" text-anchor="middle">在另一条共享频率上发，彼此之间会撞车</text>
  <rect x="25" y="199.5" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="196.25" y="219.85" font-size="11" fill="#1e40af" text-anchor="middle">中心节点听远端那条频率</text>
  <text x="196.25" y="236.35" font-size="11" fill="#1e40af" text-anchor="middle">所以中心不会与远端撞车</text>
  <rect x="392.5" y="199.5" width="342.5" height="49.5" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="563.75" y="219.85" font-size="11" fill="#1e40af" text-anchor="middle">这个不对称成立的理由</text>
  <text x="563.75" y="236.35" font-size="11" fill="#1e40af" text-anchor="middle">中心要发的东西比远端多</text>
  <rect x="25" y="277" width="710" height="30" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="295.5" font-size="10" fill="#6b21a8" text-anchor="middle">ALOHANet 是最早用随机访问处理冲突的系统之一；它用不礼貌的裸版本，以太网用 CSMA/CD</text>
</svg>
