    ⇒ 项目与作业解答**永久排除**，与授权宽严无关；已写进 banner_extra。
    ⚠️ 这一段是学术诚信条款，**不是许可条款** —— 不能拿它当课程的许可依据来引用。

四、教材仓库 berkeley-cs168/textbook —— 无 LICENSE 文件
  default_branch = main（从仓库页 JSON 取得）；
  main/LICENSE、master/LICENSE、gh-pages/LICENSE(.md/.txt) 全部 404（响应正文 "404: Not Found"）。
  main/README.md 存在但**不含任何许可措辞**。
  ⇒ 仓库侧无依据；教材的许可依据只有渲染后的根页。此项与 course-selection.md §5 第 10 项一致。

结论（落到【按材料类型】的字段上，见下表）：
  * textbook = true  —— 教材可翻译、可转载，须署名 + **以 CC BY-SA 4.0 发布衍生作品**；
  * notes / slides / video / other = false —— 课程站材料未声明，只做原创讲解，
    不产出逐字稿，不注入双语原文对照；
  * 作业 / 项目答案：永久排除，不因授权宽严而改变。
'''

# 按材料类型逐项核实。一旦写了这个表，授权闸门就**只认它**，不再看 verified。
# 所以绝不能顺手写一版全 false 的「假装核实过」——这里是逐页查过之后的真实取值。
[license.materials]
textbook = true      # 教材根页有逐字许可声明（见 notes 一）
notes = false        # 课程站讲义/笔记：0 声明
slides = false       # 幻灯片在 Google Slides 外链，平台条款另计，未核实
video = false        # 视频在 YouTube 外链，平台条款另计，未核实
other = false        # 项目页、讨论课 PDF：站内自有文件，但站点 0 声明

[output]
default_mode = "explanation"

# ── 内容审计的「点名对象」（audit_content.py 读这里）──────────────────
# 通用脚本里的默认名单偏分布式系统；计算机网络课点的是协议、工具与命令行。
[audit]
named_systems = [
  "IP", "IPv4", "TCP", "UDP", "TCP/IP", "DNS", "HTTP", "HTTPS", "TLS", "QUIC",
  "BGP", "OSPF", "Ethernet", "Wi-Fi", "ARP", "DHCP", "NAT", "RFC", "socket",
  "Wireshark", "traceroute", "ping", "mininet", "Linux", "Chrome",
  "Firefox", "Zoom", "AT&T", "Amazon Web Services", "Netflix",
]
named_systems_min = 5

# ── 站点（GitHub Pages）──────────────────────────────────────────────
# build_site.py 用这两项生成 MkDocs 的 repo_url / site_url。
[site]
repo = "courselingo/cs168"
url = "https://courselingo.github.io/cs168/"
